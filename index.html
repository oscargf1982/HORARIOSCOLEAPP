    tutorUnavailSlots[t.id]=new Set((t.unavail||[]).map(u=>`${u.d}-${u.s}`));
  });

  // CACHÉ de entradas estáticas: grupo por nombre y franjas-especialista por
  // nombre de grupo. Los grupos y sus tutores NO cambian durante una
  // generación, así que se precalculan una vez y las funciones calientes
  // (getFreeSlots, taskPressure, forwardCheck) dejan de hacer .find() lineal
  // miles de veces. Sin riesgo de invalidación: no hay nada que invalidar.
  const groupByName=new Map(S.groups.map(g=>[g.name,g]));
  const specialistSlotsByGname=new Map(S.groups.map(g=>[
    g.name,
    (g.tutorId&&tutorUnavailSlots[g.tutorId])||new Set()
  ]));

  function getSpecialistSlotsForGroup(gname){
    return specialistSlotsByGname.get(gname)||new Set();
  }

  function getFreeSlots(gname,tid,day,code,allowMustFill){
    const mustFill=getSpecialistSlotsForGroup(gname);
    const groupTutorId=groupByName.get(gname)?.tutorId;
    const isTutorOwn=tid&&tid===groupTutorId;
    // RESTRICCIÓN DURA: no puede haber el mismo día dos sesiones de EF ni de
    // Inglés (LEX) para un mismo grupo. Si ese día ya tiene esa materia
    // colocada, NINGUNA franja de ese día es válida para otra sesión de la
    // misma materia — se corta antes de mirar franja a franja.
    if(code==="EF"||code==="LEX"){
      const yaEseDia=lectSlots.some(sl=>sched[gname][day]?.[sl]?.s===code);
      if(yaEseDia) return [];
    }
    return lectSlots.filter(slot=>{
      if(sched[gname][day][slot]) return false;
      if(tid&&((teacherBusy[tid][day]>>(slot))&1)) return false;
      if(code&&violatesSharedSpace(gname,code,day,slot)) return false;
      // El tutor no usa franjas reservadas a especialistas salvo en último
      // recurso (allowMustFill): así los especialistas las cogen primero,
      // pero la última pieza del tutor (CS/PLST de 1h) no se queda sin hueco.
      if(isTutorOwn&&!allowMustFill&&mustFill.has(`${day}-${slot}`)) return false;
      return true;
    });
  }

  // ── PRESSURE SCORING DINÁMICO ────────────────────────────────────
  // Calcula la presión ACTUAL de cada tarea en tiempo real
  // pressure = sesiones_necesarias / franjas_disponibles
  // Cuanto mayor, más urgente colocar esta tarea primero
  function taskPressure(task){
    if(!task.tid) return 0;
    let free=0;
    DAYS_N.forEach(d=>{ free+=getFreeSlots(task.gname,task.tid,d,task.code).length; });
    let p = free>0?task.sessions/free:999;
    // Empujón moderado para PLÁSTICA de tutor: son piezas de 1h muy flexibles
    // que, si se dejan para el final, no encuentran hueco (las clases rígidas
    // ya ocuparon todo). Subir su presión las coloca antes de que se agoten
    // los huecos, sin llegar a competir con las materias troncales rígidas.
    if(task.code==='PLST') p += 0.35;
    // Empujón para MÚSICA: el profesor de música va a los 12 grupos con su
    // agenda muy fragmentada, así que sus músicas (1h cada una) son las piezas
    // que más se atascan al final. Adelantarlas las coloca cuando aún hay días
    // libres coincidentes, reduciendo los flecos de música.
    if(task.code==='MUS') p += 0.40;
    return p;
  }

  // ── FORWARD CHECKING REAL ────────────────────────────────────────
  // Después de colocar una sesión en (gname,day,slot,tid):
  // Verifica que TODAS las tareas pendientes del mismo profesor
  // y del mismo grupo siguen teniendo al menos 1 slot posible.
  // Si alguna queda sin slots → fallo inmediato (detectar temprano).
  function forwardCheck(placedTid,placedGname,placedDay,placedSlot){
    // 1. Verificar tareas pendientes del mismo profesor
    for(const task of tasks){
      if(task._placed) continue;
      if(task.tid!==placedTid) continue;
      let free=0;
      DAYS_N.forEach(d=>{ free+=getFreeSlots(task.gname,task.tid,d,task.code).length; });
      if(free<task.sessions) return false; // dominio vacío
    }
    // 2. Verificar tareas pendientes del mismo grupo
    for(const task of tasks){
      if(task._placed) continue;
      if(task.gname!==placedGname) continue;
      if(!task.tid) continue;
      let free=0;
      DAYS_N.forEach(d=>{ free+=getFreeSlots(task.gname,task.tid,d,task.code).length; });
      if(free<task.sessions) return false; // dominio vacío
    }
    return true;
  }

  // ── EJECTION CHAINS (swaps encadenados) ─────────────────────────
  // A→B→C→D→hueco libre: mucho más potente que swaps simples A↔B
  // Profundidad máxima de cadena: 4 pasos
  function ejectionChain(failedTask, depth=0, visited=new Set()){
    if(depth>4) return false;
    if(!failedTask.tid) return false;
    const esEspecialidadUnicaEC=(failedTask.code==="EF"||failedTask.code==="LEX");

    for(const day of DAYS_N){
      // RESTRICCIÓN DURA: si este día ya tiene EF/Inglés para este grupo,
      // ningún hueco de este día es candidato — ni por expulsión de bloqueante.
      if(esEspecialidadUnicaEC&&lectSlots.some(sl=>sched[failedTask.gname][day]?.[sl]?.s===failedTask.code)) continue;
      for(const slot of lectSlots){
        // ¿Puede ir la tarea fallida aquí?
        if(sched[failedTask.gname][day][slot]) continue;
        if(((teacherBusy[failedTask.tid][day]>>(slot))&1)){
          // El profesor está ocupado aquí — ¿en qué otro grupo?
          for(const og of primGroups){
            if(og.name===failedTask.gname) continue;
            const blocker=sched[og.name][day]?.[slot];
            if(!blocker||blocker.t!==failedTask.tid) continue;
            const key=`${og.name}-${blocker.s}-${day}-${slot}`;
            if(visited.has(key)) continue;
            visited.add(key);
            // Intentar mover el bloqueante a otro hueco
            const blockerTask={gname:og.name,code:blocker.s,tid:blocker.t,sessions:1};
            // Guardar estado
            const savedCell=sched[og.name][day][slot];
            delete sched[og.name][day][slot];
            teacherBusy[failedTask.tid][day]&=~(1<<(slot));
            // Intentar colocar el bloqueante en otro sitio (recursivo)
            for(const ad of DAYS_N){
              for(const as of lectSlots){
                if(ad===day&&as===slot) continue;
                if(sched[og.name][ad]?.[as]) continue;
                if(blocker.t&&((teacherBusy[blocker.t][ad]>>(as))&1)) continue;
                if(violatesSharedSpace(og.name,blocker.s,ad,as)) continue;
                if(blocker.s==="REL"&&og.tutorId&&sched[og.name][ad]?.[as]?.t===og.tutorId) continue;
                // Mover bloqueante
                sched[og.name][ad][as]=savedCell;
                if(blocker.t) teacherBusy[blocker.t][ad]|=(1<<(as));
                // ¿Ahora puede ir la tarea fallida?
                if(!((teacherBusy[failedTask.tid][day]>>(slot))&1)&&
                   !violatesSharedSpace(failedTask.gname,failedTask.code,day,slot)){
                  sched[failedTask.gname][day][slot]={s:failedTask.code,t:failedTask.tid};
                  teacherBusy[failedTask.tid][day]|=(1<<(slot));
                  return true;
                }
                // No pudo — intentar cadena más profunda
                if(ejectionChain({gname:og.name,code:blocker.s,tid:blocker.t,sessions:1,_placed:false},
                                  depth+1, visited)){
                  // Guarda de invariante: solo colocar si la franja quedó REALMENTE
                  // libre para T (la recursión pudo haber dejado ocupado el hueco
                  // por otra vía, sin esto se duplicaba la sesión del bloqueante).
                  if(!sched[failedTask.gname][day][slot] &&
                     !((teacherBusy[failedTask.tid][day]>>(slot))&1) &&
                     !violatesSharedSpace(failedTask.gname,failedTask.code,day,slot)){
                    sched[failedTask.gname][day][slot]={s:failedTask.code,t:failedTask.tid};
                    teacherBusy[failedTask.tid][day]|=(1<<(slot));
                    return true;
                  }
                  // La recursión no liberó realmente la franja: revertir su efecto
                  delete sched[og.name][ad][as];
                  if(blocker.t) teacherBusy[blocker.t][ad]&=~(1<<(as));
                  continue;
                }
                // Revertir movimiento del bloqueante
                delete sched[og.name][ad][as];
                if(blocker.t) teacherBusy[blocker.t][ad]&=~(1<<(as));
              }
            }
            // Revertir: restaurar bloqueante
            sched[og.name][day][slot]=savedCell;
            teacherBusy[failedTask.tid][day]|=(1<<(slot));
          }
        }
      }
    }
    return false;
  }

  const mikelId=S.teachers.find(t=>t.name==="Mikel")?.id||null;

  function mikelSubPriority(task){
    if(task.tid!==mikelId) return 0;
    if(task.code==="MAT"||task.code==="PLST") return 1;
    if(task.code==="MUS") return 2;
    return 3;
  }

  function specialistSlotsNeeded(gname){
    const g=groupByName.get(gname);
    if(!g?.tutorId) return 0;
    return (getSpecialistSlotsForGroup(gname).size)+(tutorCrossGroupCount[g.tutorId]||0);
  }

  // ── OPTIMIZACIÓN DIRIGIDA: mapa de presión por franja ────────────
  // Para cada franja (day-slot), calcular cuántos especialistas están
  // bloqueados. Las franjas con más bloqueos son las más conflictivas
  // y necesitan llenarse primero con lo que SÍ puede ir.
  const slotPressure={}; // "day-slot" → número de especialistas bloqueados
  DAYS_N.forEach(day=>{
    lectSlots.forEach(slot=>{
      let blocked=0;
      S.teachers.forEach(t=>{
        if((t.unavail||[]).some(u=>u.d===day&&u.s===slot)){
          if(tasks.some(tk=>tk.tid===t.id)) blocked++;
        }
      });
      slotPressure[`${day}-${slot}`]=blocked;
    });
  });

  // Franjas ordenadas por presión DESC — las más conflictivas primero
  const slotsByPressure=[...DAYS_N.flatMap(d=>
    lectSlots.map(s=>({day:d,slot:s,pressure:slotPressure[`${d}-${s}`]||0}))
  )].sort((a,b)=>b.pressure-a.pressure);

  // Las N franjas más conflictivas (1ª y última del día son las peores)
  const highPressureSlots=new Set(
    slotsByPressure.filter(x=>x.pressure>=2).map(x=>`${x.day}-${x.slot}`)
  );

  // IDs de Teresa y Arancha para reglas especiales
  const teresaId=S.teachers.find(t=>t.name==="Teresa")?.id||null;
  const aranchaId=S.teachers.find(t=>t.name==="Arancha Inglés")?.id||null;
  const noeliaTid=S.teachers.find(t=>t.name==="Rocío")?.id||null;
  const richiId=S.teachers.find(t=>t.name==="Richi")?.id||null;
  // Mejora #3 auditoría: índice Map para el "cross-group genérico" de scoreSlot,
  // evita un tasks.find() lineal (O(tareas)) en cada slot candidato evaluado.
  const taskByKey=new Map(tasks.map(t=>[`${t.tid}|${t.gname}|${t.code}`, t]));
  const grupo1B=S.groups.find(g=>g.name==="1ºB");
  // Slots antes del recreo (1ª,2ª,3ª) y después (4ª=6,5ª=7)
  const antesRecreo=new Set(lectSlots.filter(s=>s<=3));
  const despuesRecreo=new Set(lectSlots.filter(s=>s>3));

  function taskPriority(task){
    const tid=task.tid;
    if(!tid) return 90;
    const tname=gt(tid)?.name||"";
    if(tname==="Teresa") return task.gname==="1ºB"?2:99;
    if(tname==="Elba") return 98;
    const own=primGroups.find(g=>g.tutorId===tid);
    const isTutorOwn=own&&own.name===task.gname;
    const isCross=crossGroupSessions.has(task);

    // CLAVE: materias del tutor con MUCHAS sesiones (≥3) en su grupo van ANTES
    // que REL cross-group. Así se reservan sus franjas críticas primero.
    if(isTutorOwn&&task.sessions>=3) return 0.3;

    if(isCross){
      if(tname==="Bea R") return 0.1;
      if(tname==="Arancha Inglés") return 0.2;
      return 0.5+(criticality[tid]||0)*0.4;
    }
    if(isTutorOwn&&task.sessions===2) return 1;
    // Mikel: 95% presión, margen +1 → colocar inmediatamente después de cross-group
    if(tname==="Mikel") return 1.5+mikelSubPriority(task)*0.1;
    if(tname==="Diego") return 4;
    if(tname==="Richi") return 6;
    if(tname==="Rocío"&&task.gname==="1ºB") return 2.5;
    if(isTutorOwn&&task.sessions===1) return 7;
    if(isTutorOwn){
      const tObj=S.teachers.find(t=>t.id===tid);
      const unavail=(tObj?.unavail||[]).filter(u=>lectSlots.includes(u.s)).length;
      return 30+Math.min(19,lectSlots.length*5-unavail);
    }
    const needed=specialistSlotsNeeded(task.gname);
    return Math.max(8,15-Math.min(9,needed+Math.round((criticality[tid]||0)*3)));
  }

  function scoreSlot(gname,tid,day,slot,code){
    let score=0;
    // 🧠 MEMORIA DE ÉXITOS (evolutiva): franjas vistas en horarios completos
    // reciben bonificación proporcional a la CALIDAD de aquellos horarios.
    // Es preferencia blanda: orienta la búsqueda, nunca prohíbe una solución.
    if(S.memOn!==false&&S.successMem){
      const w=S.successMem[gname+"|"+code+"|"+day+"|"+slot];
      if(w) score-=Math.min(60,Math.log2(1+w)*7);
    }
    const groupTutorId=groupByName.get(gname)?.tutorId;
    const isSpec=tid&&tid!==groupTutorId;
    const mustFill=getSpecialistSlotsForGroup(gname);

    // ── REGLAS ESPECIALES 1ºB ────────────────────────────────────
    if(gname==="1ºB"){
      // Arancha en su propio grupo (1ºB): preferir ANTES del recreo
      if(tid===aranchaId&&antesRecreo.has(slot)) score-=50;
      if(tid===aranchaId&&despuesRecreo.has(slot)) score+=50;
      // Teresa en 1ºB: después del recreo, repartida entre 4ª(slot6) y 5ª(slot7)
      // Penalizar antes del recreo fuertemente
      if(tid===teresaId&&antesRecreo.has(slot)) score+=80;
      // Entre las franjas post-recreo, dar ligera preferencia a 5ª (última)
      if(tid===teresaId&&slot===7) score-=85; // 5ª hora = muy preferible
      if(tid===teresaId&&slot===6) score-=75; // 4ª hora = también buena
      // Rocío en 1ºB (antes Noelia): preferir después del recreo
      if(tid===noeliaTid&&despuesRecreo.has(slot)) score-=40;
      if(tid===noeliaTid&&antesRecreo.has(slot)) score+=40;
    }

    // ── REGLA TERESA (MAT) fuera de 1ºB: repartir 1 por día ──────
    // 2ºB encaja al límite: tras colocar a Arancha/Mikel quedan justo 5
    // huecos para las 5 MAT de Teresa, que deben caer en 5 días distintos
    // (no puede dar 2 MAT el mismo día). Penalizamos con fuerza duplicar día.
    if(tid===teresaId&&gname!=="1ºB"&&code==="s1"){
      const yaEseDia=lectSlots.some(sl=>{
        const c=sched[gname]?.[day]?.[sl];
        return c&&c.t===teresaId&&c.s==="s1";
      });
      if(yaEseDia) score+=200; // ya hay MAT de Teresa ese día → evitar a toda costa
    }

    // ── REGLA ARANCHA EN OTROS GRUPOS: últimas horas ─────────────
    // Cuando Arancha va a dar LEX a 3ºA o 3ºB (cross-group),
    // preferir las ÚLTIMAS horas del día (4ª=slot6, 5ª=slot7)
    if(tid===aranchaId&&gname!=="1ºB"){
      if(despuesRecreo.has(slot)) score-=60; // muy preferible
      if(antesRecreo.has(slot)) score+=60;   // evitar antes del recreo
    }

    // Cross-group genérico
    const taskRef=isSpec?taskByKey.get(`${tid}|${gname}|${code}`):null;
    const isCrossTask=taskRef&&crossGroupSessions.has(taskRef);
    if(isCrossTask&&tid!==aranchaId){ // Arancha ya tiene su regla específica
      const hostGroup=groupByName.get(gname);
      const hostUnavail=hostGroup?.tutorId?tutorUnavailSlots[hostGroup.tutorId]:new Set();
      if(hostUnavail?.has(`${day}-${slot}`)) score-=100; else score+=20;
    } else if(isSpec&&mustFill.size>0&&tid!==aranchaId){
      if(mustFill.has(`${day}-${slot}`)) score-=50; else score+=10;
    }

    // Presión de franja
    const pressure=slotPressure[`${day}-${slot}`]||0;
    if(pressure>=2){
      if(isSpec)  score-=pressure*5;
      else        score+=pressure*8;
    }

    // ── RICHI: preferir Mié y Lun primeras horas (pabellón libre de Oscar) ──
    if(tid===richiId){
      // Mié: Oscar no puede ir (sindicato) → pabellón libre
      if(day===3) score-=15;
      // Lun primeras horas: Oscar bloqueado → pabellón libre
      if(day===1&&slot<=3) score-=12;
      // Evitar Mar/Jue/Vie donde Oscar puede coincidir
      if([2,4,5].includes(day)) score+=5;
    }

    return score;
  }

  // ── LÓGICA DE SIMULTANEIDAD ELBA ─────────────────────────────────
  // Elba da Religión en paralelo con el tutor que da Proyecto Competencial.
  // Deben ir en la MISMA franja del mismo grupo.
  // Implementación: cuando colocamos REL del tutor, forzamos que Elba
  // vaya en esa misma franja. Cuando colocamos REL de Elba, buscamos
  // la franja donde el tutor ya colocó REL.

  const elbaId=S.teachers.find(t=>t.name==="Elba")?.id||null;

  function getTutorRelSlot(gname){
    // Busca la franja donde YA está colocada REL en este grupo
    // (la imparte quien sea: tutor u otro profesor, pero NO Elba)
    for(const day of DAYS_N){
      for(const slot of lectSlots){
        const cell=sched[gname][day]?.[slot];
        if(cell?.s==="REL"&&cell.t!==elbaId) return {day,slot};
      }
    }
    return null;
  }

  // Swap repair
  function trySwapRepair(failedTask){
    if(!failedTask.tid) return false;

    // ── PASO A: swap dentro del mismo grupo ─────────────────────
    for(const day of DAYS_N){
      for(const slot of lectSlots){
        const cell=sched[failedTask.gname][day][slot];
        if(!cell||cell.t===failedTask.tid) continue;
        if(((teacherBusy[failedTask.tid][day]>>(slot))&1)) continue;
        const eCode=cell.s, eTid=cell.t;
        for(const ad of DAYS_N){
          for(const as of lectSlots){
            if(ad===day&&as===slot) continue;
            if(sched[failedTask.gname][ad][as]) continue;
            if(eTid&&((teacherBusy[eTid][ad]>>(as))&1)) continue;
            if(violatesSharedSpace(failedTask.gname,eCode,ad,as)) continue;
            sched[failedTask.gname][ad][as]=cell;
            if(eTid) teacherBusy[eTid][ad]|=(1<<(as));
            delete sched[failedTask.gname][day][slot];
            if(eTid) teacherBusy[eTid][day]&=~(1<<(slot));
            if(!((teacherBusy[failedTask.tid][day]>>(slot))&1)&&
               !violatesSharedSpace(failedTask.gname,failedTask.code,day,slot)&&
               !((failedTask.code==="EF"||failedTask.code==="LEX")&&
                 lectSlots.some(sl2=>sched[failedTask.gname][day]?.[sl2]?.s===failedTask.code))){
              sched[failedTask.gname][day][slot]={s:failedTask.code,t:failedTask.tid};
              teacherBusy[failedTask.tid][day]|=(1<<(slot));
              return true;
            }
            sched[failedTask.gname][day][slot]=cell;
            if(eTid) teacherBusy[eTid][day]|=(1<<(slot));
            delete sched[failedTask.gname][ad][as];
            if(eTid) teacherBusy[eTid][ad]&=~(1<<(as));
          }
        }
      }
    }

    // ── PASO B: swap cruzado — el profesor está ocupado en OTRO grupo ──
    // Buscar franjas donde el grupo tiene hueco pero el profesor está en otro grupo,
    // y mover esa sesión del otro grupo a una franja alternativa
    for(const day of DAYS_N){
      for(const slot of lectSlots){
        if(sched[failedTask.gname][day][slot]) continue;
        if(!((teacherBusy[failedTask.tid][day]>>(slot))&1)) continue;
        if(violatesSharedSpace(failedTask.gname,failedTask.code,day,slot)) continue;
        for(const otherGroup of primGroups){
          if(otherGroup.name===failedTask.gname) continue;
          const otherCell=sched[otherGroup.name][day]?.[slot];
          if(!otherCell||otherCell.t!==failedTask.tid) continue;
          const oCode=otherCell.s;
          const otherTutorId=otherGroup.tutorId;
          // Buscar hueco alternativo en el otro grupo
          for(const ad of DAYS_N){
            for(const as of lectSlots){
              if(ad===day&&as===slot) continue;
              if(sched[otherGroup.name][ad]?.[as]) continue;
              if(((teacherBusy[failedTask.tid][ad]>>(as))&1)) continue;
              if(violatesSharedSpace(otherGroup.name,oCode,ad,as)) continue;
              // VERIFICACIÓN CRÍTICA: si la sesión a mover es REL/PC (desdoble),
              // el tutor anfitrión NO puede estar en su propio grupo en la nueva franja.
              // Si está, el desdoble no es posible porque no hay quién atienda al otro grupo.
              if(oCode==="REL"&&otherTutorId){
                const tutorInOwnGroup=!!sched[otherGroup.name][ad]?.[as]&&
                  sched[otherGroup.name][ad][as].t===otherTutorId;
                // También verificar que el tutor no esté ocupado en su propio grupo en ad/as
                const tutorBusyInOwn=DAYS_N.some(()=>false)||
                  ((teacherBusy[otherTutorId]&&(teacherBusy[otherTutorId][ad]>>(as))&1)&&
                   primGroups.some(pg=>pg.name===otherGroup.name&&
                     sched[pg.name][ad]?.[as]?.t===otherTutorId));
                if(tutorInOwnGroup) continue;
                // El tutor anfitrión debe estar FUERA de su grupo en ad/as
                // (es decir, en otro grupo o libre) para que el desdoble funcione
                const tutorInThisGroupAtNewSlot=sched[otherGroup.name][ad]?.[as]?.t===otherTutorId;
                if(tutorInThisGroupAtNewSlot) continue;
              }
              // Mover la sesión del otro grupo y colocar la tarea fallida
              // RESTRICCIÓN DURA: EF/Inglés nunca 2 veces el mismo día.
              if((failedTask.code==="EF"||failedTask.code==="LEX")&&
                 lectSlots.some(sl2=>sched[failedTask.gname][day]?.[sl2]?.s===failedTask.code)) continue;
              sched[otherGroup.name][ad][as]=otherCell;
              teacherBusy[failedTask.tid][ad]|=(1<<(as));
              delete sched[otherGroup.name][day][slot];
              teacherBusy[failedTask.tid][day]&=~(1<<(slot));
              sched[failedTask.gname][day][slot]={s:failedTask.code,t:failedTask.tid};
              teacherBusy[failedTask.tid][day]|=(1<<(slot));
              return true;
            }
          }
        }
      }
    }

    return false;
  }

  // Min-conflicts repair
  function minConflictsRepair(failedTask, faltanReal){
    // DESACTIVADO A PROPÓSITO: su lógica de "mover bloqueantes" podía crear
    // duplicados de EF/Inglés el mismo día en casos de profesorado muy
    // ajustado de horario (ver investigación EF/Inglés). Verificado que el
    // coste en sesiones sin colocar es nulo o incluso mejor sin ella (24 vs
    // 26 en 10 pruebas) frente al beneficio de garantizar la restricción dura.
    return 0;
    if(!failedTask.tid) return 0;
    const objetivo = faltanReal!==undefined ? faltanReal : failedTask.sessions;
    let repaired=0;
    const slots_free=[];
    DAYS_N.forEach(day=>{
      lectSlots.forEach(slot=>{
        if(!sched[failedTask.gname][day][slot]&&
           !((teacherBusy[failedTask.tid][day]>>(slot))&1)&&
           !violatesSharedSpace(failedTask.gname,failedTask.code,day,slot)){
          slots_free.push({day,slot});
        }
      });
    });
    // Buscar celdas del grupo que bloquean pero se pueden mover
    const blockers=[];
    DAYS_N.forEach(day=>{
      lectSlots.forEach(slot=>{
        const cell=sched[failedTask.gname][day][slot];
        if(!cell) return;
        if(cell.s===failedTask.code&&cell.t===failedTask.tid) return; // ya es de esta tarea, no tocar
        if(!((teacherBusy[failedTask.tid][day]>>(slot))&1)&&
           !violatesSharedSpace(failedTask.gname,failedTask.code,day,slot)){
          blockers.push({day,slot,cell});
        }
      });
    });
    const cambiosHechos=[]; // para poder revertir si no llegamos a completar
    for(const {day,slot,cell} of blockers){
      if(repaired>=objetivo) break;
      // RESTRICCIÓN DURA: EF/Inglés nunca 2 veces el mismo día.
      if((failedTask.code==="EF"||failedTask.code==="LEX")&&
         lectSlots.some(sl2=>sl2!==slot&&sched[failedTask.gname][day]?.[sl2]?.s===failedTask.code)) continue;
      const eTid=cell.t, eCode=cell.s;
      for(const ad of DAYS_N){
        for(const as of lectSlots){
          if(ad===day&&as===slot) continue;
          if(sched[failedTask.gname][ad][as]) continue;
          if(eTid&&((teacherBusy[eTid][ad]>>(as))&1)) continue;
          if(violatesSharedSpace(failedTask.gname,eCode,ad,as)) continue;
          sched[failedTask.gname][ad][as]=cell;
          if(eTid) teacherBusy[eTid][ad]|=(1<<(as));
          delete sched[failedTask.gname][day][slot];
          if(eTid) teacherBusy[eTid][day]&=~(1<<(slot));
          sched[failedTask.gname][day][slot]={s:failedTask.code,t:failedTask.tid};
          teacherBusy[failedTask.tid][day]|=(1<<(slot));
          cambiosHechos.push({day,slot,ad,as,cell,eTid});
          repaired++; break;
        }
        if(repaired>0) break;
      }
    }
    // Atomicidad: si no llegamos a completar TODAS las sesiones que hacían
    // falta, revertir todo lo hecho — un repair parcial que se queda a medias
    // puede dejar una sesión de más en un día (p.ej. EF/Inglés duplicado) sin
    // que el llamador se entere de que "falló", porque solo mira el conteo.
    if(repaired<objetivo&&cambiosHechos.length>0){
      for(const ch of cambiosHechos){
        delete sched[failedTask.gname][ch.day][ch.slot];
        teacherBusy[failedTask.tid][ch.day]&=~(1<<(ch.slot));
        sched[failedTask.gname][ch.ad][ch.as]=ch.cell;
        if(ch.eTid) teacherBusy[ch.eTid][ch.ad]|=(1<<(ch.as));
      }
      repaired=0;
    }
    return repaired;
  }

  // Precalcular franjas donde HAY especialistas disponibles para cada grupo
  // Esto ayuda al motor a priorizar las franjas más restrictivas
  function getGroupSpecialistPressure(gname){
    const g=groupByName.get(gname);
    if(!g) return {};
    const pressure={};
    DAYS_N.forEach(day=>{
      lectSlots.forEach(slot=>{
        const specEntries=tasks.filter(t=>t.gname===gname&&t.tid&&
          t.tid!==g.tutorId&&primGroups.find(pg=>pg.tutorId===t.tid)===undefined);
        let blocked=0;
        specEntries.forEach(task=>{
          const t=S.teachers.find(t=>t.id===task.tid);
          if(t?.unavail?.some(u=>u.d===day&&u.s===slot)) blocked++;
        });
        pressure[`${day}-${slot}`]=blocked;
      });
    });
    return pressure;
  }

  function placeTask(task){
    const groupTutorId=groupByName.get(task.gname)?.tutorId;
    const isSpecialist=task.tid&&task.tid!==groupTutorId;
    const mustFillSlots=getSpecialistSlotsForGroup(task.gname);

    // ── CASO ESPECIAL: Elba (Religión en paralelo con Proyecto Competencial) ──
    // Elba debe ir en la MISMA franja que quien ya colocó REL/PC en este grupo.
    // La celda guarda el profesor de PC en .t y Elba en .t2 (desdoble)
    if(task.tid===elbaId&&task.code==="REL"){
      const relSlot=getTutorRelSlot(task.gname);
      if(relSlot){
        const {day,slot}=relSlot;
        if(!((teacherBusy[elbaId][day]>>(slot))&1)){
          // Añadir Elba como segundo profesor (t2) en la celda existente
          const existing=sched[task.gname][day][slot];
          if(existing){ existing.t2=elbaId; existing.parallel=true; }
          else sched[task.gname][day][slot]={s:"REL",t:elbaId,parallel:true};
          teacherBusy[elbaId][day]|=(1<<(slot));
          task._placed=true; return true;
        } else {
          conflicts.push({task,remaining:1,
            reason:`Elba ocupada en la franja de REL de ${task.gname} (${['L','M','X','J','V'][day-1]} ${slot}ª)`});
          return false;
        }
      } else {
        conflicts.push({task,remaining:1,
          reason:`REL/PC de ${task.gname} aún no colocada — Elba pendiente`});
        return false;
      }
    }

    // Contar sesiones de esta tarea YA colocadas (ej. por Fase 0 libranzas)
    // — ANTES del chequeo de vía rápida, para no pedirle a minConflictsRepair
    // que repare el TOTAL de sesiones cuando ya hay alguna colocada (eso podía
    // hacerle colocar de más, o el llamador aceptar un resultado que no
    // cuadraba con lo que realmente faltaba).
    let alreadyPlaced0=0;
    DAYS_N.forEach(d=>lectSlots.forEach(s=>{
      const c=sched[task.gname][d]?.[s];
      if(c&&c.s===task.code&&c.t===task.tid) alreadyPlaced0++;
    }));
    const faltan0=task.sessions-alreadyPlaced0;

    if(task.tid&&faltan0>0){
      let totalFree=0;
      DAYS_N.forEach(d=>{ totalFree+=getFreeSlots(task.gname,task.tid,d,task.code).length; });
      if(totalFree<faltan0){
        const mc=minConflictsRepair(task,faltan0);
        if(mc>=faltan0){ task._placed=true; return true; }
        conflicts.push({task,remaining:faltan0-mc,
          reason:`${gt(task.tid)?.name} no tiene suficientes franjas (${totalFree} libres, ${faltan0} necesarias)`});
        return false;
      }
    }

    // Contar sesiones de esta tarea YA colocadas (ej. por Fase 0 libranzas)
    let alreadyPlaced=0;
    DAYS_N.forEach(d=>lectSlots.forEach(s=>{
      const c=sched[task.gname][d]?.[s];
      if(c&&c.s===task.code&&c.t===task.tid) alreadyPlaced++;
    }));
    let remaining=task.sessions-alreadyPlaced;
    if(remaining<=0){ task._placed=true; return true; }
    const placements=[];
    const dayCount={}; DAYS_N.forEach(d=>dayCount[d]=0);
    // Contar días que ya tienen sesión de esta tarea (de Fase 0)
    DAYS_N.forEach(d=>lectSlots.forEach(s=>{
      const c=sched[task.gname][d]?.[s];
      if(c&&c.s===task.code&&c.t===task.tid) dayCount[d]++;
    }));

    // COMODÍN (Ciencias, Sociales, Plástica, Música, EVCE): sin preferencia de
    // reparto 1/día — pueden agruparse el mismo día desde el inicio para cerrar
    // la rejilla al 100%. EF/Inglés NO se tocan aquí: su regla dura vive en
    // getFreeSlots y les impide repetir día pase lo que pase.
    const COMODIN_PH=new Set(["CN","CS","PLST","MUS","EVCE"]);
    const isComodinTask=COMODIN_PH.has(task.code);
    const phases=isSpecialist&&mustFillSlots.size>0
      ?[{max:5,mustOnly:true},{max:1,mustOnly:false},{max:2,mustOnly:false},{max:3,mustOnly:false},{max:5,mustOnly:false}]
      :isComodinTask
        ?[{max:2,mustOnly:false},{max:3,mustOnly:false},{max:5,mustOnly:false},{max:5,mustOnly:false,allowMustFill:true}]
        :[{max:1,mustOnly:false},{max:2,mustOnly:false},{max:3,mustOnly:false},{max:4,mustOnly:false},{max:5,mustOnly:false},{max:5,mustOnly:false,allowMustFill:true}];

    for(const phase of phases){
      if(remaining<=0) break;
      const sortedDays=[...DAYS_N].sort((a,b)=>{
        if(isSpecialist&&mustFillSlots.size>0){
          const aM=lectSlots.some(s=>mustFillSlots.has(`${a}-${s}`)&&!sched[task.gname][a][s]);
          const bM=lectSlots.some(s=>mustFillSlots.has(`${b}-${s}`)&&!sched[task.gname][b][s]);
          if(aM&&!bM) return -1; if(!aM&&bM) return 1;
        }
        // Priorizar días con franjas de alta presión donde el profesor SÍ puede ir
        // (así ocupamos esas franjas conflictivas antes de que las tome otro)
        if(isSpecialist){
          const aHP=lectSlots.filter(s=>highPressureSlots.has(`${a}-${s}`)&&
            !sched[task.gname][a][s]&&!((teacherBusy[task.tid][a]>>(s))&1)).length;
          const bHP=lectSlots.filter(s=>highPressureSlots.has(`${b}-${s}`)&&
            !sched[task.gname][b][s]&&!((teacherBusy[task.tid][b]>>(s))&1)).length;
          if(aHP!==bHP) return bHP-aHP; // más franjas de alta presión disponibles → primero
        }
        return getFreeSlots(task.gname,task.tid,b,task.code).length-
               getFreeSlots(task.gname,task.tid,a,task.code).length;
      });
      for(const day of sortedDays){
        if(remaining<=0||dayCount[day]>=phase.max) continue;
        let free=getFreeSlots(task.gname,task.tid,day,task.code,phase.allowMustFill);
        if(phase.mustOnly){
          const mf=free.filter(s=>mustFillSlots.has(`${day}-${s}`));
          if(mf.length>0) free=mf; else continue;
        }
        if(free.length===0) continue;
        const scored=free.map(slot=>({slot,score:scoreSlot(task.gname,task.tid,day,slot,task.code)}))
                        .sort((a,b)=>a.score-b.score);

        // LCV + Forward Checking: elegir slot que menos daño cause al futuro
        let chosenSlot=null;
        for(const {slot} of scored){
          // Colocar provisionalmente
          sched[task.gname][day][slot]={s:task.code,t:task.tid};
          if(task.tid) teacherBusy[task.tid][day]|=(1<<(slot));
          // Forward check: ¿quedan franjas suficientes para tareas futuras?
          if(forwardCheck(task.tid,task.gname,day,slot)){
            chosenSlot=slot; break;
          }
          // Revertir — este slot compromete el futuro
          delete sched[task.gname][day][slot];
          if(task.tid) teacherBusy[task.tid][day]&=~(1<<(slot));
        }
        // Si ninguno pasa el FC, usar el mejor igualmente (no bloquear)
        if(chosenSlot===null&&scored.length>0){
          chosenSlot=scored[0].slot;
          sched[task.gname][day][chosenSlot]={s:task.code,t:task.tid};
          if(task.tid) teacherBusy[task.tid][day]|=(1<<(chosenSlot));
        }
        if(chosenSlot===null) continue;
        placements.push({day,slot:chosenSlot}); dayCount[day]++; remaining--;
      }
    }

    // ── PASADA GARANTIZADA: si quedan sesiones y hay huecos directos, colocar sin FC ──
    if(remaining>0&&task.tid){
      const esEspecialidadUnicaPG=(task.code==="EF"||task.code==="LEX");
      for(const day of DAYS_N){
        if(remaining<=0) break;
        // RESTRICCIÓN DURA: EF/Inglés nunca 2 veces el mismo día, ni en esta
        // pasada de último recurso.
        if(esEspecialidadUnicaPG&&lectSlots.some(sl=>sched[task.gname][day]?.[sl]?.s===task.code)) continue;
        for(const slot of lectSlots){
          if(remaining<=0) break;
          if(sched[task.gname][day][slot]) continue;
          if(((teacherBusy[task.tid][day]>>(slot))&1)) continue;
          if(violatesSharedSpace(task.gname,task.code,day,slot)) continue;
          sched[task.gname][day][slot]={s:task.code,t:task.tid};
          teacherBusy[task.tid][day]|=(1<<(slot));
          placements.push({day,slot}); remaining--;
        }
      }
    }

    if(remaining>0){
      let repaired=0;
      // 1º swap simple
      for(let i=0;i<remaining;i++) if(trySwapRepair({...task,sessions:1})) repaired++;
      remaining-=repaired;
      // 2º ejection chains (A→B→C→hueco libre)
      if(remaining>0){
        let placed=0;
        for(let i=0;i<remaining;i++){
          if(ejectionChain({...task,sessions:1,_placed:false})) placed++;
        }
        remaining-=placed;
      }
      if(remaining>0){
        let reason="sin profesor asignado";
        if(task.tid){
          let free=0; DAYS_N.forEach(d=>{ free+=getFreeSlots(task.gname,task.tid,d,task.code).length; });
          const tn=gt(task.tid)?.name||task.tid;
          reason=free===0?`${tn} sin franjas libres`:`${tn}: ${free} franjas pero conflicto cruzado`;
        }
        placements.forEach(p=>{ delete sched[task.gname][p.day][p.slot]; if(task.tid) teacherBusy[task.tid][p.day]&=~(1<<(p.slot)); });
        conflicts.push({task,remaining,reason});
        return false;
      }
    }
    task._placed=true; return true;
  }

  // Diagnóstico
  const teacherLoad={};
  tasks.forEach(t=>{ if(t.tid) teacherLoad[t.tid]=(teacherLoad[t.tid]||0)+t.sessions; });
  const diagWarnings=[];
  Object.entries(teacherLoad).forEach(([tid,load])=>{
    const t=S.teachers.find(t=>t.id===tid);
    const unavail=(t?.unavail||[]).filter(u=>lectSlots.includes(u.s)).length;
    const cap=lectSlots.length*5-unavail;
    if(load>cap) diagWarnings.push(`⚠️ IMPOSIBLE: ${gt(tid)?.name} tiene ${load} ses. pero solo ${cap} franjas`);
  });

  // ── ORDENACIÓN INICIAL: MRV + PRESSURE SCORING ───────────────────
  // Ordena por prioridad dura primero, luego por presión dinámica
  // (sesiones/franjas_disponibles) — las más apretadas van primero
  function sortTasks(){
    tasks.sort((a,b)=>{
      const pa=taskPriority(a),pb=taskPriority(b);
      const blockA=Math.floor(pa),blockB=Math.floor(pb);
      if(blockA!==blockB) return blockA-blockB;
      // Dentro del mismo bloque: ordenar por presión dinámica (MRV)
      const pressA=taskPressure(a), pressB=taskPressure(b);
      if(Math.abs(pressA-pressB)>0.1) return pressB-pressA; // más presión → antes
      if(a.tid===mikelId&&b.tid===mikelId) return mikelSubPriority(a)-mikelSubPriority(b);
      if(a.tid===b.tid&&a.tid) return a.sessions-b.sessions;
      return b.sessions-a.sessions;
    });
  }
  try{ sortTasks(); }catch(e){
    const ln=document.createElement("div"); ln.style.color="#f87171";
    ln.textContent=`❌ Error en sortTasks: ${e.message}`;
    $("glog").appendChild(ln); $("glog").scrollTop=$("glog").scrollHeight;
  }

  // ── NUEVO ENFOQUE: Generar → Reparar → Reiniciar solo si necesario ──
  // En vez de 4000 reinicios completos:
  // 1. Generar horario completo
  // 2. Si hay conflictos → aplicar múltiples pasadas de swap repair
  // 3. Solo si N pasadas de repair no resuelven → reiniciar con orden diferente
  
  const MAX_ITER=2000;
  let bestSched=null,bestPlaced=0,bestSkipped=Infinity,bestConflicts=[];
  let placed=0,skipped=0,conflicts=[];
  let relHoldSlots={}; // reservas de franja de religión por grupo PC-tutor
  let iterUsed=0;
  let lastImprove=0; // iteración en la que mejoró por última vez

  async function runIterations(){
    // Yield inmediato para que el navegador pinte el log de fase 1
    await new Promise(r=>setTimeout(r,50));
    $("gst").textContent="Iniciando motor CSP...";
    $("gpb").style.width="2%";
    await new Promise(r=>setTimeout(r,0));

    try{
    for(let iter=0;iter<MAX_ITER;iter++){
      iterUsed=iter+1;
      if(iter===0){
        const ln=document.createElement("div");
        ln.style.color="#80bde2";
        ln.textContent=`🔄 Motor iniciado — ${tasks.length} tareas, ${primGroups.length} grupos`;
        $("glog").appendChild(ln); $("glog").scrollTop=$("glog").scrollHeight;
        await new Promise(r=>setTimeout(r,0));
      }
      iterUsed=iter+1;

      // Reset
      primGroups.forEach(g=>{ sched[g.name]={}; DAYS_N.forEach(d=>{ sched[g.name][d]={}; }); });
      S.teachers.forEach(t=>{
        teacherBusy[t.id]=new Int32Array(8); // bitmask: 1 entero/día, 1 bit/franja
        (t.unavail||[]).forEach(u=>{ teacherBusy[t.id][u.d]|=(1<<(u.s)); });
      });
      // Restaurar infantil en teacherBusy
      infGroups.forEach(g=>{
        DAYS_N.forEach(day=>lectSlots.forEach(slot=>{
          const cell=S.schedule[g.name]?.[day]?.[slot]||S.schedule[g.name]?.[String(day)]?.[String(slot)];
          if(cell?.t) teacherBusy[cell.t][day]|=(1<<(slot));
        }));
      });
      tasks.forEach(t=>{ t._placed=false; });
      placed=0; skipped=0; conflicts=[];

      // ── FASE ANCLAJES (0): sesiones fijadas a mano por el usuario ────────
      // S.anchors = [{groupName, sid, day, slot}]. Se colocan ANTES que nada
      // y quedan "congeladas": el resto del horario se construye alrededor.
      (S.anchors||[]).forEach(a=>{
        const g=S.groups.find(x=>x.name===a.groupName);
        if(!g||g.level==="infantil") return;
        const d=+a.day, s=+a.slot;
        if(!sched[g.name]||sched[g.name][d]?.[s]) return;
        const entry=(S.curriculum[g.id]||[]).find(e=>e.sid===a.sid);
        if(!entry) return;
        const tid=entry.tid;
        const code=S.subjects.find(ss=>ss.id===a.sid)?.code||"?";
        if((teacherBusy[tid]&&(teacherBusy[tid][d]>>(s))&1)) return;
        sched[g.name][d][s]={s:code,t:tid,_anchor:true};
        teacherBusy[tid][d]|=(1<<(s));
      });

      // ── FASE REL/PC (1): grupos donde PC NO lo da el tutor ───────
      // En 1ºA(Bea AL), 1ºB(Ana Armesto), 5ºB(Caty), 6ºA(Caty) el Proyecto
      // Competencial lo imparte un profesor que NO es el tutor. Estos son
      // los más rígidos (el profesor de PC tiene su propia carga), así que
      // se colocan PRIMERO. Elba va en paralelo (t2) en la misma franja.
      if(elbaId){
        const relNoTutor=[];
        primGroups.forEach(g=>{
          (S.curriculum[g.id]||[]).forEach(e=>{
            const code=S.subjects.find(s=>s.id===e.sid)?.code;
            if(code==="REL"&&e.tid!==elbaId&&e.sessions>0&&e.tid!==g.tutorId){
              relNoTutor.push({gname:g.name,pcTid:e.tid,gid:g.id});
            }
          });
        });
        // Colocar cada uno en una franja donde grupo+PC+Elba estén libres
        // MRV: el de menos opciones primero
        function relOpts(rt){
          const opts=[];
          DAYS_N.forEach(day=>lectSlots.forEach(slot=>{
            if(sched[rt.gname][day]?.[slot]) return;
            if(((teacherBusy[elbaId][day]>>(slot))&1)) return;
            if(rt.pcTid&&((teacherBusy[rt.pcTid][day]>>(slot))&1)) return;
            if(violatesSharedSpace(rt.gname,"REL",day,slot)) return;
            opts.push({day,slot});
          }));
          return opts;
        }
        relNoTutor.sort((a,b)=>relOpts(a).length-relOpts(b).length);
        relNoTutor.forEach(rt=>{
          const opts=relOpts(rt);
          if(opts.length===0) return;
          const {day,slot}=opts[Math.floor(Math.random()*Math.min(opts.length,3))];
          sched[rt.gname][day][slot]={s:"REL",t:rt.pcTid,t2:elbaId,parallel:true};
          teacherBusy[elbaId][day]|=(1<<(slot));
          if(rt.pcTid) teacherBusy[rt.pcTid][day]|=(1<<(slot));
          // Marcar tareas colocadas
          const pcTask=tasks.find(t=>t.gname===rt.gname&&t.code==="REL"&&t.tid===rt.pcTid);
          if(pcTask&&!pcTask._placed){ pcTask._placed=true; placed+=pcTask.sessions; }
          const elbaTask=tasks.find(t=>t.gname===rt.gname&&t.code==="REL"&&t.tid===elbaId);
          if(elbaTask&&!elbaTask._placed){ elbaTask._placed=true; placed+=elbaTask.sessions; }
        });

        // Excluir del motor las tareas REL de grupos con PC TUTOR
        // (se colocarán en la fase 2 al final, con flexibilidad).
        // Se marcan _placed para que el motor las salte, pero NO se suman
        // a 'placed' aquí — la fase 2 las coloca realmente.
        primGroups.forEach(g=>{
          (S.curriculum[g.id]||[]).forEach(e=>{
            const code=S.subjects.find(s=>s.id===e.sid)?.code;
            if(code==="REL"&&e.sessions>0&&(e.tid===g.tutorId||e.tid===elbaId)){
              const task=tasks.find(t=>t.gname===g.name&&t.code==="REL"&&t.tid===e.tid&&!t._placed);
              if(task){ task._placed=true; placed+=task.sessions; }
            }
          });
        });

        // ── RESERVA DE FRANJA DE RELIGIÓN (grupos PC-tutor) ──────────
        // PROBLEMA: el motor puede llenar las 25 franjas del grupo sin dejar
        // hueco para el desdoble REL+PC, y a veces el único hueco que queda
        // cae en la libranza del tutor (donde NO puede dar PC).
        // SOLUCIÓN: reservar de antemano UNA franja donde el tutor esté
        // presente (no libranza) y Elba libre, marcándola ocupada con un
        // placeholder "_RELHOLD". El motor no colocará nada ahí. La fase 2
        // sustituirá ese placeholder por el desdoble real REL+PC.
        relHoldSlots={}; // gname -> {day,slot}
        primGroups.forEach(g=>{
          // ¿Es grupo PC-tutor? (el PC lo da el tutor)
          let pcTid=null;
          (S.curriculum[g.id]||[]).forEach(e=>{
            const code=S.subjects.find(s=>s.id===e.sid)?.code;
            if(code==="REL"&&e.tid!==elbaId) pcTid=e.tid;
          });
          if(!pcTid||pcTid!==g.tutorId) return; // solo PC-tutor
          // Buscar franja: tutor presente (no libranza), Elba libre, grupo libre
          const tutorUnav=new Set((S.teachers.find(t=>t.id===pcTid)?.unavail||[]).map(u=>`${u.d}-${u.s}`));
          const cands=[];
          DAYS_N.forEach(day=>lectSlots.forEach(slot=>{
            if(sched[g.name][day]?.[slot]) return;
            if(tutorUnav.has(`${day}-${slot}`)) return;     // no la libranza del tutor
            if((teacherBusy[pcTid]&&(teacherBusy[pcTid][day]>>(slot))&1)) return;    // tutor libre
            if((teacherBusy[elbaId]&&(teacherBusy[elbaId][day]>>(slot))&1)) return;   // Elba libre
            // preferir franjas de BAJA presión (no quitar sitio a especialistas)
            const pres=slotPressure[`${day}-${slot}`]||0;
            cands.push({day,slot,pres});
          }));
          if(cands.length===0) return; // no se pudo reservar
          cands.sort((a,b)=>a.pres-b.pres); // menos presión primero
          const {day,slot}=cands[0];
          sched[g.name][day][slot]={s:"_RELHOLD",t:pcTid,t2:elbaId,_hold:true};
          teacherBusy[pcTid][day]|=(1<<(slot));
          teacherBusy[elbaId][day]|=(1<<(slot));
          relHoldSlots[g.name]={day,slot};
        });
      }

      // ── FASE 0: CUBRIR LIBRANZAS DE TUTORES DE PRIMARIA ──────────
      // Las libranzas de los tutores son las franjas MÁS rígidas: el tutor
      // NO puede estar, así que hay que cubrirlas obligatoriamente con otro
      // profesor que dé clase en ese grupo. Se hace ANTES del motor para que
      // no agote sus horas en otras franjas. Coloca 1 sesión por libranza,
      // eligiendo el profesor de MENOR presión (más holgado) para repartir.
      // Excluye Elba (su REL va con el PC del tutor; si el tutor libra no hay PC).
      {
        // presión de cada profesor (horas asignadas / franjas disponibles)
        const presionProf={};
        S.teachers.forEach(t=>{
          let h=0; S.groups.forEach(g=>{(S.curriculum[g.id]||[]).forEach(e=>{ if(e.tid===t.id) h+=e.sessions; });});
          const libr=(t.unavail||[]).filter(u=>lectSlots.includes(u.s)).length;
          const disp=lectSlots.length*5-libr;
          presionProf[t.id]=disp>0?h/disp:99;
        });
        primGroups.forEach(g=>{
          const tutor=S.teachers.find(t=>t.id===g.tutorId);
          if(!tutor) return;
          // Saltar grupos cuyo tutor es muy rígido (media jornada, ≥10 libranzas):
          // sus libranzas las gestiona la Fase 0.5 con backtracking, que va antes.
          const tutorLibr=(tutor.unavail||[]).filter(u=>lectSlots.includes(u.s)).length;
          if(tutorLibr>=10) return;
          const libranzas=(tutor.unavail||[]).filter(u=>lectSlots.includes(u.s));
          if(libranzas.length===0) return;
          // profesores que dan clase en este grupo (no el tutor, no Elba)
          const groupTeachers=[];
          (S.curriculum[g.id]||[]).forEach(e=>{
            if(e.sessions>0&&e.tid&&e.tid!==g.tutorId&&e.tid!==elbaId){
              const code=S.subjects.find(s=>s.id===e.sid)?.code||"???";
              groupTeachers.push({tid:e.tid,code,sessions:e.sessions});
            }
          });
          for(const u of libranzas){
            const {d:day,s:slot}=u;
            if(sched[g.name][day]?.[slot]) continue; // ya ocupado (ej. reserva religión)
            // candidatos: libres en esta franja, con sesiones pendientes, sin 2/día
            const cands=groupTeachers.filter(gt=>{
              if((teacherBusy[gt.tid]&&(teacherBusy[gt.tid][day]>>(slot))&1)) return false;
              if(violatesSharedSpace(g.name,gt.code,day,slot)) return false;
              let placedHere=0;
              DAYS_N.forEach(dd=>lectSlots.forEach(ss=>{ if(sched[g.name][dd]?.[ss]?.t===gt.tid) placedHere++; }));
              let sameDay=false;
              lectSlots.forEach(ss=>{ if(sched[g.name][day]?.[ss]?.t===gt.tid) sameDay=true; });
              return placedHere<gt.sessions && !sameDay;
            });
            if(cands.length===0) continue;
            // elegir el de MENOR presión (más holgado) → reparte carga
            cands.sort((a,b)=>(presionProf[a.tid]||0)-(presionProf[b.tid]||0));
            const ch=cands[0];
            sched[g.name][day][slot]={s:ch.code,t:ch.tid};
            teacherBusy[ch.tid][day]|=(1<<(slot));
            // marcar 1 sesión de esa tarea como colocada (para que placeTask la cuente)
            const task=tasks.find(t=>t.gname===g.name&&t.code===ch.code&&t.tid===ch.tid&&!t._placed);
            // (placeTask cuenta alreadyPlaced desde sched, no hace falta marcar _placed)
          }
        });
      }

      // ── FASE 0.5: PROFESORES MUY RÍGIDOS PRIMERO (media jornada) ──
      // Profesores con muchas libranzas (media jornada) tienen tan pocas
      // franjas que si el motor los coloca al final, ya no caben. Ej: María4º
      // da 11h y solo tiene 12 franjas (mañanas L-J). Se resuelven AQUÍ, con
      // backtracking, para garantizar que sus clases encajen antes que nada.
      {
        // Identificar profesores rígidos: ≥10 libranzas en franjas lectivas
        const rigidos=S.teachers.filter(t=>{
          const libr=(t.unavail||[]).filter(u=>lectSlots.includes(u.s)).length;
          return libr>=10; // media jornada
        });
        rigidos.forEach(spec=>{
          const specId=spec.id;
          // Sesiones pendientes de este profesor (lo no colocado aún en sched)
          const sesiones=[];
          tasks.forEach(task=>{
            if(task.tid!==specId) return;
            if(task.code==="REL") return; // la REL/PC va en desdoble con Elba (reserva + fase 2)
            let ya=0;
            DAYS_N.forEach(dd=>lectSlots.forEach(ss=>{
              const c=sched[task.gname][dd]?.[ss];
              if(c&&c.s===task.code&&c.t===specId) ya++;
            }));
            for(let i=0;i<task.sessions-ya;i++) sesiones.push({gname:task.gname,code:task.code});
          });
          if(sesiones.length===0) return;

          const usedSpec=new Set();   // "d-s" ocupadas por este profesor
          const usedGroup=new Set();  // "gname-d-s"
          const asign=[];
          function valido(gname,code,d,s){
            if((teacherBusy[specId]&&(teacherBusy[specId][d]>>(s))&1)) return false;
            if(usedSpec.has(`${d}-${s}`)) return false;
            if(sched[gname][d]?.[s]) return false;
            if(usedGroup.has(`${gname}-${d}-${s}`)) return false;
            if(violatesSharedSpace(gname,code,d,s)) return false;
            // RESTRICCIÓN DURA: EF/Inglés nunca 2 veces el mismo día (antes
            // se permitían hasta 2, dejando pasar exactamente lo prohibido).
            // El resto de materias sí pueden repetirse hasta 2 veces si hace
            // falta encajar a un profesor de media jornada.
            const mismoDia=asign.filter(a=>a.gname===gname&&a.code===code&&a.d===d).length;
            let yaEnSched=0;
            lectSlots.forEach(ss=>{ if(sched[gname][d]?.[ss]?.s===code&&sched[gname][d]?.[ss]?.t===specId) yaEnSched++; });
            const tope=(code==="EF"||code==="LEX")?1:2;
            if(mismoDia+yaEnSched>=tope) return false;
            return true;
          }
          function opciones(gname,code){
            let n=0; DAYS_N.forEach(d=>lectSlots.forEach(s=>{ if(valido(gname,code,d,s)) n++; })); return n;
          }
          let pasos=0, ok=false;
          function bt(idx){
            if(++pasos>20000) return false;
            if(idx>=sesiones.length){ ok=true; return true; }
            // MRV: ordenar restantes por menos opciones
            const rest=sesiones.slice(idx);
            rest.sort((a,b)=>opciones(a.gname,a.code)-opciones(b.gname,b.code));
            sesiones.splice(idx,rest.length,...rest);
            const {gname,code}=sesiones[idx];
            const opts=[];
            DAYS_N.forEach(d=>lectSlots.forEach(s=>{ if(valido(gname,code,d,s)) opts.push({d,s}); }));
            opts.sort(()=>Math.random()-0.5);
            for(const {d,s} of opts){
              asign.push({gname,code,d,s});
              usedSpec.add(`${d}-${s}`); usedGroup.add(`${gname}-${d}-${s}`);
              if(bt(idx+1)) return true;
              asign.pop(); usedSpec.delete(`${d}-${s}`); usedGroup.delete(`${gname}-${d}-${s}`);
            }
            return false;
          }
          bt(0);
          if(ok){
            asign.forEach(a=>{
              sched[a.gname][a.d][a.s]={s:a.code,t:specId};
              teacherBusy[specId][a.d]|=(1<<(a.s));
            });
          }
        });
      }

      // ── OPCIÓN C: COLOCACIÓN GLOBAL DE ESPECIALISTAS CRÍTICOS ──────
      // Oscar, Richi, Diego, Arancha tienen muchos grupos y pocas franjas.
      // Resolver su asignación completa mediante backtracking ANTES del
      // motor general garantiza que si existe solución, la encuentra.
      // Para Arancha solo las sesiones CROSS-GROUP (LEX fuera de 1ºB),
      // sus sesiones en su propio grupo 1ºB son más flexibles.
      //
      // OPCIÓN 1 (reintento): como cada especialista se resuelve en
      // secuencia, el orden puede causar que el último no encaje. Si algún
      // especialista falla, se reintenta con distintos órdenes hasta que
      // los 4 encajen (o se agoten los órdenes).
      const baseSpecialists=["Oscar","Richi","Diego","Arancha Inglés"];
      const placedGlobal=new Set();

      // Generar varios órdenes a probar: original + permutaciones aleatorias
      function shuffleArr(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}
      const ordersToTry=[baseSpecialists];
      // Menos permutaciones para no ralentizar (el primer orden suele bastar)
      const numPerms=4;
      for(let k=0;k<numPerms;k++) ordersToTry.push(shuffleArr(baseSpecialists));

      // Snapshot del estado para poder revertir entre intentos de orden
      function snapshotSched(){
        const snap={};
        primGroups.forEach(g=>{ snap[g.name]={}; DAYS_N.forEach(d=>{ snap[g.name][d]={...(sched[g.name][d]||{})}; }); });
        return snap;
      }
      function restoreSched(snap){
        primGroups.forEach(g=>{ DAYS_N.forEach(d=>{ sched[g.name][d]={...(snap[g.name][d]||{})}; }); });
      }
      function snapshotBusy(){
        const snap={};
        baseSpecialists.forEach(name=>{
          const sp=S.teachers.find(t=>t.name===name); if(!sp) return;
          snap[sp.id]={}; DAYS_N.forEach(d=>{ snap[sp.id][d]=teacherBusy[sp.id][d]|0; });
        });
        return snap;
      }
      function restoreBusy(snap){
        Object.keys(snap).forEach(tid=>{ DAYS_N.forEach(d=>{ teacherBusy[tid][d]=snap[tid][d]|0; }); });
      }

      const schedSnap0=snapshotSched();
      const busySnap0=snapshotBusy();

      let bestOrderResult=null; // {placedGlobal, schedSnap, busySnap, failCount}

      for(const order of ordersToTry){
        // Restaurar estado inicial antes de cada intento de orden
        restoreSched(schedSnap0);
        restoreBusy(busySnap0);
        const orderPlaced=new Set();
        let failCount=0;

        for(const specName of order){
          const spec=S.teachers.find(t=>t.name===specName);
          if(!spec) continue;
          const specId=spec.id;
          const ownGroup=primGroups.find(g=>g.tutorId===specId);

          const specSessions=[];
          const includedTasks=new Set();
          tasks.forEach(task=>{
            if(task.tid!==specId) return;
            if(specName==="Arancha Inglés"&&ownGroup&&task.gname===ownGroup.name) return;
            // Descontar sesiones que la Fase 0 ya colocó de esta tarea
            let yaColoc=0;
            DAYS_N.forEach(dd=>lectSlots.forEach(ss=>{
              const c=sched[task.gname][dd]?.[ss];
              if(c&&c.s===task.code&&c.t===specId) yaColoc++;
            }));
            const pend=task.sessions-yaColoc;
            for(let i=0;i<pend;i++){
              specSessions.push({gname:task.gname,code:task.code,task});
            }
            includedTasks.add(task);
          });
          if(specSessions.length===0) continue;

          const assignment=[];
          const usedSpecSlots=new Set();
          const usedGroupSlots=new Set();

          function slotValid(gname,code,day,slot){
            if(((teacherBusy[specId][day]>>(slot))&1)) return false;
            if(usedSpecSlots.has(`${day}-${slot}`)) return false;
            if(usedGroupSlots.has(`${gname}-${day}-${slot}`)) return false;
            if(sched[gname][day]?.[slot]) return false;
            if(violatesSharedSpace(gname,code,day,slot)) return false;
            // RESTRICCIÓN DURA: EF/Inglés nunca 2 veces el mismo día. Cuenta
            // tanto lo que este backtrack va colocando (assignment) como lo
            // que YA estuviera en sched de una fase anterior (p.ej. Fase 0.5
            // profesores rígidos, o Fase 1 especialistas infantil) — antes
            // solo miraba assignment, dejando colar un choque con lo previo.
            const esEspecialidadUnicaCheck=(code==="EF"||code==="LEX");
            if(esEspecialidadUnicaCheck){
              const sameDayCount=assignment.filter(a=>a.gname===gname&&a.code===code&&a.day===day).length;
              let sameDayEnSched=0;
              lectSlots.forEach(sl2=>{ if(sched[gname][day]?.[sl2]?.s===code) sameDayEnSched++; });
              if(sameDayCount+sameDayEnSched>=1) return false;
            }
            return true;
          }
          function countOptions(gname,code){
            let n=0;
            DAYS_N.forEach(day=>lectSlots.forEach(slot=>{ if(slotValid(gname,code,day,slot)) n++; }));
            return n;
          }

          let solved=false;
          let btSteps=0;
          const BT_MAX=50000;
          function backtrack(idx){
            if(++btSteps>BT_MAX) return false;
            if(idx>=specSessions.length){ solved=true; return true; }
            const remaining=specSessions.slice(idx);
            remaining.sort((a,b)=>countOptions(a.gname,a.code)-countOptions(b.gname,b.code));
            specSessions.splice(idx,remaining.length,...remaining);
            const {gname,code}=specSessions[idx];
            const opts=[];
            DAYS_N.forEach(day=>lectSlots.forEach(slot=>{ if(slotValid(gname,code,day,slot)) opts.push({day,slot}); }));
            opts.sort(()=>Math.random()-0.5);
            for(const {day,slot} of opts){
              assignment.push({gname,code,day,slot});
              usedSpecSlots.add(`${day}-${slot}`);
              usedGroupSlots.add(`${gname}-${day}-${slot}`);
              if(backtrack(idx+1)) return true;
              assignment.pop();
              usedSpecSlots.delete(`${day}-${slot}`);
              usedGroupSlots.delete(`${gname}-${day}-${slot}`);
            }
            return false;
          }

          backtrack(0);

          if(solved){
            assignment.forEach(a=>{
              sched[a.gname][a.day][a.slot]={s:a.code,t:specId};
              teacherBusy[specId][a.day]|=(1<<(a.slot));
            });
            includedTasks.forEach(task=>orderPlaced.add(task));
          } else {
            failCount++;
          }
        }

        // Si este orden colocó los 4 sin fallos, lo usamos directamente
        if(failCount===0){
          bestOrderResult={placedGlobal:orderPlaced,schedSnap:snapshotSched(),busySnap:snapshotBusy(),failCount:0};
          break;
        }
        // Si no, guardar el mejor hasta ahora (menos fallos)
        if(!bestOrderResult||failCount<bestOrderResult.failCount){
          bestOrderResult={placedGlobal:orderPlaced,schedSnap:snapshotSched(),busySnap:snapshotBusy(),failCount};
        }
      }

      // Aplicar el mejor resultado encontrado
      if(bestOrderResult){
        restoreSched(bestOrderResult.schedSnap);
        restoreBusy(bestOrderResult.busySnap);
        bestOrderResult.placedGlobal.forEach(t=>placedGlobal.add(t));
      }

      // Marcar como colocadas las tareas resueltas globalmente
      placedGlobal.forEach(task=>{ task._placed=true; placed+=task.sessions; });

      // Ordenar tareas con MRV + aleatoriedad creciente
      tasks.sort((a,b)=>{
        const pa=taskPriority(a),pb=taskPriority(b);
        const blockA=Math.floor(pa),blockB=Math.floor(pb);
        if(blockA!==blockB) return blockA-blockB;
        const noise=Math.min(1.5,iter*0.005);
        const pressA=taskPressure(a),pressB=taskPressure(b);
        return (pressB-pressA)+(Math.random()-0.5)*noise;
      });

      for(const task of tasks){
        if(task._placed) continue; // ya colocada globalmente
        if(placeTask(task)) placed+=task.sessions;
        else {
          // Contar solo las sesiones REALMENTE sin colocar (descontar las que
          // ya estén en sched por Fase 0/0.5 u otras fases previas)
          let yaEnSched=0;
          DAYS_N.forEach(d=>lectSlots.forEach(s=>{
            const c=sched[task.gname][d]?.[s];
            if(c&&c.s===task.code&&c.t===task.tid) yaEnSched++;
          }));
          placed+=yaEnSched;
          skipped+=Math.max(0,task.sessions-yaEnSched);
        }
      }

      if(skipped<bestSkipped){
        bestSkipped=skipped; bestPlaced=placed; bestConflicts=[...conflicts];
        lastImprove=iter;
        bestSched={};
        primGroups.forEach(g=>{
          bestSched[g.name]={};
          DAYS_N.forEach(d=>{ bestSched[g.name][d]={...(sched[g.name][d]||{})}; });
        });
      }
      if(skipped===0) break;
      // FAIL-FAST: si el motor lleva muchas iteraciones sin mejorar, este
      // intento está condenado — mejor abortar y reintentar con otra semilla
      // (auto-repetir). Más intentos/minuto = más probabilidad de completar.
      // Umbrales escalonados: cuanto mejor va, antes cortamos (el swap-repair
      // final suele rematar 1-2 piezas; esperar 400+ iters no aporta).
      const stag=iter-lastImprove;
      if(bestSkipped<=2 && stag>=250) break;
      if(bestSkipped<=4 && stag>=400) break;
      if(bestSkipped<=6 && stag>=550) break;
      // NUEVO: si bestSkipped es alto (probable límite estructural), no
      // esperar a las 700 — rendirse mucho antes evita quemar tiempo.
      if(bestSkipped>6 && stag>=150) break;
      if(stag>=700) break; // estancamiento global: ni los intentos malos agotan las 2000


      if(iter%10===9||iter<3){
        $("gst").textContent=`${iterUsed} intentos · mejor: ${bestSkipped} sin colocar`;
        $("gpb").style.width=Math.round(iterUsed/MAX_ITER*100)+"%";
        await new Promise(r=>setTimeout(r,0));
      }
    }

    // (El SWAP-REPAIR se ha movido DENTRO de finalizarGen, DESPUÉS de
    //  completar infantil, para que pueda ver la ocupación de infantil y
    //  no romperla. Aquí solo volcamos el mejor resultado de primaria.)
    primGroups.forEach(g=>{ if(bestSched) sched[g.name]=bestSched[g.name]; });
    placed=bestPlaced; skipped=bestSkipped; conflicts=bestConflicts;
    finalizarGen();
    }catch(err){
      const errLn=document.createElement("div");
      errLn.style.color="#f87171";
      errLn.textContent=`❌ Error en motor: ${err.message} — ${err.stack?.split('\n')[0]}`;
      $("glog").appendChild(errLn); $("glog").scrollTop=$("glog").scrollHeight;
      $("gst").textContent="Error — ver log";
      const btn=$("gbtn"); if(btn){btn.disabled=false;btn.textContent="⚡ Reintentar";}
    }
  }

  function finalizarGen(){
    const hardViolations=[];
    DAYS_N.forEach(day=>{ lectSlots.forEach(slot=>{
      const byT={};
      primGroups.forEach(g=>{
        const cell=sched[g.name][day]?.[slot];
        if(cell?.t){
          if(byT[cell.t]) hardViolations.push(`⬛ ${gt(cell.t)?.name} en ${g.name} Y ${byT[cell.t]}`);
          else byT[cell.t]=g.name;
        }
      });
    }); });

    // Guardar primaria
    primGroups.forEach(g=>{ S.schedule[g.name]=sched[g.name]; });

    // ── FASE 3+4: Completar infantil ─────────────────────────────
    if(infGroups.length>0){
      // Añadir log visible
      const infStart=document.createElement("div");
      infStart.style.color="#80bde2";
      infStart.textContent=`🧒 Completando infantil (${infGroups.length} grupos)...`;
      $("glog").appendChild(infStart); $("glog").scrollTop=$("glog").scrollHeight;

      // Reconstruir teacherBusy con primaria + infantil fase 1
      S.teachers.forEach(t=>{
        teacherBusy[t.id]=new Int32Array(8); // bitmask: 1 entero/día, 1 bit/franja
        (t.unavail||[]).forEach(u=>{ teacherBusy[t.id][u.d]|=(1<<(u.s)); });
      });
      [...primGroups,...infGroups].forEach(g=>{
        DAYS_N.forEach(day=>lectSlots.forEach(slot=>{
          const cell=S.schedule[g.name]?.[day]?.[slot]||S.schedule[g.name]?.[String(day)]?.[String(slot)];
          if(cell?.t) teacherBusy[cell.t][day]|=(1<<(slot));
        }));
      });

      // Restaurar sched de infantil desde S.schedule (fase 1)
      infGroups.forEach(g=>{
        sched[g.name]={};
        DAYS_N.forEach(d=>{
          sched[g.name][d]={};
          lectSlots.forEach(slot=>{
            const cell=S.schedule[g.name]?.[d]?.[slot]||S.schedule[g.name]?.[String(d)]?.[String(slot)];
            if(cell) sched[g.name][d][slot]=cell;
          });
        });
      });

      // Fase 3: especialistas restantes
      infGroups.forEach(g=>{
        (S.curriculum[g.id]||[]).forEach(e=>{
          if(!e.sessions||e.tid===g.tutorId) return;
          const code=S.subjects.find(s=>s.id===e.sid)?.code||"???";
          let placed2=0;
          DAYS_N.forEach(d=>lectSlots.forEach(sl=>{ if(sched[g.name][d]?.[sl]?.t===e.tid) placed2++; }));
          let remaining=e.sessions-placed2;
          if(remaining<=0) return;
          const dc={}; DAYS_N.forEach(d=>{
            let n=0; lectSlots.forEach(sl=>{ if(sched[g.name][d]?.[sl]?.s===code) n++; });
            dc[d]=n;
          });
          const esEspecialidadUnica=(code==="EF"||code==="LEX");
          for(let mp=1;mp<=5&&remaining>0;mp++){
            for(const day of [...DAYS_N].sort(()=>Math.random()-0.5)){
              // RESTRICCIÓN DURA: EF/Inglés nunca 2 veces el mismo día, ni
              // siquiera cuando mp sube para intentar colocar lo que falte.
              const tope=esEspecialidadUnica?1:mp;
              if(remaining<=0||dc[day]>=tope) continue;
              const free=lectSlots.filter(sl=>!sched[g.name][day]?.[sl]&&(!e.tid||!(teacherBusy[e.tid]&&(teacherBusy[e.tid][day]>>(sl))&1)));
              if(!free.length) continue;
              const slot=free[Math.floor(Math.random()*free.length)];
              sched[g.name][day][slot]={s:code,t:e.tid};
              if(e.tid) teacherBusy[e.tid][day]|=(1<<(slot));
              dc[day]++; remaining--;
            }
          }
          // PASADA GARANTIZADA: si aún quedan, colocar en cualquier hueco
          // donde el especialista esté libre, sin límite por día — salvo
          // para EF/Inglés, que NUNCA deben repetirse el mismo día, ni
          // siquiera en esta pasada de último recurso.
          if(remaining>0){
            for(const day of DAYS_N){
              if(remaining<=0) break;
              if(esEspecialidadUnica&&lectSlots.some(sl=>sched[g.name][day]?.[sl]?.s===code)) continue;
              for(const slot of lectSlots){
                if(remaining<=0) break;
                if(sched[g.name][day]?.[slot]) continue;
                if(e.tid&&(teacherBusy[e.tid]&&(teacherBusy[e.tid][day]>>(slot))&1)) continue;
                sched[g.name][day][slot]={s:code,t:e.tid};
                if(e.tid) teacherBusy[e.tid][day]|=(1<<(slot));
                remaining--;
              }
            }
          }
        });
      });
      // Fase 4: materias de la tutora en infantil. La tutora puede dar varias
      // materias (GLOB×20 + MUS×1, etc.). Colocamos primero las materias
      // NO-globalizadas (música, etc.) según sus sesiones, y rellenamos el
      // resto de huecos con GLOB. (No depende de teacherBusy.)
      let globFilled=0;
      try{
      infGroups.forEach(g=>{
        const tutor=S.teachers.find(t=>t.id===g.tutorId);
        const libranza=new Set((tutor?.unavail||[]).map(u=>`${u.d}-${u.s}`));
        if(!sched[g.name]) sched[g.name]={};
        DAYS_N.forEach(day=>{ if(!sched[g.name][day]) sched[g.name][day]={}; });
        // entradas del currículum que da la tutora
        const tutEntries=(S.curriculum[g.id]||[]).filter(e=>e.tid===g.tutorId);
        // código GLOB (el de relleno) y las demás materias de la tutora
        const globEntry=tutEntries.find(e=>(S.subjects.find(s=>s.id===e.sid)?.code)==="GLOB");
        const globCode=globEntry?"GLOB":(tutEntries[0]?(S.subjects.find(s=>s.id===tutEntries[0].sid)?.code||"GLOB"):"GLOB");
        const otras=tutEntries.filter(e=>e!==globEntry);
        // 1) Colocar las materias NO-GLOB de la tutora (música, etc.)
        otras.forEach(e=>{
          const code=S.subjects.find(s=>s.id===e.sid)?.code||"?";
          let restantes=e.sessions;
          DAYS_N.forEach(day=>lectSlots.forEach(slot=>{
            if(restantes<=0) return;
            if(sched[g.name][day][slot]) return;
            if(libranza.has(`${day}-${slot}`)) return;
            sched[g.name][day][slot]={s:code,t:g.tutorId};
            if(g.tutorId&&teacherBusy[g.tutorId]) teacherBusy[g.tutorId][day]|=(1<<(slot));
            restantes--; globFilled++;
          }));
        });
        // 2) Rellenar el resto de huecos con GLOB
        DAYS_N.forEach(day=>{
          lectSlots.forEach(slot=>{
            if(sched[g.name][day][slot]) return;             // ya ocupado
            if(libranza.has(`${day}-${slot}`)) return;        // libranza real
            sched[g.name][day][slot]={s:globCode,t:g.tutorId};
            if(g.tutorId&&teacherBusy[g.tutorId]) teacherBusy[g.tutorId][day]|=(1<<(slot));
            globFilled++;
          });
        });
      });
      infGroups.forEach(g=>{ S.schedule[g.name]=sched[g.name]; });
      }catch(err){
        const ge=document.createElement("div");
        ge.style.cssText="font-size:11px;color:#f87171;font-weight:700";
        ge.textContent=`❌ Error en Fase 4 GLOB: ${err.message}`;
        $("glog").appendChild(ge);
      }
      const gf=document.createElement("div");
      gf.style.cssText="font-size:10px;color:#a3e635";
      gf.textContent=`🧒 Infantil GLOB tutoras: ${globFilled} sesiones colocadas`;
      $("glog").appendChild(gf); $("glog").scrollTop=$("glog").scrollHeight;

      // ── RESOLVER CONFLICTOS DUROS infantil↔primaria ──────────────
      let conflictsFixed=0;
      DAYS_N.forEach(day=>lectSlots.forEach(slot=>{
        const byT={};
        [...primGroups,...infGroups].forEach(g=>{
          const cell=S.schedule[g.name]?.[day]?.[slot];
          if(cell?.t){
            if(!byT[cell.t]) byT[cell.t]=[];
            byT[cell.t].push(g);
          }
        });
        Object.entries(byT).forEach(([tid,gs])=>{
          if(gs.length<2) return;
          const infG=gs.find(g=>g.level==="infantil");
          const primG=gs.find(g=>g.level==="primaria");
          if(!infG||!primG) return;
          const cell=S.schedule[infG.name][day][slot];
          let moved=false;
          for(const ad of DAYS_N){
            if(moved) break;
            for(const as of lectSlots){
              if(ad===day&&as===slot) continue;
              if(S.schedule[infG.name][ad]?.[as]) continue;
              let busy=false;
              [...primGroups,...infGroups].forEach(g=>{
                if(S.schedule[g.name]?.[ad]?.[as]?.t===tid) busy=true;
              });
              if(busy) continue;
              if((S.teachers.find(t=>t.id===tid)?.unavail||[]).some(u=>u.d===ad&&u.s===as)) continue;
              S.schedule[infG.name][ad][as]=cell;
              delete S.schedule[infG.name][day][slot];
              conflictsFixed++; moved=true;
            }
          }
          if(!moved){
            delete S.schedule[infG.name][day][slot];
            conflictsFixed++;
          }
        });
      }));
      if(conflictsFixed>0){
        const cf=document.createElement("div");
        cf.style.color="#fbbf24";
        cf.textContent=`🔧 ${conflictsFixed} conflictos infantil↔primaria resueltos`;
        $("glog").appendChild(cf); $("glog").scrollTop=$("glog").scrollHeight;
      }

      let it=0,ip=0;
      infGroups.forEach(g=>{
        (S.curriculum[g.id]||[]).forEach(e=>{ it+=e.sessions; });
        DAYS_N.forEach(d=>lectSlots.forEach(sl=>{ if(sched[g.name][d]?.[sl]) ip++; }));
      });
      const il=document.createElement("div");
      il.style.color=ip>=it?"#4ade80":"#fbbf24";
      il.textContent=ip>=it?`✅ Infantil completo — ${ip} ses.`:`⚠ Infantil: ${ip}/${it}`;
      $("glog").appendChild(il); $("glog").scrollTop=$("glog").scrollHeight;
    }

    // ── SWAP-REPAIR FINAL (ahora DESPUÉS de infantil) ────────────────
    // Infantil ya está colocado en S.schedule, así que el swap-repair puede
    // leer dónde están Mikel y los demás especialistas en infantil y NO
    // pisarlos. Trabaja sobre primaria (bestSched) pero respeta infantil.
    if(skipped>0 && skipped<10 && bestSched){
      const r=attemptSwapRepair(bestSched,bestConflicts);
      if(r.placed>bestPlaced || r.skipped<skipped){
        // aplicar resultado a primaria
        primGroups.forEach(g=>{ sched[g.name]=r.sched[g.name]; S.schedule[g.name]=r.sched[g.name]; });
        skipped=r.skipped; placed=r.placed; conflicts=r.conflicts; bestSched=r.sched;
        const sl=document.createElement("div");
        sl.style.color="#4ade80"; sl.style.fontSize="10px";
        sl.textContent=`🔧 swap-repair: ${skipped} sin colocar`;
        $("glog").appendChild(sl); $("glog").scrollTop=$("glog").scrollHeight;
      }
    }

    // ── FASE REL/PC (2): grupos donde PC lo da el TUTOR ──────────
    // En el resto de grupos, el Proyecto Competencial lo imparte el tutor,
    // que está casi siempre en su aula. Por eso se colocan AL FINAL, con
    // toda la flexibilidad: Elba va en cualquier franja libre del grupo
    // donde Elba esté libre, y el tutor da PC en esa misma franja.
    if(elbaId){
      let elbaPlaced=0, elbaFailed=[];

      // ── PASO 0: convertir reservas _RELHOLD en el desdoble real ──
      // El motor respetó estas franjas reservadas. Ahora las convertimos
      // en el desdoble REL+PC definitivo.
      primGroups.forEach(g=>{
        DAYS_N.forEach(day=>lectSlots.forEach(slot=>{
          const cell=S.schedule[g.name]?.[day]?.[slot];
          if(cell&&cell._hold&&cell.s==="_RELHOLD"){
            S.schedule[g.name][day][slot]={s:"REL",t:cell.t,t2:cell.t2||elbaId,parallel:true};
            elbaPlaced++;
          }
        }));
      });

      // Ocupación actual de Elba (primaria fase 1 + infantil)
      const elbaBusy={}; DAYS_N.forEach(d=>{ elbaBusy[d]={}; });
      (S.teachers.find(t=>t.id===elbaId)?.unavail||[]).forEach(u=>{ if(elbaBusy[u.d]) elbaBusy[u.d][u.s]=true; });
      [...primGroups,...infGroups].forEach(g=>{
        DAYS_N.forEach(day=>lectSlots.forEach(slot=>{
          const cell=S.schedule[g.name]?.[day]?.[slot]||S.schedule[g.name]?.[String(day)]?.[String(slot)];
          if(cell&&(cell.t===elbaId||cell.t2===elbaId)) elbaBusy[day][slot]=true;
        }));
      });

      primGroups.forEach(g=>{
        // ¿Ya tiene REL este grupo? (colocado en fase 1) → saltar
        let hasRel=false;
        DAYS_N.forEach(day=>lectSlots.forEach(slot=>{
          const c=S.schedule[g.name]?.[day]?.[slot];
          if(c?.s==="REL") hasRel=true;
        }));
        if(hasRel) return;

        // PC lo da el tutor en este grupo
        const tutorId=g.tutorId;
        // Buscar franja libre en el grupo donde Elba y el tutor estén libres
        const opts=[];
        DAYS_N.forEach(day=>lectSlots.forEach(slot=>{
          if(S.schedule[g.name]?.[day]?.[slot]) return; // grupo ocupado
          if(elbaBusy[day]?.[slot]) return; // Elba ocupada
          // tutor: ¿está en su aula o libre? Comprobar que no esté en otro grupo
          let tutorBusy=false;
          [...primGroups,...infGroups].forEach(g2=>{
            const c=S.schedule[g2.name]?.[day]?.[slot];
            if(c&&(c.t===tutorId||c.t2===tutorId)) tutorBusy=true;
          });
          if(tutorBusy) return;
          if((S.teachers.find(t=>t.id===tutorId)?.unavail||[]).some(u=>u.d===day&&u.s===slot)) return;
          if(violatesSharedSpace(g.name,"REL",day,slot)) return;
          opts.push({day,slot});
        }));
        if(opts.length>0){
          const {day,slot}=opts[Math.floor(Math.random()*opts.length)];
          if(!S.schedule[g.name][day]) S.schedule[g.name][day]={};
          S.schedule[g.name][day][slot]={s:"REL",t:tutorId,t2:elbaId,parallel:true};
          elbaBusy[day][slot]=true;
          elbaPlaced++;
        } else {
          elbaFailed.push(g.name);
        }
      });

      const el=document.createElement("div");
      el.style.color=elbaFailed.length===0?"#4ade80":"#fbbf24";
      el.textContent=`⛪ Elba REL/PC (tutor): ${elbaPlaced} grupos`+(elbaFailed.length?` — sin colocar: ${elbaFailed.join(", ")}`:"");
      $("glog").appendChild(el); $("glog").scrollTop=$("glog").scrollHeight;
    }

    const elapsed=Date.now()-t0;

    // ── CORRECCIÓN DE DUPLICADOS ─────────────────────────────────────
    // Si un grupo tiene una materia colocada MÁS veces de las que pide el
    // currículum, y otra materia falta, reconvertimos las celdas sobrantes en
    // la materia que falta. Arregla casos donde el motor duplica una materia
    // (p.ej. 2 músicas de Mikel) y omite otra (p.ej. CN del tutor).
    // Primero intentamos emparejar con el MISMO profesor (siempre válido);
    // luego entre profesores DISTINTOS, comprobando que el profesor entrante
    // esté libre en esa franja (no esté dando clase en otro grupo a esa hora).
    {
      // mapa de ocupación global de profesores: ocup[tid] = Set("d-s")
      // Incluye PRIMARIA e INFANTIL — un profesor con docencia en ambos
      // niveles (p.ej. inglés de infantil + tutoría de primaria) debe
      // contar como ocupado en las dos, o esta función podía asignarle
      // una materia de primaria en una franja donde ya está en infantil.
      const ocup={};
      primGroups.forEach(g=>DAYS_N.forEach(d=>lectSlots.forEach(s=>{
        const c=S.schedule[g.name]?.[d]?.[s];
        if(c){ if(c.t){(ocup[c.t]=ocup[c.t]||new Set()).add(`${d}-${s}`);} if(c.t2){(ocup[c.t2]=ocup[c.t2]||new Set()).add(`${d}-${s}`);} }
      })));
      infGroups.forEach(g=>DAYS_N.forEach(d=>lectSlots.forEach(s=>{
        const c=S.schedule[g.name]?.[d]?.[s]||S.schedule[g.name]?.[String(d)]?.[String(s)];
        if(c){ if(c.t){(ocup[c.t]=ocup[c.t]||new Set()).add(`${d}-${s}`);} if(c.t2){(ocup[c.t2]=ocup[c.t2]||new Set()).add(`${d}-${s}`);} }
      })));
      // libranzas
      const libraEn=(tid,d,s)=>(S.teachers.find(t=>t.id===tid)?.unavail||[]).some(u=>u.d===d&&u.s===s);

      primGroups.forEach(g=>{
        const cuenta={}, celdasDe={};
        DAYS_N.forEach(d=>lectSlots.forEach(s=>{
          const c=S.schedule[g.name]?.[d]?.[s];
          if(c&&!c._hold&&!c._anchor&&c.t){
            const k=`${c.s}|${c.t}`;
            cuenta[k]=(cuenta[k]||0)+1;
            (celdasDe[k]=celdasDe[k]||[]).push({d,s});
          }
        }));
        const pide={};
        (S.curriculum[g.id]||[]).forEach(e=>{
          const code=S.subjects.find(s=>s.id===e.sid)?.code||"???";
          pide[`${code}|${e.tid}`]=e.sessions;
        });
        const faltan=[], sobran=[];
        Object.keys(pide).forEach(k=>{ const got=cuenta[k]||0; if(got<pide[k]) faltan.push({k,n:pide[k]-got}); });
        Object.keys(cuenta).forEach(k=>{ const want=pide[k]||0; if(cuenta[k]>want) sobran.push({k,n:cuenta[k]-want}); });

        // función para emparejar; mismoProf=true exige mismo profesor
        const emparejar=(mismoProf)=>{
          faltan.forEach(f=>{
            if(f.n<=0) return;
            const [fcode,ftid]=f.k.split("|");
            sobran.forEach(so=>{
              if(f.n<=0||so.n<=0) return;
              const [scode,stid]=so.k.split("|");
              if(mismoProf && stid!==ftid) return;
              if(!mismoProf && stid===ftid) return;
              const celdas=celdasDe[so.k]||[];
              for(let i=celdas.length-1;i>=0 && f.n>0 && so.n>0;i--){
                const {d,s}=celdas[i];
                const c=S.schedule[g.name]?.[d]?.[s];
                if(!c||c._hold||c._anchor||c.t2) continue;
                if(violatesSharedSpace(g.name,fcode,d,s)) continue;
                // RESTRICCIÓN DURA: EF/Inglés nunca 2 veces el mismo día —
                // no convertir un sobrante en EF/LEX si ese día YA tiene esa
                // materia colocada en otra franja del mismo grupo.
                if((fcode==="EF"||fcode==="LEX")&&
                   lectSlots.some(sl2=>sl2!==s&&(S.schedule[g.name]?.[d]?.[sl2]?.s===fcode))) continue;
                // si cambia de profesor, el entrante debe estar LIBRE en (d,s)
                if(!mismoProf){
