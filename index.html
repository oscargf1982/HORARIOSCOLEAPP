                  if(libraEn(ftid,d,s)) continue;
                  if(ocup[ftid]&&ocup[ftid].has(`${d}-${s}`)) continue;
                }
                // liberar ocupación del profesor saliente, ocupar el entrante
                if(ocup[stid]) ocup[stid].delete(`${d}-${s}`);
                (ocup[ftid]=ocup[ftid]||new Set()).add(`${d}-${s}`);
                S.schedule[g.name][d][s]={s:fcode,t:ftid};
                celdas.splice(i,1);
                f.n--; so.n--;
              }
            });
          });
        };
        emparejar(true);   // 1º mismo profesor (Mikel PLST↔MUS): siempre seguro
        emparejar(false);  // 2º distinto profesor: convierte el duplicado sobrante
                           // en la materia que falta SOLO si su profesor está
                           // libre en esa franja (verificado en 'emparejar').
                           // Dirección garantizada: sobrante→faltante, nunca al revés.

        // 3ª pasada (REUBICACIÓN): si aún falta una materia del tutor 'ftid' y
        // sobra una clase de otro profesor 'stid' (p.ej. 2ª música de Mikel),
        // pero el tutor está OCUPADO en las franjas del duplicado, intentamos
        // MOVER la clase duplicada a otra franja donde su profesor (stid) esté
        // libre, liberando una franja donde el tutor SÍ pueda dar su materia.
        faltan.forEach(f=>{
          if(f.n<=0) return;
          const [fcode,ftid]=f.k.split("|");
          sobran.forEach(so=>{
            if(f.n<=0||so.n<=0) return;
            const [scode,stid]=so.k.split("|");
            if(stid===ftid) return;
            const celdas=celdasDe[so.k]||[];
            for(let i=celdas.length-1;i>=0 && f.n>0 && so.n>0;i--){
              const {d,s}=celdas[i];
              const c=S.schedule[g.name]?.[d]?.[s];
              if(!c||c._hold||c._anchor||c.t2) continue;
              // el tutor entrante debe poder dar su materia en (d,s):
              // libre de ocupación y sin libranza, y sin romper espacio compartido
              if(libraEn(ftid,d,s)) continue;
              if(ocup[ftid]&&ocup[ftid].has(`${d}-${s}`)) continue;
              if(violatesSharedSpace(g.name,fcode,d,s)) continue;
              // RESTRICCIÓN DURA: EF/Inglés nunca 2 veces el mismo día.
              if((fcode==="EF"||fcode==="LEX")&&
                 lectSlots.some(sl2=>sl2!==s&&(S.schedule[g.name]?.[d]?.[sl2]?.s===fcode))) continue;
              // buscar nueva franja (nd,ns) para reubicar la clase sobrante (stid):
              // hueco en el grupo, stid libre y sin libranza, sin conflicto de espacio
              let movido=false;
              for(const nd of DAYS_N){
                if(movido) break;
                for(const ns of lectSlots){
                  if(nd===d&&ns===s) continue;
                  if(S.schedule[g.name]?.[nd]?.[ns]) continue;            // hueco en grupo
                  if(libraEn(stid,nd,ns)) continue;
                  if(ocup[stid]&&ocup[stid].has(`${nd}-${ns}`)) continue; // stid libre
                  if((scode==="EF"||scode==="LEX")&&
                     lectSlots.some(sl2=>sl2!==ns&&(S.schedule[g.name]?.[nd]?.[sl2]?.s===scode))) continue;
                  if(violatesSharedSpace(g.name,scode,nd,ns)) continue;
                  // mover la clase sobrante a (nd,ns)
                  S.schedule[g.name][nd][ns]={s:scode,t:stid};
                  if(ocup[stid]) ocup[stid].delete(`${d}-${s}`);
                  (ocup[stid]=ocup[stid]||new Set()).add(`${nd}-${ns}`);
                  // colocar la materia que faltaba (tutor) en (d,s)
                  S.schedule[g.name][d][s]={s:fcode,t:ftid};
                  (ocup[ftid]=ocup[ftid]||new Set()).add(`${d}-${s}`);
                  celdas.splice(i,1);
                  f.n--; so.n--; movido=true;
                }
              }
            }
          });
        });
      });
    }

    // ── CORRECCIÓN DE SOLAPAMIENTOS Y LIBRANZAS DE ELBA (red de seguridad) ──
    // Elba no puede estar en dos grupos a la vez, ni en su libranza. Como su
    // religión se coloca en varias fases (infantil como t, primaria como t2),
    // pueden quedar choques. Aquí los detectamos y reparamos por intercambio.
    {
      const allGroups=S.groups.map(g=>g.name);
      const getCell=(gn,d,s)=>S.schedule[gn]?.[d]?.[s]||S.schedule[gn]?.[String(d)]?.[String(s)];
      const elbaUnav=new Set((S.teachers.find(t=>t.name==="Elba")?.unavail||[]).map(u=>`${u.d}-${u.s}`));
      const elbaIdLocal=S.teachers.find(t=>t.name==="Elba")?.id;

      // ¿Elba está libre (sin clase y sin libranza) en (d,s)?
      function elbaLibre(d,s){
        if(elbaUnav.has(`${d}-${s}`)) return false;
        for(const gg of allGroups){
          const c=getCell(gg,d,s);
          if(c&&(c.t===elbaIdLocal||c.t2===elbaIdLocal)) return false;
        }
        return true;
      }

      if(elbaIdLocal){
        // Recolectar todas las apariciones de Elba
        let problemas=true, vueltas=0;
        while(problemas && vueltas<5){
          problemas=false; vueltas++;
          // mapa franja -> grupos donde está Elba
          const ocup={};
          allGroups.forEach(gn=>{
            DAYS_N.forEach(d=>lectSlots.forEach(s=>{
              const c=getCell(gn,d,s);
              if(c&&(c.t===elbaIdLocal||c.t2===elbaIdLocal)){
                const k=`${d}-${s}`;
                (ocup[k]=ocup[k]||[]).push({gn,d,s,c});
              }
            }));
          });
          // Procesar cada franja: si hay solapamiento O está en libranza, reparar
          Object.entries(ocup).forEach(([k,lista])=>{
            const [d,s]=k.split("-").map(Number);
            const enLibranza=elbaUnav.has(k);
            // cuántas hay que reubicar: si libranza, todas; si solape, todas menos 1
            let desde = enLibranza ? 0 : 1;
            if(lista.length<=desde) return;
            // ordenar: dejar primaria-PC-tutor como ancla preferente (más difícil de mover)
            for(let i=desde;i<lista.length;i++){
              const {gn,c}=lista[i];
              problemas=true;
              const esT2=c.t2===elbaIdLocal&&c.t!==elbaIdLocal;
              // Cuando Elba es t2 (celda "paralela": tutor da PC mientras Elba da
              // REL en la misma franja), el TUTOR (c.t) también debe estar libre
              // en el destino — no basta con que Elba lo esté. Sin esto, mover la
              // celda podía dejar al tutor dando clase en dos grupos a la vez.
              const tutorOtro = esT2 ? c.t : null;
              const tutorLibreEn=(dd,ss)=>{
                if(!tutorOtro) return true;
                if((S.teachers.find(t=>t.id===tutorOtro)?.unavail||[]).some(u=>u.d===dd&&u.s===ss)) return false;
                for(const gg of allGroups){
                  if(gg===gn) continue;
                  const cc=getCell(gg,dd,ss);
                  if(cc&&(cc.t===tutorOtro||cc.t2===tutorOtro)) return false;
                }
                return true;
              };
              // Buscar en el MISMO grupo una franja destino donde:
              //  - Elba esté libre, no sea libranza
              //  - haya una clase del TUTOR (intercambiable) o hueco
              const g=S.groups.find(x=>x.name===gn);
              const tutorId=g?.tutorId;
              let resuelto=false;
              for(const nd of DAYS_N){
                for(const ns of lectSlots){
                  if(nd===d&&ns===s) continue;
                  if(!elbaLibre(nd,ns)) continue;
                  if(!tutorLibreEn(nd,ns)) continue;
                  const destino=getCell(gn,nd,ns);
                  // Caso A: hay hueco libre en el grupo
                  if(!destino){
                    S.schedule[gn][nd][ns]={...c};
                    delete S.schedule[gn][d][s];
                    resuelto=true; break;
                  }
                  // Caso B: destino es una clase intercambiable (sin t2) cuyo
                  // profesor titular esté libre en la franja ORIGEN (d,s) en
                  // todos los grupos, para poder llevarla allí sin chocar.
                  if(destino && !destino.t2 && destino.t!==elbaIdLocal){
                    const profD=destino.t;
                    // ¿profD libre en (d,s)? (en todos los grupos)
                    let profDlibre=true;
                    for(const gg of allGroups){
                      if(gg===gn) continue;
                      const cc=getCell(gg,d,s);
                      if(cc&&(cc.t===profD||cc.t2===profD)){ profDlibre=false; break; }
                    }
                    // y profD no libra en (d,s)
                    const profDUnav=(S.teachers.find(t=>t.id===profD)?.unavail||[]).some(u=>u.d===d&&u.s===s);
                    if(profDlibre && !profDUnav){
                      const tmp={...destino};
                      S.schedule[gn][nd][ns]={...c};       // religión va al destino
                      S.schedule[gn][d][s]=tmp;            // clase del prof va al origen
                      resuelto=true; break;
                    }
                  }
                }
                if(resuelto) break;
              }
              // Plan C: rotación a TRES bandas. Si el intercambio simple falló,
              // probar: religión(origen)→X · clase(X)→Y · clase(Y)→origen.
              // Condiciones: Elba libre en X; prof de X libre en Y; prof de Y
              // libre en el origen. Amplía mucho las combinaciones posibles.
              if(!resuelto){
                const profLibreEn=(pid,dd,ss)=>{
                  if((S.teachers.find(t=>t.id===pid)?.unavail||[]).some(u=>u.d===dd&&u.s===ss)) return false;
                  for(const gg of allGroups){
                    if(gg===gn) continue;
                    const cc=getCell(gg,dd,ss);
                    if(cc&&(cc.t===pid||cc.t2===pid)) return false;
                  }
                  return true;
                };
                outer:
                for(const xd of DAYS_N){ for(const xs of lectSlots){
                  if(xd===d&&xs===s) continue;
                  if(!elbaLibre(xd,xs)) continue;
                  if(!tutorLibreEn(xd,xs)) continue;
                  const cx=getCell(gn,xd,xs);
                  if(!cx||cx.t2||cx.t===elbaIdLocal) continue;
                  for(const yd of DAYS_N){ for(const ys of lectSlots){
                    if((yd===d&&ys===s)||(yd===xd&&ys===xs)) continue;
                    const cy=getCell(gn,yd,ys);
                    if(!cy||cy.t2||cy.t===elbaIdLocal) continue;
                    // prof de X debe poder ir a Y; prof de Y debe poder ir al origen
                    if(!profLibreEn(cx.t,yd,ys)) continue;
                    if(!profLibreEn(cy.t,d,s)) continue;
                    const tmpX={...cx}, tmpY={...cy};
                    S.schedule[gn][xd][xs]={...c};     // religión → X
                    S.schedule[gn][yd][ys]=tmpX;       // clase X → Y
                    S.schedule[gn][d][s]=tmpY;         // clase Y → origen
                    resuelto=true; break outer;
                  }}
                }}
              }
              // Si no se pudo reubicar, quitar a Elba de esa celda (deja PC sin desdoble)
              if(!resuelto){
                const cell=getCell(gn,d,s);
                if(cell && esT2){ delete cell.t2; delete cell.parallel; }
                else if(cell && !esT2){ /* infantil: dejar, se revisará */ }
              }
            }
          });
        }
      }
    }

    // ── DESDOBLE PC INFANTIL (capa visual, tras corregir solapamientos) ──
    marcarDesdoblePCInfantil();

    // ── CUADRO DE GUARDIAS AUTOMÁTICO: se regenera con cada horario nuevo ──
    try{ generateGuards(true); }catch(e){ console.warn("guardias auto:",e); }

    // ── RECALCULAR sesiones realmente sin colocar (sobre el horario FINAL) ──
    // El contador 'skipped'/'conflicts' puede estar desfasado tras las fases
    // 0, 0.5, swap-repair, infantil y religión-2. Recontamos contra S.schedule.
    const realFaltan=[];
    let realSkipped=0;
    primGroups.forEach(g=>{
      const colocado={};
      DAYS_N.forEach(d=>lectSlots.forEach(s=>{
        const c=S.schedule[g.name]?.[d]?.[s]||S.schedule[g.name]?.[String(d)]?.[String(s)];
        if(c&&!c._hold){
          if(c.t){ const k=`${c.s}|${c.t}`; colocado[k]=(colocado[k]||0)+1; }
          if(c.t2){ const k=`${c.s}|${c.t2}`; colocado[k]=(colocado[k]||0)+1; }
        }
      }));
      (S.curriculum[g.id]||[]).forEach(e=>{
        const code=S.subjects.find(s=>s.id===e.sid)?.code||"???";
        const k=`${code}|${e.tid}`;
        const got=colocado[k]||0;
        if(got<e.sessions){
          realSkipped+=e.sessions-got;
          realFaltan.push(`${g.name}|${code}`);
        }
      });
    });

    // ── CHEQUEO DESDOBLE ELBA: toda REL de primaria debe llevar a Elba (t2).
    // El currículum no tiene entradas de Elba en primaria, así que el recuento
    // normal no detecta su ausencia. Si falta, contar como sin colocar para
    // que el auto-repetir rechace este intento y regenere.
    {
      const elbaChk=S.teachers.find(t=>t.name==="Elba")?.id;
      if(elbaChk){
        primGroups.forEach(g=>{
          let relConElba=0, relTotal=0;
          DAYS_N.forEach(d=>lectSlots.forEach(s=>{
            const c=S.schedule[g.name]?.[d]?.[s];
            if(c&&c.s==="REL"){ relTotal++; if(c.t2===elbaChk||c.t===elbaChk) relConElba++; }
          }));
          if(relTotal>0&&relConElba===0){
            realSkipped++;
            realFaltan.push(`${g.name}|REL(sin Elba)`);
          }
        });
      }
    }

    // Estadística de dificultad (lección GHC): registrar qué sesiones fallan
    try{ if(realSkipped>0) realFaltan.forEach(k=>{ _failStats[k]=(_failStats[k]||0)+1; }); }catch(e){}
    const score=Math.max(30,Math.round(100-realSkipped*8-hardViolations.length*15));
    const logLines=[
      [`🚀 Motor CSP — ${S.center.name}`,"#80bde2"],
      [`📊 ${primGroups.length} grupos · ${tasks.length} tareas`,"#80bde2"],
      [`🔄 ${iterUsed} intentos`,"#bfddf0"],
      [`✅ ${placed} sesiones colocadas`,"#4ade80"],
      realSkipped>0?[`❌ ${realSkipped} sin colocar: ${realFaltan.join(" · ")}`,"#f87171"]:[`🎉 HORARIO COMPLETO`,"#4ade80"],
      hardViolations.length>0?[`⬛ ${hardViolations.length} conflictos duros`,"#f87171"]:[`✅ Sin conflictos duros`,"#4ade80"],
      [`📈 ${score}/100 · ⏱️ ${elapsed}ms`,"#80bde2"],
    ].filter(Boolean);

    if(typeof self!=="undefined"&&self.WORKER_MODE){
      // Modo worker: el DOM es falso y nadie ve la animación — pintar todo
      // de golpe (para el reenvío de log) y no perder ~150-250ms/intento.
      logLines.forEach(([text])=>{
        try{ const d=document.createElement("div"); d.textContent=text; $("glog").appendChild(d); }catch(e){}
      });
      finishGen(score,hardViolations.length,realSkipped);
    }else{
      let i=0;
      const tick=setInterval(()=>{
        if(i>=logLines.length){ clearInterval(tick); finishGen(score,hardViolations.length,realSkipped); return; }
        const[text,color]=logLines[i];
        const ln=document.createElement("div"); ln.style.color=color; ln.textContent=text;
        $("glog").appendChild(ln); $("glog").scrollTop=$("glog").scrollHeight;
        $("gpb").style.width=Math.round(((i+1)/logLines.length)*100)+"%";
        $("gst").textContent=Math.round(((i+1)/logLines.length)*100)+"%";
        i++;
      },50);
    }
  } // fin finalizarGen

  // ── ATTEMPT SWAP REPAIR con logs ─────────────────────────────────
  
// ────────────────────────────────────────────────────────────────────
// ── §14 GENERADOR — SWAP REPAIR
// ────────────────────────────────────────────────────────────────────
function attemptSwapRepair(sourceSched, sourceConflicts){
    const ws={};
    primGroups.forEach(g=>{
      ws[g.name]={}; DAYS_N.forEach(d=>{ ws[g.name][d]={...(sourceSched[g.name][d]||{})}; });
    });
    const wb={};
    S.teachers.forEach(t=>{
      wb[t.id]={}; DAYS_N.forEach(d=>{ wb[t.id][d]={}; });
      (t.unavail||[]).forEach(u=>{ wb[t.id][u.d][u.s]=true; });
    });
    primGroups.forEach(g=>DAYS_N.forEach(day=>lectSlots.forEach(slot=>{
      const cell=ws[g.name][day]?.[slot];
      if(cell?.t) wb[cell.t][day][slot]=true;
      // Reservas de religión (_RELHOLD): marcar también a Elba (t2) como
      // ocupada, para que el swap no la mueva ahí ni rompa la reserva.
      if(cell?.t2&&wb[cell.t2]) wb[cell.t2][day][slot]=true;
    })));
    // OCUPACIÓN DE INFANTIL: marcar como ocupadas las franjas donde los
    // profesores (Mikel, etc.) ya están dando clase en infantil. Así el
    // swap-repair NO los moverá a esas franjas y no romperá infantil.
    const infGroupsSwap=S.groups.filter(g=>g.level==='infantil');
    infGroupsSwap.forEach(g=>DAYS_N.forEach(day=>lectSlots.forEach(slot=>{
      const cell=S.schedule[g.name]?.[day]?.[slot]||S.schedule[g.name]?.[String(day)]?.[String(slot)];
      if(cell?.t&&wb[cell.t]) wb[cell.t][day][slot]=true;
      if(cell?.t2&&wb[cell.t2]) wb[cell.t2][day][slot]=true;
    })));

    let totalRepaired=0;
    const remainingConflicts=[];
    const swapLog=[];

    const shuffled=[...sourceConflicts].sort(()=>Math.random()-0.5);
    for(const conf of shuffled){
      const task=conf.task; let remaining=conf.remaining;
      if(!task.tid){ remainingConflicts.push(conf); continue; }
      const tname=S.teachers.find(t=>t.id===task.tid)?.name||task.tid;

      // PASO 1: colocar directo
      for(const day of [...DAYS_N].sort(()=>Math.random()-0.5)){
        // RESTRICCIÓN DURA: EF/Inglés nunca 2 veces el mismo día.
        if((task.code==="EF"||task.code==="LEX")&&
           lectSlots.some(sl2=>ws[task.gname][day]?.[sl2]?.s===task.code)) continue;
        for(const slot of [...lectSlots].sort(()=>Math.random()-0.5)){
          if(remaining<=0) break;
          if(ws[task.gname][day][slot]) continue;
          if(wb[task.tid][day][slot]) continue;
          if(violatesSharedSpace(task.gname,task.code,day,slot)) continue;
          if((task.code==="EF"||task.code==="LEX")&&lectSlots.some(sl2=>sl2!==slot&&ws[task.gname][day]?.[sl2]?.s===task.code)) continue;
              ws[task.gname][day][slot]={s:task.code,t:task.tid};
          wb[task.tid][day][slot]=true;
          remaining--; totalRepaired++;
          swapLog.push(`✅ P1 directo: ${task.gname}/${task.code} → ${DAYS[day-1]} ${day===1?'Lun':day===2?'Mar':day===3?'Mié':day===4?'Jue':'Vie'}`);
        }
        if(remaining<=0) break;
      }
      if(remaining<=0) continue;

      // PASO 2: swap mismo grupo
      for(const day of [...DAYS_N].sort(()=>Math.random()-0.5)){
        if(remaining<=0) break;
        for(const slot of lectSlots){
          if(remaining<=0) break;
          if(wb[task.tid][day][slot]) continue;
          const cell=ws[task.gname][day][slot];
          if(!cell||cell.t===task.tid||cell.t2) continue;   // celdas con t2 (REL desdoble) no se mueven
          const eTid=cell.t,eCode=cell.s;
          for(const ad of DAYS_N){
            for(const as of lectSlots){
              if(ad===day&&as===slot) continue;
              if(ws[task.gname][ad][as]) continue;
              if(eTid&&wb[eTid][ad][as]) continue;
              if(violatesSharedSpace(task.gname,eCode,ad,as)) continue;
              ws[task.gname][ad][as]=cell;
              if(eTid){wb[eTid][ad][as]=true;delete wb[eTid][day][slot];}
              delete ws[task.gname][day][slot];
              if((task.code==="EF"||task.code==="LEX")&&lectSlots.some(sl2=>sl2!==slot&&ws[task.gname][day]?.[sl2]?.s===task.code)) continue;
              ws[task.gname][day][slot]={s:task.code,t:task.tid};
              wb[task.tid][day][slot]=true;
              remaining--;totalRepaired++;
              swapLog.push(`✅ P2 mismo grupo: ${task.gname}/${task.code} moviendo ${eCode}`);
              break;
            }
            if(remaining<conf.remaining) break;
          }
        }
      }
      if(remaining<=0) continue;

      // PASO 3: swap cruzado
      for(const day of [...DAYS_N].sort(()=>Math.random()-0.5)){
        if(remaining<=0) break;
        for(const slot of lectSlots){
          if(remaining<=0) break;
          if(ws[task.gname][day][slot]) continue;
          if(!wb[task.tid][day][slot]) continue;
          if(violatesSharedSpace(task.gname,task.code,day,slot)) continue;
          for(const og of primGroups){
            if(og.name===task.gname) continue;
            const oc=ws[og.name][day]?.[slot];
            if(!oc||oc.t!==task.tid) continue;
            for(const ad of DAYS_N){
              for(const as of lectSlots){
                if(ad===day&&as===slot) continue;
                if(ws[og.name][ad]?.[as]) continue;
                if(wb[task.tid][ad][as]) continue;
                if(violatesSharedSpace(og.name,oc.s,ad,as)) continue;
                if(oc.s==="REL"&&og.tutorId&&ws[og.name][ad]?.[as]?.t===og.tutorId) continue;
                ws[og.name][ad][as]=oc;
                wb[task.tid][ad][as]=true;
                delete ws[og.name][day][slot];
                delete wb[task.tid][day][slot];
                if((task.code==="EF"||task.code==="LEX")&&lectSlots.some(sl2=>sl2!==slot&&ws[task.gname][day]?.[sl2]?.s===task.code)) continue;
              ws[task.gname][day][slot]={s:task.code,t:task.tid};
                wb[task.tid][day][slot]=true;
                remaining--;totalRepaired++;
                swapLog.push(`✅ P3 cruzado: ${task.gname}/${task.code} liberando ${og.name}/${oc.s}`);
                break;
              }
              if(remaining<conf.remaining) break;
            }
            if(remaining<=0) break;
          }
        }
      }
      if(remaining<=0) continue;

      // PASO 4: reubicar la clase estorbo DENTRO de su propio grupo
      // (antes movía la clase a un TERCER grupo, lo cual es un error: una clase
      // pertenece a su grupo y no puede reubicarse en otro. Ahora busca otra
      // franja libre del MISMO blockerG.)
      for(const day of DAYS_N){
        if(remaining<=0) break;
        for(const slot of lectSlots){
          if(remaining<=0) break;
          if(ws[task.gname][day][slot]) continue;
          if(!wb[task.tid][day][slot]) continue;
          let blockerG=null,blockerCell=null;
          for(const og of primGroups){
            if(og.name===task.gname) continue;
            const c=ws[og.name][day]?.[slot];
            if(c&&!c._hold&&!c._anchor&&!c.t2&&c.t===task.tid){blockerG=og;blockerCell=c;break;}
          }
          if(!blockerG) continue;
          // mover blockerCell a otra franja del MISMO blockerG donde su profesor
          // (task.tid) esté libre y la franja del grupo esté vacía
          for(const ad of DAYS_N){
            if(remaining<=0) break;
            for(const as of lectSlots){
              if(ad===day&&as===slot) continue;
              if(ws[blockerG.name][ad]?.[as]) continue;       // hueco en blockerG
              if(wb[task.tid][ad][as]) continue;              // task.tid libre ahí
              if(violatesSharedSpace(blockerG.name,blockerCell.s,ad,as)) continue;
              // mover la clase estorbo dentro de blockerG
              ws[blockerG.name][ad][as]=blockerCell;
              wb[task.tid][ad][as]=true;
              delete ws[blockerG.name][day][slot];
              delete wb[task.tid][day][slot];
              if(!violatesSharedSpace(task.gname,task.code,day,slot)){
                if((task.code==="EF"||task.code==="LEX")&&lectSlots.some(sl2=>sl2!==slot&&ws[task.gname][day]?.[sl2]?.s===task.code)) continue;
              ws[task.gname][day][slot]={s:task.code,t:task.tid};
                wb[task.tid][day][slot]=true;
                remaining--;totalRepaired++;
                swapLog.push(`✅ P4 reubicar: ${task.gname}/${task.code} (movió ${blockerCell.s} en ${blockerG.name})`);
                break;
              }
              // revertir si no se pudo colocar
              ws[blockerG.name][day][slot]=blockerCell;
              wb[task.tid][day][slot]=true;
              delete ws[blockerG.name][ad][as];
              delete wb[task.tid][ad][as];
            }
            if(remaining<conf.remaining) break;
          }
        }
      }
      if(remaining<=0) continue;

      // PASO 4-OLD (DESACTIVADO): movía clases a un tercer grupo (erróneo)
      if(false) for(const day of DAYS_N){
        if(remaining<=0) break;
        for(const slot of lectSlots){
          if(remaining<=0) break;
          if(ws[task.gname][day][slot]) continue;
          if(!wb[task.tid][day][slot]) continue;
          let blockerG=null,blockerCell=null;
          for(const og of primGroups){
            if(og.name===task.gname) continue;
            const c=ws[og.name][day]?.[slot];
            if(c&&!c._hold&&!c._anchor&&!c.t2&&c.t===task.tid){blockerG=og;blockerCell=c;break;}
          }
          if(!blockerG) continue;
          for(const tg of primGroups){
            if(tg.name===task.gname||tg.name===blockerG.name) continue;
            for(const ad of DAYS_N){
              for(const as of lectSlots){
                if(ad===day&&as===slot) continue;
                if(ws[tg.name][ad]?.[as]) continue;
                if(wb[task.tid][ad][as]) continue;
                if(violatesSharedSpace(tg.name,blockerCell.s,ad,as)) continue;
                ws[tg.name][ad][as]=blockerCell;
                wb[task.tid][ad][as]=true;
                delete ws[blockerG.name][day][slot];
                delete wb[task.tid][day][slot];
                if(!violatesSharedSpace(task.gname,task.code,day,slot)){
                  if((task.code==="EF"||task.code==="LEX")&&lectSlots.some(sl2=>sl2!==slot&&ws[task.gname][day]?.[sl2]?.s===task.code)) continue;
              ws[task.gname][day][slot]={s:task.code,t:task.tid};
                  wb[task.tid][day][slot]=true;
                  remaining--;totalRepaired++;
                  swapLog.push(`✅ P4 2niveles: ${task.gname}/${task.code} via ${tg.name}`);
                  break;
                }
                ws[blockerG.name][day][slot]=blockerCell;
                wb[task.tid][day][slot]=true;
                delete ws[tg.name][ad][as];
                delete wb[task.tid][ad][as];
              }
              if(remaining<conf.remaining) break;
            }
            if(remaining<=0) break;
          }
        }
      }
      if(remaining<=0) continue;

      // PASO 5: desplazar otro profesor en el grupo bloqueante
      for(const day of DAYS_N){
        if(remaining<=0) break;
        for(const slot of lectSlots){
          if(remaining<=0) break;
          if(ws[task.gname][day][slot]) continue;
          if(!wb[task.tid][day][slot]) continue;
          let blockerG=null,blockerCell=null;
          for(const og of primGroups){
            if(og.name===task.gname) continue;
            const c=ws[og.name][day]?.[slot];
            if(c&&!c._hold&&!c._anchor&&!c.t2&&c.t===task.tid){blockerG=og;blockerCell=c;break;}
          }
          if(!blockerG) continue;
          for(const bgDay of DAYS_N){
            if(remaining<=0) break;
            for(const bgSlot of lectSlots){
              if(bgDay===day&&bgSlot===slot) continue;
              const bgCell=ws[blockerG.name][bgDay]?.[bgSlot];
              if(!bgCell||bgCell.t===task.tid) continue;
              const bgTid=bgCell.t,bgCode=bgCell.s;
              for(const ad of DAYS_N){
                for(const as of lectSlots){
                  if(ad===bgDay&&as===bgSlot) continue;
                  if(ad===day&&as===slot) continue;
                  if(ws[blockerG.name][ad]?.[as]) continue;
                  if(bgTid&&wb[bgTid][ad][as]) continue;
                  if(violatesSharedSpace(blockerG.name,bgCode,ad,as)) continue;
                  ws[blockerG.name][ad][as]=bgCell;
                  if(bgTid){wb[bgTid][ad][as]=true;delete wb[bgTid][bgDay][bgSlot];}
                  delete ws[blockerG.name][bgDay][bgSlot];
                  if(!wb[task.tid][bgDay][bgSlot]){
                    ws[blockerG.name][bgDay][bgSlot]=blockerCell;
                    wb[task.tid][bgDay][bgSlot]=true;
                    delete ws[blockerG.name][day][slot];
                    delete wb[task.tid][day][slot];
                    if((task.code==="EF"||task.code==="LEX")&&lectSlots.some(sl2=>sl2!==slot&&ws[task.gname][day]?.[sl2]?.s===task.code)) continue;
              ws[task.gname][day][slot]={s:task.code,t:task.tid};
                    wb[task.tid][day][slot]=true;
                    remaining--;totalRepaired++;
                    swapLog.push(`✅ P5 desplazar: ${task.gname}/${task.code} moviendo ${bgCode} en ${blockerG.name}`);
                    break;
                  }
                  ws[blockerG.name][bgDay][bgSlot]=bgCell;
                  if(bgTid){wb[bgTid][bgDay][bgSlot]=true;delete wb[bgTid][ad][as];}
                  delete ws[blockerG.name][ad][as];
                }
                if(remaining<conf.remaining) break;
              }
              if(remaining<=0) break;
            }
          }
        }
      }
      if(remaining<=0) continue;

      // PASO 6: mover sesión al hueco de libranza para liberar franja
      if(remaining>0&&task.tid){
        const tUnavail=S.teachers.find(t=>t.id===task.tid)?.unavail||[];
        const grupoHuecos=[];
        DAYS_N.forEach(day=>lectSlots.forEach(slot=>{
          if(!ws[task.gname][day]?.[slot]) grupoHuecos.push({day,slot});
        }));
        const libranzaHuecos=grupoHuecos.filter(({day,slot})=>
          tUnavail.some(u=>u.d===day&&u.s===slot));
        if(libranzaHuecos.length>0&&grupoHuecos.length===libranzaHuecos.length){
          for(const {day:lDay,slot:lSlot} of libranzaHuecos){
            if(remaining<=0) break;
            for(const srcDay of DAYS_N){
              if(remaining<=0) break;
              for(const srcSlot of lectSlots){
                if(srcDay===lDay&&srcSlot===lSlot) continue;
                const srcCell=ws[task.gname][srcDay]?.[srcSlot];
                if(!srcCell) continue;
                const srcTid=srcCell.t,srcCode=srcCell.s;
                if(srcTid&&wb[srcTid][lDay][lSlot]) continue;
                if(violatesSharedSpace(task.gname,srcCode,lDay,lSlot)) continue;
                if(wb[task.tid][srcDay][srcSlot]) continue;
                if(tUnavail.some(u=>u.d===srcDay&&u.s===srcSlot)) continue;
                ws[task.gname][lDay][lSlot]=srcCell;
                if(srcTid){wb[srcTid][lDay][lSlot]=true;delete wb[srcTid][srcDay][srcSlot];}
                delete ws[task.gname][srcDay][srcSlot];
                ws[task.gname][srcDay][srcSlot]={s:task.code,t:task.tid};
                wb[task.tid][srcDay][srcSlot]=true;
                remaining--;totalRepaired++;
                swapLog.push(`✅ P6 libranza: ${task.gname}/${task.code} moviendo ${srcCode} al hueco de libranza`);
                break;
              }
            }
          }
        }
      }

      if(remaining>0){
        swapLog.push(`❌ FALLO: ${task.gname}/${task.code}/${tname} — ${remaining} sin colocar tras P1-P6`);
        remainingConflicts.push({...conf,remaining});
      }
    }

    // ── PASO 7: reubicar sesión ya colocada del mismo especialista ───
    // EF(Oscar) está en 2ºB Jue5ª. 3ºB necesita EF y su único hueco es Jue5ª.
    // Solución: mover la EF ya colocada de 2ºB a otra franja libre de 2ºB
    // → Jue5ª queda libre en 2ºB → Oscar puede dar EF en 3ºB Jue5ª
    for(const conf of [...remainingConflicts]){
      if(conf.remaining<=0) continue;
      const task=conf.task; if(!task.tid) continue;
      let fixed=false;
      const tUnavail7=S.teachers.find(t=>t.id===task.tid)?.unavail||[];

      // Para cada hueco libre en el grupo destino donde el profesor está ocupado
      for(const day of DAYS_N){
        if(fixed) break;
        for(const slot of lectSlots){
          if(fixed) break;
          if(ws[task.gname][day]?.[slot]) continue; // no es hueco libre
          if(!wb[task.tid][day][slot]) continue; // profesor libre aquí → ya manejado antes

          // El profesor está en otro grupo ogName en day/slot
          let ogName=null;
          for(const og of primGroups){
            if(og.name===task.gname) continue;
            if(ws[og.name][day]?.[slot]?.t===task.tid){ ogName=og.name; break; }
          }
          if(!ogName) continue;

          // Buscar franja alternativa en ogName donde el profesor pueda ir
          // y el grupo tenga hueco libre
          for(const ad of DAYS_N){
            if(fixed) break;
            for(const as of lectSlots){
              if(ad===day&&as===slot) continue;
              if(ws[ogName][ad]?.[as]) continue; // ogName ocupado ahí
              if(wb[task.tid][ad][as]) continue; // profesor ocupado ahí
              if(tUnavail7.some(u=>u.d===ad&&u.s===as)) continue;
              if(violatesSharedSpace(ogName,task.code,ad,as)) continue;
              // Mover la sesión del especialista de day/slot a ad/as en ogName
              const movedCell=ws[ogName][day][slot];
              ws[ogName][ad][as]=movedCell;
              wb[task.tid][ad][as]=true;
              delete ws[ogName][day][slot];
              delete wb[task.tid][day][slot];
              // Ahora colocar la tarea fallida en day/slot
              if((task.code==="EF"||task.code==="LEX")&&lectSlots.some(sl2=>sl2!==slot&&ws[task.gname][day]?.[sl2]?.s===task.code)) continue;
              ws[task.gname][day][slot]={s:task.code,t:task.tid};
              wb[task.tid][day][slot]=true;
              conf.remaining--;
              const idx7=remainingConflicts.indexOf(conf);
              if(conf.remaining<=0&&idx7>-1) remainingConflicts.splice(idx7,1);
              fixed=true;
              swapLog.push(`✅ P7 reubicar: ${ogName}/${task.code} ${DAYS[day-1]}${slot_labels[slot]}→${DAYS[ad-1]}${slot_labels[as]}, colocando ${task.gname}/${task.code}`);
            }
          }
        }
      }
    }

    // ── PASO 8: INTERCAMBIO CON EL TUTOR DEL GRUPO BLOQUEANTE ────────
    // Método experto: P (ej. Arancha) debe dar clase en su grupo G (1ºB) en
    // la franja F (Lun3ª), pero está ocupado en G' (3ºB) dando esa materia.
    // Como TODOS los grupos están al 100% (sin huecos libres), no se puede
    // simplemente mover; hay que INTERCAMBIAR: la clase de P en G' se cambia
    // por una clase del TUTOR de G' (que tiene flexibilidad en su propio grupo).
    // Condiciones: P libre en F', el tutor T' de G' da clase en F', y T' libre
    // en F. Tras el intercambio, P queda libre en F → coloca su clase en G.
    for(const conf of [...remainingConflicts]){
      if(conf.remaining<=0) continue;
      const task=conf.task; if(!task.tid) continue;
      const pUnavail=S.teachers.find(t=>t.id===task.tid)?.unavail||[];
      let fixed=false;

      // Buscar la franja F (day/slot) donde G necesita la clase y P está ocupado en G'
      for(const F_day of DAYS_N){
        if(fixed) break;
        for(const F_slot of lectSlots){
          if(fixed) break;
          if(ws[task.gname][F_day]?.[F_slot]) continue;       // G debe tener hueco en F
          if(pUnavail.some(u=>u.d===F_day&&u.s===F_slot)) continue; // P no libra en F
          if(violatesSharedSpace(task.gname,task.code,F_day,F_slot)) continue;
          // P está dando clase en algún G' en F
          let gp=null;
          for(const og of primGroups){
            if(og.name===task.gname) continue;
            if(ws[og.name][F_day]?.[F_slot]&&!ws[og.name][F_day][F_slot]._hold&&!ws[og.name][F_day][F_slot]._anchor&&ws[og.name][F_day][F_slot].t===task.tid){ gp=og; break; }
          }
          if(!gp) continue;                                   // P no está ocupado → otro paso lo maneja
          const tutorP=gp.tutorId;                            // tutor del grupo bloqueante
          if(!tutorP||tutorP===task.tid) continue;
          const tutorUnavail=S.teachers.find(t=>t.id===tutorP)?.unavail||[];
          // El tutor T' debe estar LIBRE en F para venir a cubrir G' en F
          if(wb[tutorP][F_day]?.[F_slot]) continue;
          if(tutorUnavail.some(u=>u.d===F_day&&u.s===F_slot)) continue;
          const clasePenF=ws[gp.name][F_day][F_slot];          // clase de P en G' (a mover)

          // Buscar F' donde: P libre, y G' tiene una clase del TUTOR T'
          for(const Fp_day of DAYS_N){
            if(fixed) break;
            for(const Fp_slot of lectSlots){
              if(Fp_day===F_day&&Fp_slot===F_slot) continue;
              const celdaFp=ws[gp.name][Fp_day]?.[Fp_slot];
              if(!celdaFp||celdaFp._hold||celdaFp._anchor||celdaFp.t2||celdaFp.t!==tutorP) continue;       // F' debe tener clase del tutor T' (no reserva)
              if(wb[task.tid][Fp_day]?.[Fp_slot]) continue;    // P libre en F'
              if(pUnavail.some(u=>u.d===Fp_day&&u.s===Fp_slot)) continue;
              // chequear espacios compartidos para ambos movimientos
              if(violatesSharedSpace(gp.name,clasePenF.s,Fp_day,Fp_slot)) continue;
              if(violatesSharedSpace(gp.name,celdaFp.s,F_day,F_slot)) continue;
              // ── INTERCAMBIO en G' ──
              // clase de P (estaba en F) → va a F'
              ws[gp.name][Fp_day][Fp_slot]={...clasePenF};
              wb[task.tid][Fp_day][Fp_slot]=true;
              wb[task.tid][F_day][F_slot]=false;               // P libre en F
              // clase del tutor (estaba en F') → va a F
              ws[gp.name][F_day][F_slot]={...celdaFp};
              wb[tutorP][F_day][F_slot]=true;
              wb[tutorP][Fp_day][Fp_slot]=false;               // tutor libre en F'
              // ── colocar la clase pendiente de P en su grupo G, franja F ──
              ws[task.gname][F_day][F_slot]={s:task.code,t:task.tid};
              wb[task.tid][F_day][F_slot]=true;
              conf.remaining--;
              const idx8=remainingConflicts.indexOf(conf);
              if(conf.remaining<=0&&idx8>-1) remainingConflicts.splice(idx8,1);
              fixed=true;
              swapLog.push(`✅ P8 intercambio-tutor: ${gp.name}/${clasePenF.s}↔${celdaFp.s}, libera ${gt(task.tid)?.name||task.tid} para ${task.gname}/${task.code}`);
            }
          }
        }
      }
    }

    // ── PASO 9: REUBICAR MOVIENDO CLASE DEL TUTOR (tu método manual) ─
    // Para colocar la clase de P en G cuando no hay hueco directo: buscar una
    // franja F donde P esté libre pero G tenga una clase DEL TUTOR de G. Mover
    // esa clase del tutor a OTRA franja F' (donde el tutor esté libre y G tenga
    // hueco — o intercambiándola con otra clase del tutor), dejando F libre en
    // G para que P coloque ahí su clase. wb ya incluye infantil → no lo rompe.
    {
      const profLibre=(tid,d,s)=>!wb[tid]?.[d]?.[s];
      const unav=(tid,d,s)=>(S.teachers.find(t=>t.id===tid)?.unavail||[]).some(u=>u.d===d&&u.s===s);
      const dosMismoDia=(gname,code,tid,d,exc)=>{ let n=0; lectSlots.forEach(ss=>{ if(ss!==exc){ const c=ws[gname][d]?.[ss]; if(c&&c.s===code&&c.t===tid) n++; } }); return n>=2; };

      for(const conf of [...remainingConflicts]){
        if(conf.remaining<=0) continue;
        const task=conf.task; if(!task.tid) continue;
        const P=task.tid;
        const g=primGroups.find(x=>x.name===task.gname); if(!g) continue;
        const tutorId=g.tutorId; if(!tutorId) continue;

        let veces=0;
        while(conf.remaining>0 && veces<conf.remaining+1){
          veces++;
          let hecho=false;

          // Buscar franja F: P libre, G ocupada por una clase del TUTOR de G
          for(const fd of DAYS_N){
            if(hecho) break;
            for(const fs of lectSlots){
              if(hecho) break;
              const celdaF=ws[g.name][fd]?.[fs];
              if(!celdaF||celdaF._hold||celdaF._anchor||celdaF.t2||celdaF.t!==tutorId) continue;       // F debe tener clase del tutor (no reserva)
              if(!profLibre(P,fd,fs)||unav(P,fd,fs)) continue; // P libre en F
              if(violatesSharedSpace(g.name,task.code,fd,fs)) continue;
              if(dosMismoDia(g.name,task.code,P,fd,fs)) continue;
              // Mover la clase del tutor (celdaF) a otra franja F' del MISMO grupo.
              // Como todo está al 100%, F' casi nunca está vacía → INTERCAMBIO:
              // la clase del tutor va a F', y la clase que estaba en F' va a F...
              // pero F la queremos para P. Solución: F' debe tener una clase de
              // OTRO profesor (otroP) que pueda irse a F. Hacemos rotación:
              //   tutor: F → F'    |    otroP: F' → (queda libre, su clase se va)
              // En realidad lo que funciona es: mover la clase del tutor a una
              // franja F' donde el tutor pueda y que esté VACÍA, o intercambiar
              // la clase del tutor con otra clase del MISMO tutor en otro grupo.
              for(const pd of DAYS_N){
                if(hecho) break;
                for(const ps of lectSlots){
                  if(hecho) break;
                  if(pd===fd&&ps===fs) continue;
                  if(!profLibre(tutorId,pd,ps)||unav(tutorId,pd,ps)) continue; // tutor libre en F'
                  if(dosMismoDia(g.name,celdaF.s,tutorId,pd,ps)) continue;
                  const celdaFp=ws[g.name][pd]?.[ps];
                  if(!celdaFp){
                    // F' vacía en G → mover clase del tutor ahí (caso simple)
                    if(violatesSharedSpace(g.name,celdaF.s,pd,ps)) continue;
                    ws[g.name][pd][ps]={...celdaF}; wb[tutorId][pd][ps]=true;
                    ws[g.name][fd][fs]={s:task.code,t:P}; wb[P][fd][fs]=true;
                    wb[tutorId][fd][fs]=false;
                    hecho=true;
                  } else if(!celdaFp._hold && !celdaFp._anchor && celdaFp.t && celdaFp.t!==tutorId && !celdaFp.t2){
                    // F' ocupada por otro profesor (otroP). INTERCAMBIO triple:
                    //  - clase del tutor (celdaF) pasa de F a F'
                    //  - clase de otroP (celdaFp) pasa de F' a F... no, F es para P.
                    // En vez de eso: solo sirve si otroP puede ir a otra parte.
                    // Caso viable: intercambiar la clase del tutor (F) con la de
                    // otroP (F') SOLO si tras ello P puede ir a F. Pero P necesita
                    // F libre. Así que: tutor→F', otroP se queda SIN sitio. No vale.
                    // → Este sub-caso no es resoluble con un simple intercambio,
                    //   lo dejamos para no romper. (El P9 actúa en el caso vacío.)
                    continue;
                  }
                }
              }
            }
          }

          if(hecho){
            conf.remaining--;
            swapLog.push(`✅ P9 mover-tutor: ${g.name}/${task.code} colocada liberando franja del tutor`);
            if(conf.remaining<=0){ const idx=remainingConflicts.indexOf(conf); if(idx>-1) remainingConflicts.splice(idx,1); }
          } else break;
        }
      }
    }

    // Mostrar logs de swap en el generador
    if(swapLog.length>0){
      swapLog.forEach(msg=>{
        const ln=document.createElement("div");
        ln.style.cssText=`font-size:10px;color:${msg.startsWith('✅')?'#4ade80':'#f87171'}`;
        ln.textContent=msg;
        const glog=$("glog"); if(glog){glog.appendChild(ln);}
      });
      const glog=$("glog"); if(glog) glog.scrollTop=glog.scrollHeight;
    }

    // Recalcular placed/skipped REALES desde ws (no desde contadores que
    // se desajustan). Excluye REL (la coloca la fase 2 de Elba).
    let newPlaced=0;
    primGroups.forEach(g=>DAYS_N.forEach(d=>lectSlots.forEach(s=>{ const c=ws[g.name][d]?.[s]; if(c&&c.s&&!c._hold) newPlaced++; })));
    let realSkip=0; const realConf=[];
    primGroups.forEach(g=>{
      const colo={};
      DAYS_N.forEach(d=>lectSlots.forEach(s=>{
        const c=ws[g.name][d]?.[s];
        if(c&&c.s&&!c._hold){ if(c.t){const k=c.s+'|'+c.t;colo[k]=(colo[k]||0)+1;} if(c.t2){const k=c.s+'|'+c.t2;colo[k]=(colo[k]||0)+1;} }
      }));
      (S.curriculum[g.id]||[]).forEach(e=>{
        const code=S.subjects.find(s=>s.id===e.sid)?.code||'???';
        if(code==='REL') return;
        const got=colo[code+'|'+e.tid]||0;
        if(got<e.sessions){ realSkip+=e.sessions-got; realConf.push({task:{gname:g.name,code,tid:e.tid},remaining:e.sessions-got}); }
      });
    });
    return {sched:ws,placed:newPlaced,skipped:realSkip,conflicts:realConf};
  }

  runIterations();
} // fin runGenEngine


// ────────────────────────────────────────────────────────────────────
// ── §15 GENERADOR — INFANTIL
// ────────────────────────────────────────────────────────────────────
function runGenInfantil(){
  const glog=$("glog");
  if(glog){ glog.querySelectorAll("div[style*='border:1px solid #4ade80']").forEach(p=>p.remove()); }
  const ln=document.createElement("div");
  ln.style.color="#80bde2"; ln.textContent="🚀 FASE 2: Generando horarios de Infantil...";
  $("glog").appendChild(ln); $("glog").scrollTop=$("glog").scrollHeight;

  setTimeout(()=>{
    const t0=Date.now();
    const lectSlots=S.slots.filter(s=>s.type==="class").map(s=>s.n);
    const DAYS_N=[1,2,3,4,5];
    const infGroups=S.groups.filter(g=>g.level==="infantil");

    // Reconstruir teacherBusy desde primaria ya generada
    const teacherBusy={};
    S.teachers.forEach(t=>{
      teacherBusy[t.id]=new Int32Array(8); // bitmask: 1 entero/día, 1 bit/franja
      (t.unavail||[]).forEach(u=>{ teacherBusy[t.id][u.d]|=(1<<(u.s)); });
    });
    // Marcar franjas ocupadas por primaria
    S.groups.filter(g=>g.level==="primaria").forEach(g=>{
      DAYS_N.forEach(d=>{
        lectSlots.forEach(slot=>{
          const cell=S.schedule[g.name]?.[d]?.[slot];
          if(cell?.t) teacherBusy[cell.t][d]|=(1<<(slot));
        });
      });
    });

    const schedInf={};
    infGroups.forEach(g=>{ schedInf[g.name]={}; DAYS_N.forEach(d=>{ schedInf[g.name][d]={}; }); });

    // Construir tareas de infantil
    const infTasks=[];
    infGroups.forEach(g=>{
      (S.curriculum[g.id]||[]).forEach(e=>{
        if(e.sessions>0){
          const code=S.subjects.find(s=>s.id===e.sid)?.code||"???";
          infTasks.push({gname:g.name,sid:e.sid,tid:e.tid,sessions:e.sessions,code,_placed:false});
        }
      });
    });

    // Orden: especialistas primero (EF, MUS, LEX), tutoras después, GLOB al final
    infTasks.sort((a,b)=>{
      const aSpec=!infGroups.find(g=>g.name===a.gname&&g.tutorId===a.tid);
      const bSpec=!infGroups.find(g=>g.name===b.gname&&g.tutorId===b.tid);
      if(aSpec&&!bSpec) return -1;
      if(!aSpec&&bSpec) return 1;
      if(a.code==='GLOB'&&b.code!=='GLOB') return 1;
      if(a.code!=='GLOB'&&b.code==='GLOB') return -1;
      return b.sessions-a.sessions;
    });

    let infPlaced=0,infSkipped=0;
    const infConflicts=[];

    infTasks.forEach(task=>{
      let remaining=task.sessions;
      const dayCount={}; DAYS_N.forEach(d=>dayCount[d]=0);
      const placements=[];

      // Máx 1 sesión por día en primera pasada, luego 2, luego sin límite
      const esEspecialidadUnicaRGI=(task.code==="EF"||task.code==="LEX");
      for(let maxPD=1;maxPD<=5&&remaining>0;maxPD++){
        const days=[...DAYS_N].sort(()=>Math.random()-0.5);
        for(const day of days){
          if(remaining<=0||dayCount[day]>=maxPD) continue;
          // RESTRICCIÓN DURA: EF/Inglés nunca 2 veces el mismo día.
          if(esEspecialidadUnicaRGI&&lectSlots.some(sl2=>schedInf[task.gname][day]?.[sl2]?.s===task.code)) continue;
          const free=lectSlots.filter(slot=>{
            if(schedInf[task.gname][day][slot]) return false;
            if(task.tid&&((teacherBusy[task.tid][day]>>(slot))&1)) return false;
            return true;
          }).sort(()=>Math.random()-0.5);
          if(free.length===0) continue;
          const slot=free[0];
          schedInf[task.gname][day][slot]={s:task.code,t:task.tid};
          if(task.tid) teacherBusy[task.tid][day]|=(1<<(slot));
          placements.push({day,slot}); dayCount[day]++; remaining--;
        }
      }

      if(remaining===0){
        infPlaced+=task.sessions; task._placed=true;
      } else {
        infSkipped+=task.sessions;
        infConflicts.push(`${task.gname}|${task.code}|faltan ${remaining}`);
      }
    });

    infGroups.forEach(g=>{ S.schedule[g.name]=schedInf[g.name]; });
    marcarDesdoblePCInfantil();   // mantener el desdoble PC también en el reintento manual
    save();

    const elapsed=Date.now()-t0;
    const div=document.createElement("div");
    div.style.cssText=`margin-top:10px;padding:10px;border-radius:6px;text-align:center;
      background:${infSkipped===0?"rgba(74,222,128,.1)":"rgba(251,191,36,.1)"};
      border:1px solid ${infSkipped===0?"#4ade80":"#fbbf24"}`;
    div.innerHTML=infSkipped===0
      ?`<div style="color:#4ade80;font-weight:800">🎉 HORARIO COMPLETO — Primaria + Infantil sin errores</div>
        <button onclick="this.parentNode.remove();navigate('schedule')" style="margin-top:8px;background:#4ade80;color:#002b4a;border:none;padding:8px 18px;font-weight:800;border-radius:4px;cursor:pointer">📅 Ver horario completo</button>`
      :`<div style="color:#fbbf24;font-weight:800">⚠ Infantil: ${infSkipped} sesiones sin colocar</div>
        <div style="color:var(--tx3);font-size:11px;margin-top:4px">${infConflicts.join(" · ")}</div>
        <button onclick="runGenInfantil()" style="margin-top:8px;background:#fbbf24;color:#002b4a;border:none;padding:7px 14px;font-weight:800;border-radius:4px;cursor:pointer">🔄 Reintentar Infantil</button>`;
    $("glog").appendChild(div); $("glog").scrollTop=$("glog").scrollHeight;

    if(infSkipped===0) toast("🎉 Horario completo — Primaria + Infantil sin errores");
    else toast(`Infantil: ${infSkipped} sesiones sin colocar`,"warn");
    navigate("schedule");
  },100);
}

function finishGen(score,hardV,skipped){
  // MODO WORKER: entregar el resultado del intento y no tocar UI ni auto-retry
  if(typeof self!=="undefined" && self.WORKER_MODE){
    self.__lastResult={score,hardV,skipped,schedule:JSON.parse(JSON.stringify(S.schedule))};
    return;
  }
  const btn=$("gbtn");if(!btn)return;
  const perfect=hardV===0&&skipped===0;

  // ── OPTIMIZACIÓN GUIADA POR CALIDAD (lección GHC: "solo se optimizan las
  // soluciones completas; es preferible encontrar varias") ──
  if(_autoOn && perfect){
    let q=0; try{ q=computeQuality(S.schedule).total; }catch(e){}
    try{ learnFromSchedule(S.schedule,q); }catch(e){}
    _qCompletes++;
    if(!_qBestComplete||q>_qBestComplete.q)
      _qBestComplete={q,score,schedule:JSON.parse(JSON.stringify(S.schedule))};
    const gl=$("glog");
    if(gl){ const d=document.createElement("div");
      d.style.cssText="color:#4ade80;font-size:11.5px;font-weight:700";
      d.textContent=`🏅 Horario completo nº${_qCompletes} · calidad ${q}/100 (mejor hasta ahora: ${_qBestComplete.q})`;
      gl.appendChild(d); gl.scrollTop=gl.scrollHeight; }
    if(_qCompletes<3 && _autoTry<_autoMax){
      if(gl){ const d=document.createElement("div"); d.style.cssText="color:#5b7387;font-size:11px";
        d.textContent="   ↻ Buscando otro horario completo para comparar su calidad pedagógica…";
        gl.appendChild(d); }
      setTimeout(()=>{ _runGenAttempt(); },60);
      return;
    }
    if(_qBestComplete){
      S.schedule=JSON.parse(JSON.stringify(_qBestComplete.schedule));
      score=_qBestComplete.score;
      try{ generateGuards(true); }catch(e){}
      if(gl){ const d=document.createElement("div");
        d.style.cssText="color:#4ade80;font-size:12px;font-weight:800";
        d.textContent=`🏆 Elegido el horario completo de mayor calidad pedagógica: ${_qBestComplete.q}/100 (entre ${_qCompletes} completos)`;
        gl.appendChild(d); }
    }
  }

  // ── AUTO-REPETIR: si está activo, no quedó perfecto y quedan intentos ──
  if(_autoOn && !perfect && _autoTry<_autoMax){
    // LOG LEGIBLE: plegar todo el detalle del intento fallido en un bloque
    // desplegable, dejando visible solo el resumen. Cualquier compañero puede
    // leer "Intento 3 · 2 sin colocar" y abrir el detalle solo si le interesa.
    const glogEl=$("glog");
    const seps=glogEl.querySelectorAll(".int-sep");
    const lastSep=seps.length?seps[seps.length-1]:null;
    if(lastSep){
      const det=document.createElement("details");
      det.style.cssText="margin:2px 0 7px";
      const sum=document.createElement("summary");
      sum.style.cssText="color:#f0a868;font-size:11.5px;font-weight:700;cursor:pointer";
      sum.textContent=`🔁 Intento ${_autoTry} de ${_autoMax} — ${skipped} sin colocar · reintentando (pulsa para ver el detalle)`;
      det.appendChild(sum);
      const body=document.createElement("div");
      body.style.cssText="opacity:.75;padding-left:8px;border-left:2px solid #335;margin-top:3px";
      let n=lastSep; const nodes=[];
      while(n){ nodes.push(n); n=n.nextSibling; }
      nodes.forEach(x=>body.appendChild(x));
      det.appendChild(body);
      glogEl.appendChild(det);
    }else{
      const r=document.createElement("div");
      r.style.cssText="color:#f0a868;font-size:11px;font-weight:700;margin-bottom:2px";
      r.textContent=`↳ Intento ${_autoTry}: ${skipped} sin colocar · reintentando…`;
      glogEl.appendChild(r);
    }
    glogEl.scrollTop=glogEl.scrollHeight;
    // guardar el mejor resultado visto hasta ahora
    if(_autoBest===null||skipped<_autoBest.skipped){
      _autoBest={skipped,score,schedule:JSON.parse(JSON.stringify(S.schedule))};
    }
    setTimeout(()=>{ _runGenAttempt(); }, 60);
    return;
  }

  // Si terminamos por agotar intentos y hay un resultado MEJOR guardado, restaurarlo
  if(_autoOn && !perfect && _autoBest && _autoBest.skipped<skipped){
    S.schedule=_autoBest.schedule;
    try{ generateGuards(true); }catch(e){ console.warn("guardias auto:",e); }   // guardias coherentes con el horario restaurado
    skipped=_autoBest.skipped; score=_autoBest.score;
    const r=document.createElement("div");
    r.style.cssText="color:#4ade80;font-size:11px;font-weight:700;margin-bottom:2px";
    r.textContent=`↳ Restaurado el mejor intento: ${skipped} sin colocar`;
    $("glog").appendChild(r);
  }

  try{ showFailStats(); }catch(e){}
  btn.disabled=false;
  btn.textContent="⚡ Regenerar";
  $("gst").textContent=perfect?"✓ COMPLETO":hardV>0?`⚠ ${hardV} CONFLICTOS`:`⚠ ${skipped} sin colocar`;
  $("gst").style.color=perfect?"#4ade80":"#f87171";
  S.activeVersion={name:`Horario generado nº${++_genAttemptNum}`,score,hardViolations:hardV,softViolations:skipped};
  // FIX (versiones fantasma con calidad 0): antes cada generación añadía aquí
  // una entrada a S.versions —la misma lista que usa "Guardar como versión"—
  // pero sin `quality` ni `schedule`. El panel "Calidad y versiones" pintaba
  // esas entradas con calidad 0 (su valor por defecto) y no se podían cargar de
  // verdad. S.versions ahora es EXCLUSIVAMENTE para versiones guardadas a mano.
  const el=$("tb-score");
  if(el){ el.textContent=`${S.activeVersion.name} · ${score}/100 · ${hardV} err`; el.className=hardV===0?"b bg":"b br"; }
  save();
  const div=document.createElement("div");
  if(perfect){
    div.style.cssText="margin-top:12px;padding:12px;background:rgba(74,222,128,.1);border:1px solid #4ade80;border-radius:6px;text-align:center";
    div.innerHTML=`<div style="color:#4ade80;font-weight:800;margin-bottom:8px">🎉 HORARIO COMPLETO — Infantil + Primaria sin errores${_autoOn?` (intento ${_autoTry})`:""}</div>
      <button onclick="navigate('schedule')" style="background:#4ade80;color:#002b4a;border:none;padding:8px 18px;font-weight:800;border-radius:4px;cursor:pointer">📅 Ver horario completo</button>`;
    toast("🎉 Horario completo — pulsa 'Ver horario' cuando revises el log");
  } else {
    div.style.cssText="margin-top:12px;padding:12px;background:rgba(248,113,113,.08);border:1px solid #f87171;border-radius:6px";
    div.innerHTML=`<div style="color:#f87171;font-weight:800;margin-bottom:6px">⚠️ ${skipped} sesiones sin colocar · ${hardV} conflictos duros${_autoOn?` (tras ${_autoTry} intentos)`:""}</div>
      <div style="color:var(--tx3);font-size:11px">Pulsa Regenerar para intentarlo de nuevo con diferente orden.</div>`;
    if(hardV>0) toast(`⚠️ ${hardV} conflictos duros`,"warn");
    else toast(`${skipped} sesiones sin colocar`,"warn");
  }
  $("glog").appendChild(div); $("glog").scrollTop=$("glog").scrollHeight;
}

// Color de los botones (chips) de grupo en la vista "Por grupo":
// Infantil = rosado · Primaria = azules por ciclo (1º-2º claro, 3º-4º medio, 5º-6º oscuro)
function grupoChipColor(gn){
  const g=S.groups.find(x=>x.name===gn);
  if(g&&g.level==="infantil"){
    return {bg:"#db2777", soft:"rgba(219,39,119,.12)", bd:"rgba(219,39,119,.45)", tx:"#f9a8d4"};
  }
  // primaria: detectar el curso (primer dígito del nombre, p.ej. "3ºB" → 3)
  const m=(gn||"").match(/(\d)/);
  const curso=m?parseInt(m[1],10):0;
  if(curso===1||curso===2){      // 1º ciclo — azul claro
    return {bg:"#38bdf8", soft:"rgba(56,189,248,.12)", bd:"rgba(56,189,248,.45)", tx:"#7dd3fc"};
  }
  if(curso===3||curso===4){      // 2º ciclo — azul medio
    return {bg:"#2563eb", soft:"rgba(37,99,235,.14)", bd:"rgba(37,99,235,.5)", tx:"#93b4fc"};
  }
  if(curso===5||curso===6){      // 3º ciclo — azul oscuro
    return {bg:"#1e3a8a", soft:"rgba(30,58,138,.18)", bd:"rgba(30,58,138,.6)", tx:"#9fb3e0"};
  }
  // por defecto (gris neutro)
  return {bg:"#475569", soft:"rgba(71,85,105,.12)", bd:"rgba(71,85,105,.45)", tx:"#cbd5e1"};
}

  }
  const yaHabia=!!S.savedSchedule;
  const proceder=()=>{
    S.savedSchedule=JSON.parse(JSON.stringify(S.schedule));
    S.savedTeacherFunctions=S.teacherFunctions?JSON.parse(JSON.stringify(S.teacherFunctions)):{};
    S.savedGuards=S.guards?JSON.parse(JSON.stringify(S.guards)):null;

    save();
    toast("✓ Horario guardado como oficial");

      "¿Sobrescribir el horario guardado?",
      `Ya tienes un horario guardado del ${S.savedScheduleDate||"—"}. El nuevo horario reemplazará al anterior de forma permanente. ¿Continuar?`,
      proceder
    );
  } else {
    proceder();
  }
}

function manualPlaceCell(gname, day, slot){
  if(!S.schedule[gname]) return;
  // Construir lista de materias pendientes para este grupo
  const g=S.groups.find(g=>g.name===gname);
  if(!g) return;
  const placed={};
  const DAYS_N=[1,2,3,4,5];
  const lectSlots=S.slots.filter(s=>s.type==="class").map(s=>s.n);
  DAYS_N.forEach(d=>lectSlots.forEach(sl=>{
    const cell=S.schedule[gname]?.[d]?.[sl]||S.schedule[gname]?.[String(d)]?.[String(sl)];
    if(cell?.s) placed[cell.s]=(placed[cell.s]||0)+1;
  }));
  const pending=[];
  (S.curriculum[g.id]||[]).forEach(e=>{
    const code=S.subjects.find(s=>s.id===e.sid)?.code||"?";
    const tname=S.teachers.find(t=>t.id===e.tid)?.name||"?";
    const got=placed[code]||0;
    if(got<e.sessions) pending.push({code,tname,tid:e.tid,missing:e.sessions-got});
  });

  if(pending.length===0){ toast("No hay sesiones pendientes en este grupo"); return; }

  // Mostrar modal de selección
  const opts=pending.map(p=>`<option value="${p.code}|${p.tid}">${p.code} — ${p.tname} (faltan ${p.missing})</option>`).join('');
  const mb=document.createElement('div');
  mb.className='mb-overlay';
  mb.innerHTML=`<div class="mb" style="max-width:340px">
    <div style="font-size:14px;font-weight:800;color:var(--tx);margin-bottom:12px">
      Añadir sesión en ${gname} — ${['Lun','Mar','Mié','Jue','Vie'][day-1]} ${slot}ª
    </div>
    <div class="f" style="margin-bottom:14px">
      <label>Materia pendiente</label>
      <select id="manual-sel" style="width:100%">${opts}</select>
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn" onclick="this.closest('.mb-overlay').remove()">Cancelar</button>
      <button class="btn bg2" onclick="doManualPlace('${gname}','${day}','${slot}',document.getElementById('manual-sel').value);this.closest('.mb-overlay').remove()">Colocar</button>
    </div>
  </div>`;
  document.body.appendChild(mb);
  mb.addEventListener('click',e=>{ if(e.target===mb) mb.remove(); });
}

function doManualPlace(gname,day,slot,val){
  const [code,tid]=val.split('|');
  if(!code||!tid) return;
  if(!S.schedule[gname]) S.schedule[gname]={};
  if(!S.schedule[gname][day]) S.schedule[gname][day]={};
  const g=S.groups.find(g=>g.name===gname);
  const elbaId=S.teachers.find(t=>t.name==="Elba")?.id||null;

  if(code==="REL"){
    // El desdoble REL/PC son DOS profesores en la MISMA celda:
    // el profesor de PC (t) y Elba (t2). Identificar ambos desde curriculum.
    let pcTid=null;
    (S.curriculum[g?.id]||[]).forEach(e=>{
      const c=S.subjects.find(s=>s.id===e.sid)?.code;
      if(c==="REL"&&e.tid!==elbaId) pcTid=e.tid;
    });
    // Colocar PC + Elba juntos en la celda clicada
    S.schedule[gname][day][slot]={s:"REL",t:pcTid||tid,t2:elbaId,parallel:true};
  } else {
    S.schedule[gname][day][slot]={s:code,t:tid};
  }
  S.schedule[gname][String(day)]=S.schedule[gname][day];
  save(); pgSchedule($('ct'));
  toast(`✅ ${code} colocado en ${gname} manualmente`);
}

function diagRecursos(){
  const DAYS_N=[1,2,3,4,5];
  const lectSlots=S.slots.filter(s=>s.type==="class").map(s=>s.n);
  const DAYL=["L","M","X","J","V"];
  const slbl={1:"1ª",2:"2ª",3:"3ª",6:"4ª",7:"5ª"};
  const primGroups=S.groups.filter(g=>g.level==="primaria");
  const infGroups=S.groups.filter(g=>g.level==="infantil");
  const elbaId=S.teachers.find(t=>t.name==="Elba")?.id||null;
  function getCell(gn,d,s){ return S.schedule[gn]?.[d]?.[s]||S.schedule[gn]?.[String(d)]?.[String(s)]; }

  let out="=== DIAGNÓSTICO DE RECURSOS ===\n\n";

  // ── 1. PRESIÓN POR PROFESOR ──────────────────────────────
  // horas asignadas en curriculum vs franjas libres reales (25 - libranzas)
  out+="── PRESIÓN POR PROFESOR (horas asignadas / franjas disponibles) ──\n";
  out+="(presión alta = pocas franjas libres para sus clases)\n\n";
  const profStats=[];
  S.teachers.forEach(t=>{
    let horas=0;
    S.groups.forEach(g=>{
      (S.curriculum[g.id]||[]).forEach(e=>{ if(e.tid===t.id) horas+=e.sessions; });
    });
    if(horas===0) return;
    const libranzas=(t.unavail||[]).filter(u=>lectSlots.includes(u.s)).length;
    const disp=lectSlots.length*5-libranzas; // 25 - libranzas
    const pres=disp>0?(horas/disp):99;
    profStats.push({name:t.name,horas,disp,libranzas,pres});
  });
  profStats.sort((a,b)=>b.pres-a.pres);
  profStats.forEach(p=>{
    const bar=p.pres>=0.95?"🔴":p.pres>=0.80?"🟠":p.pres>=0.6?"🟡":"🟢";
    out+=`${bar} ${p.name.padEnd(16)} ${p.horas}h / ${p.disp} libres (${Math.round(p.pres*100)}%)${p.libranzas?` · ${p.libranzas} libranzas`:""}\n`;
  });

  // ── 2. TUTORES VIAJEROS (dan clase en grupos que no son el suyo) ──
  out+="\n── TUTORES VIAJEROS (dan materias fuera de su grupo) ──\n";
  out+="(estos podrían cubrir libranzas de los grupos que visitan)\n\n";
  primGroups.forEach(g=>{
    const tutorId=g.tutorId;
    if(!tutorId) return;
    const tutorName=S.teachers.find(t=>t.id===tutorId)?.name||"?";
    const fuera=[];
    primGroups.forEach(g2=>{
      if(g2.id===g.id) return;
      (S.curriculum[g2.id]||[]).forEach(e=>{
        if(e.tid===tutorId){
          const code=S.subjects.find(s=>s.id===e.sid)?.code||"?";
          fuera.push(`${g2.name}/${code}×${e.sessions}`);
        }
      });
    });
    if(fuera.length>0) out+=`${tutorName} (tutor ${g.name}) → ${fuera.join(", ")}\n`;
  });

  // ── 3. LIBRANZAS DE TUTORES DE PRIMARIA: ¿quién las cubre? ──
  out+="\n── LIBRANZAS DE TUTORES DE PRIMARIA ──\n";
  out+="(franja libranza → qué hay colocado ahora en el grupo)\n\n";
  primGroups.forEach(g=>{
    const tutor=S.teachers.find(t=>t.id===g.tutorId);
    if(!tutor) return;
    const libr=(tutor.unavail||[]).filter(u=>lectSlots.includes(u.s));
    if(libr.length===0) return;
    out+=`${g.name} (tutor ${tutor.name} libra: `;
    out+=libr.map(u=>`${DAYL[u.d-1]}${slbl[u.s]}`).join(", ")+")\n";
    libr.forEach(u=>{
      const c=getCell(g.name,u.d,u.s);
      if(c){
        const who=S.teachers.find(t=>t.id===c.t)?.name||"?";
        out+=`    ${DAYL[u.d-1]}${slbl[u.s]}: ${c.s} (${who})\n`;
      } else {
        out+=`    ${DAYL[u.d-1]}${slbl[u.s]}: ⚠ VACÍO (libranza sin cubrir)\n`;
      }
    });
  });

  // ── 4. RELIGIÓN POR GRUPO ──────────────────────────────────
  out+="\n── RELIGIÓN/PC POR GRUPO ──\n";
  out+="(PC-tutor = el tutor da PC · PC-otro = lo da un especialista)\n\n";
  primGroups.forEach(g=>{
    // ¿Quién da el PC? (REL que no es de Elba)
    let pcTid=null, pcSessions=0;
    (S.curriculum[g.id]||[]).forEach(e=>{
      const code=S.subjects.find(s=>s.id===e.sid)?.code;
      if(code==="REL"&&e.tid!==elbaId){ pcTid=e.tid; pcSessions=e.sessions; }
    });
    const pcName=S.teachers.find(t=>t.id===pcTid)?.name||"?";
    const esTutor=pcTid===g.tutorId;
    // ¿Está colocada la REL?
    let relCell=null;
    DAYS_N.forEach(d=>lectSlots.forEach(s=>{
      const c=getCell(g.name,d,s);
      if(c?.s==="REL"){ relCell={d,s,c}; }
    }));
    // franjas libres del grupo
    let libres=0;
    DAYS_N.forEach(d=>lectSlots.forEach(s=>{ if(!getCell(g.name,d,s)) libres++; }));
    const tipo=esTutor?"PC-tutor":"PC-otro";
    if(relCell){
      const elbaOk=relCell.c.t2===elbaId?"+Elba":"⚠SIN Elba";
      out+=`✅ ${g.name} [${tipo}]: REL en ${DAYL[relCell.d-1]}${slbl[relCell.s]} (${pcName} ${elbaOk})\n`;
    } else {
      out+=`❌ ${g.name} [${tipo}]: SIN REL · ${pcName} · ${libres} franjas libres en grupo\n`;
    }
  });

  // Mostrar overlay copiable
  const mb=document.createElement('div');
  mb.className='mb-overlay';
  mb.innerHTML=`<div class="mb" style="max-width:640px">
    <div style="font-size:14px;font-weight:800;margin-bottom:10px">Diagnóstico de recursos</div>
    <textarea readonly style="width:100%;height:420px;font-family:monospace;font-size:10px;background:#0a0a0a;color:#a3e635;border:1px solid #333;border-radius:4px;padding:8px;white-space:pre">${out}</textarea>
    <div style="margin-top:10px;text-align:right">
      <button class="btn" onclick="this.closest('.mb-overlay').remove()">Cerrar</button>
    </div>
  </div>`;
  document.body.appendChild(mb);
  mb.addEventListener('click',e=>{ if(e.target===mb) mb.remove(); });
}

// libranzas y funciones ya asignadas a mano.
function fillAllHoles(label){
  if(!Object.keys(S.schedule).length){ toast("Genera primero un horario","warn"); return; }
  const lect=(S.slots||[]).filter(s=>s.type==="class"||s.type==="lectiva");
  if(!S.teacherFunctions) S.teacherFunctions={};
  let total=0,profes=0;
  S.teachers.forEach(t=>{
    if(!S.teacherFunctions[t.id]) S.teacherFunctions[t.id]={};
    const unavail=t.unavail||[]; let n=0;
    for(let d=1;d<=5;d++) for(const sl of lect){
      if(getTchSes(t.id,d,sl.n)) continue;                 // clase o guardia
      if(unavail.some(u=>u.d===d&&u.s===sl.n)) continue;   // libranza
      const key=d+"-"+sl.n;
      if(S.teacherFunctions[t.id][key]) continue;          // función manual previa
      S.teacherFunctions[t.id][key]=label; n++;
    }
    if(n){ total+=n; profes++; }
  });
  save();
  toast(total?("🧩 "+total+" huecos de "+profes+" profesores → "+label):"No quedan huecos libres");
  navigate("guards");
}

function fillTeacherLibrary(tid){
  if(!tid){ toast("Abre primero la vista de un profesor"); return; }
  const tch=gt(tid);
  if(!S.teacherFunctions) S.teacherFunctions={};
  if(!S.teacherFunctions[tid]) S.teacherFunctions[tid]={};
  const lect=(S.slots||[]).filter(s=>s.type==="lectiva");
  const unavail=(S.teachers.find(t=>t.id===tid)?.unavail)||[];
  let n=0;
  for(let d=1;d<=5;d++){
    for(const sl of lect){
      // ¿tiene clase en esta franja?
      if(getTchSes(tid,d,sl.n)) continue;
      // ¿libranza?
      if(unavail.some(u=>u.d===d&&u.s===sl.n)) continue;

      const key=`${d}-${sl.n}`;
      if(S.teacherFunctions[tid][key]) continue;
      S.teacherFunctions[tid][key]="Dinamización de biblioteca";
      n++;
    }

  save(); pgSchedule($('ct'));
  toast(n?`${n} huecos de ${tch?.name||""} → Dinamización de biblioteca`:"No quedan huecos libres");
}
