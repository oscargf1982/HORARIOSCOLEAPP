<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🆕 CURSO NUEVO (4 infantiles) — CEIP Monforte</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,500;6..12,600;6..12,700;6..12,800;6..12,900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  /* ══════════════════════════════════════════════════
     Paleta Xunta de Galicia — Manual de Identidad 2021
     ══════════════════════════════════════════════════
     Color principal:   #007bc4  (Pantone 7461C · RGB 0,123,196)
     Color secundario:  #002b4a  (Pantone 7463C · RGB 0,43,74)
     Tinta 50%:         #80bde2
     Tinta 25%:         #bfddf0
     Tinta 10%:         #e6f3fa
     Blanco:            #ffffff
     Texto negro:       #1a1a1a
  */
  --xblue:  #007bc4;   /* azul corporativo principal */
  --xdark:  #002b4a;   /* azul marino secundario */
  --x50:    #80bde2;   /* 50% azul */
  --x25:    #bfddf0;   /* 25% azul */
  --x10:    #e6f3fa;   /* 10% azul — fondo muy suave */
  --x5:     #f2f8fd;   /* 5% azul — casi blanco */

  /* Fondos — blanco institucional */
  --bg:     #f4f6f8;   /* fondo app — gris muy suave */
  --surf:   #ffffff;   /* cards y sidebar — blanco puro */
  --surf2:  #f2f8fd;   /* inputs, hover — azul 5% */
  --surf3:  #e6f3fa;   /* elementos secundarios — azul 10% */
  --bd:     #d0e4f0;   /* bordes principales */
  --bd2:    #b8d4e8;   /* bordes secundarios */

  /* Texto — negro sobre blanco (norma corporativa) */
  --tx:     #1a1a1a;   /* texto principal */
  --tx2:    #2d4a5f;   /* texto secundario — azul muy oscuro */
  --tx3:    #6a8fa8;   /* texto terciario — azul medio */

  /* Acento = azul Xunta */
  --bl:     var(--xblue);
  --bl2:    #1a8fd1;
  --bld:    var(--x10);

  /* OK = azul oscuro (no hay verde en la identidad Xunta) */
  --gr:     var(--xdark);
  --grd:    #e6eef4;
  --sage:   var(--xdark);
  --saged:  #e6eef4;
  --sage2:  var(--x50);

  /* Advertencia = azul 50% (no hay naranja en la identidad) */
  --am:     #5a8fa8;
  --amd:    var(--x10);
  --orange: #5a8fa8;
  --oranged:var(--x10);

  /* Error = rojo reservado solo para alertas críticas */
  --rd:     #c0392b;
  --rdd:    #fdecea;

  /* Slate = azul marino */
  --slate:  var(--xdark);
  --slate2: var(--x50);
  --slated: var(--x10);

  --coral:  var(--xblue);
  --coral2: var(--bl2);
  --corald: var(--x10);

  --r:10px;--rs:6px;
}

/* ── Fuente corporativa: Myriad Pro no disponible en web,
   usamos Nunito Sans que es la alternativa más fiel ── */
@import url('https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800;900&family=DM+Mono:wght@400;500&display=swap');

html,body{height:100%;overflow:hidden;background:var(--bg);font-family:'Nunito Sans','DM Sans',sans-serif;color:var(--tx);font-weight:500}
body{display:flex}

/* ── SIDEBAR ── */
#sidebar{width:232px;background:var(--xdark);border-right:none;display:flex;flex-direction:column;height:100vh;flex-shrink:0}
.slogo{padding:22px 20px 16px;border-bottom:1px solid rgba(255,255,255,.12)}
.slogo .sn{font-size:14px;font-weight:800;color:#fff;letter-spacing:.01em;cursor:pointer;transition:color .15s;text-transform:uppercase}
.slogo .sn:hover{color:var(--x25)}
.slogo .sy{font-size:11px;color:var(--x50);margin-top:2px}
.slogo .sm{display:inline-flex;align-items:center;gap:4px;font-size:9px;font-weight:700;color:var(--xdark);background:var(--x25);padding:2px 8px;border-radius:2px;margin-top:7px;letter-spacing:.08em;text-transform:uppercase}
nav{flex:1;padding:10px 0;overflow-y:auto}
.nsec{font-size:9px;font-weight:800;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.12em;padding:12px 20px 5px}
.ni{display:flex;align-items:center;gap:10px;padding:9px 20px;cursor:pointer;font-size:13px;font-weight:600;color:rgba(255,255,255,.7);border-left:3px solid transparent;transition:all .15s;border:none;background:none;width:100%;text-align:left;font-family:'Nunito Sans',sans-serif}
.ni:hover{color:#fff;background:rgba(255,255,255,.08)}
.ni.on{color:#fff;background:rgba(0,123,196,.5);border-left:3px solid var(--xblue);font-weight:800}
.ni .ic{font-size:14px;width:18px;text-align:center}
.sfooter{padding:12px 20px;border-top:1px solid rgba(255,255,255,.1);font-size:10px;color:rgba(255,255,255,.4);line-height:1.7}

/* ── TOPBAR ── */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#topbar{height:56px;background:var(--xblue);border-bottom:none;display:flex;align-items:center;padding:0 28px;gap:12px;flex-shrink:0}
#topbar .pt{font-size:16px;font-weight:800;color:#fff;letter-spacing:.01em;text-transform:uppercase}
#topbar .ps{font-size:12px;color:rgba(255,255,255,.7)}
#topbar .sp{flex:1}
#ct{flex:1;overflow-y:auto;padding:24px 28px;background:var(--bg)}

/* ── CARDS ── */
.card{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r);padding:18px;box-shadow:0 1px 3px rgba(0,43,74,.06)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.ga{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:12px}
.stat{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r);padding:17px 20px;border-top:3px solid currentColor;box-shadow:0 1px 3px rgba(0,43,74,.06)}
.stat .v{font-size:28px;font-weight:800;line-height:1}
.stat .l{font-size:13px;font-weight:600;color:var(--tx2);margin-top:4px}
.stat .s{font-size:11px;color:var(--tx3);margin-top:3px}

/* ── BADGES ── */
.b{display:inline-flex;align-items:center;font-size:10px;font-weight:700;padding:3px 9px;border-radius:2px;text-transform:uppercase;letter-spacing:.04em}
.bg{background:var(--x10);color:var(--xdark)}
.bb{background:var(--x25);color:var(--xdark)}
.ba{background:#fff3cd;color:#856404;border:1px solid #ffc107}
.br{background:#fdecea;color:var(--rd)}
.bp{background:var(--xblue);color:#fff}
.bk{background:var(--surf3);color:var(--tx3);border:1px solid var(--bd)}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:var(--rs);cursor:pointer;font-weight:700;font-family:'Nunito Sans',sans-serif;transition:all .15s;letter-spacing:.01em}
.bp2{background:var(--xblue);color:#fff;padding:8px 16px;font-size:13px;border-radius:2px}
.bp2:hover{background:#0069a8}
.bg2{background:var(--xdark);color:#fff;padding:8px 16px;font-size:13px;border-radius:2px}
.bg2:hover{background:#001e35}
.bo{background:transparent;color:var(--xblue);border:2px solid var(--xblue);padding:6px 14px;font-size:13px;border-radius:2px}
.bo:hover{background:var(--x10)}
.bgh{background:transparent;color:var(--tx3);padding:5px 8px;font-size:12px;border-radius:2px}
.bgh:hover{color:var(--xblue);background:var(--x10)}
.bsm{padding:4px 10px!important;font-size:11px!important}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* ── FORM ── */
.f{display:flex;flex-direction:column;gap:4px}
.f label{font-size:11px;font-weight:700;color:var(--tx2);text-transform:uppercase;letter-spacing:.06em}
.f input,.f select,.f textarea{background:#fff;border:1px solid var(--bd2);border-radius:2px;padding:8px 12px;font-size:13px;color:var(--tx);font-family:'Nunito Sans',sans-serif;font-weight:500;outline:none;transition:border .15s;width:100%}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--xblue);border-width:2px;background:#fff}
.f select option{background:#fff}
.inp{background:#fff;border:1px solid var(--bd2);border-radius:3px;padding:8px 10px;font-size:13px;color:var(--tx);font-family:'Nunito Sans',sans-serif;font-weight:600;outline:none;width:100%}
.inp:focus{border-color:var(--xblue);border-width:2px}
.inp option{background:#fff;color:var(--tx)}

/* ── TABLE ── */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{padding:10px 13px;text-align:left;font-weight:800;color:#fff;border-bottom:none;font-size:11px;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;background:var(--xblue)}
.tbl td{padding:9px 13px;border-bottom:1px solid var(--bd);color:var(--tx);font-weight:500}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr:hover td{background:var(--x10)}

/* ── MODAL ── */
.ov{position:fixed;inset:0;background:rgba(0,43,74,.55);z-index:1000;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.mb{background:#fff;border:none;border-radius:var(--r);padding:28px;max-width:540px;width:92vw;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,43,74,.2)}
.mb.w{max-width:700px}
.mt{font-size:18px;font-weight:800;color:var(--xdark);margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;text-transform:uppercase;letter-spacing:.01em}

/* ── AVAILABILITY ── */
.agrid{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
.asl{height:24px;border-radius:2px;cursor:pointer;border:none;font-size:9px;font-weight:700;transition:all .15s;display:flex;align-items:center;justify-content:center;width:100%;margin-bottom:3px}
.av{background:var(--x10);color:var(--xdark);border:1px solid var(--bd)}
.au{background:#fdecea;color:var(--rd);border:1px solid #f5c6c3}

/* ── SCHEDULE GRID ── */
.sg{display:grid;gap:3px}
.sh3{background:var(--xblue);border-radius:2px;padding:7px 4px;text-align:center;font-size:11px;font-weight:800;color:#fff;letter-spacing:.04em;text-transform:uppercase}
.stc{display:flex;flex-direction:column;justify-content:center;align-items:center;padding:4px;background:var(--surf3);border-radius:2px;font-size:9px;color:var(--tx2);text-align:center;border:1px solid var(--bd)}
.sc{min-height:56px;border-radius:2px;padding:5px 7px;cursor:grab;border:1px solid transparent;transition:all .1s}
.sc:active{cursor:grabbing}
.sc.emp{background:var(--surf2);border:1px dashed var(--bd);cursor:default}
.sc.ov2{border:2px solid var(--xblue)!important;background:var(--x10)!important}
.sc.dr{opacity:.3}
.rc{border-radius:2px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:var(--xdark);letter-spacing:.06em;background:var(--x25);border:1px solid var(--x50);text-transform:uppercase}

/* ── PROGRESS ── */
.pbar{height:6px;background:var(--surf3);border-radius:0;overflow:hidden;margin:8px 0}
.pfill{height:100%;background:linear-gradient(90deg,var(--xblue),var(--x50));border-radius:0;transition:width .3s}
.glog{background:var(--xdark);border:none;border-radius:var(--r);padding:14px 16px;font-family:'DM Mono',monospace;font-size:11px;line-height:1.9;height:360px;overflow-y:auto}

/* ── MISC ── */
input[type=range]{-webkit-appearance:none;width:100%;height:4px;border-radius:0;background:var(--bd);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:2px;background:var(--xblue);cursor:pointer}
.cbr{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--tx);cursor:pointer;font-weight:500}
.cbr input{width:15px;height:15px;accent-color:var(--xblue);cursor:pointer}
.chip{display:inline-flex;align-items:center;padding:5px 13px;border-radius:2px;font-size:12px;font-weight:700;cursor:pointer;border:2px solid var(--bd2);background:#fff;color:var(--tx2);transition:all .15s;text-transform:uppercase;letter-spacing:.03em}
.chip:hover{border-color:var(--xblue);color:var(--xblue);background:var(--x10)}
.chip.on{background:var(--xblue);color:#fff;border-color:var(--xblue)}
.tabs{display:flex;gap:2px;background:var(--surf3);border-radius:2px;padding:3px;border:1px solid var(--bd)}
.tbtn{padding:6px 14px;border-radius:2px;border:none;background:transparent;color:var(--tx3);font-size:12px;font-weight:700;cursor:pointer;font-family:'Nunito Sans',sans-serif;transition:all .15s;text-transform:uppercase;letter-spacing:.03em}
.tbtn.on{background:var(--xblue);color:#fff;box-shadow:0 1px 4px rgba(0,43,74,.15)}
.av2{width:30px;height:30px;border-radius:2px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;flex-shrink:0}
.pdots{display:flex;gap:2px;align-items:center}
.pd{width:5px;height:5px;border-radius:1px}
#toast{position:fixed;bottom:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:6px}
.ti{background:var(--xdark);border:none;border-radius:4px;padding:11px 16px;font-size:13px;font-weight:700;color:#fff;box-shadow:0 8px 24px rgba(0,43,74,.25);display:flex;align-items:center;gap:8px;animation:sli .25s ease}
@keyframes sli{from{transform:translateX(80px);opacity:0}to{transform:none;opacity:1}}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--surf2)}
::-webkit-scrollbar-thumb{background:var(--x50);border-radius:2px}
::-webkit-scrollbar-thumb:hover{background:var(--xblue)}
.sh2{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px}
.sh2 h1{font-size:22px;font-weight:900;color:var(--xdark);letter-spacing:-.01em;text-transform:uppercase}
.sh2 p{font-size:12px;color:var(--tx3);margin-top:3px;font-weight:500}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 20px;color:var(--tx3);text-align:center}
.empty .ei{font-size:42px;margin-bottom:12px}
.empty .et{font-size:15px;font-weight:800;color:var(--xdark);margin-bottom:6px;text-transform:uppercase;letter-spacing:.01em}
.empty .es{font-size:13px;line-height:1.6;font-weight:500}
.step{display:flex;align-items:flex-start;gap:14px;padding:14px 16px;background:var(--surf2);border-radius:var(--r);border-left:4px solid var(--bd2);margin-bottom:8px}
.stepn{width:32px;height:32px;border-radius:2px;background:var(--xblue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;flex-shrink:0}
.stepdone .stepn{background:var(--xdark)}
.stepdone{border-left-color:var(--xdark)}
.iznzone{border:2px dashed var(--bd2);border-radius:var(--r);padding:28px;text-align:center;cursor:pointer;transition:all .2s}
.iznzone:hover{border-color:var(--xblue);background:var(--x10)}

/* ── RESPONSIVE ─────────────────────────────────────────────────── */
#menu-toggle{display:none;position:fixed;top:10px;left:10px;z-index:3000;
  background:var(--xblue);border:none;border-radius:6px;width:40px;height:40px;
  cursor:pointer;align-items:center;justify-content:center;flex-direction:column;gap:5px;
  box-shadow:0 2px 12px rgba(0,43,74,.35);}
#menu-toggle span{display:block;width:20px;height:2px;background:#fff;border-radius:2px;transition:all .25s;}
#menu-toggle.open span:nth-child(1){transform:translateY(7px) rotate(45deg);}
#menu-toggle.open span:nth-child(2){opacity:0;}
#menu-toggle.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg);}
#sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1500;}

@media(max-width:900px){
  #menu-toggle{display:flex;}
  #sidebar{position:fixed;top:0;left:0;height:100vh;z-index:2000;
    transform:translateX(-100%);transition:transform .28s cubic-bezier(.4,0,.2,1);
    box-shadow:4px 0 24px rgba(0,0,0,.3);}
  #sidebar.open{transform:translateX(0);}
  #sidebar-overlay.open{display:block;}
  #main{width:100%;}
  #topbar{padding:0 16px 0 60px;gap:8px;}
  #ct{padding:16px 14px;}
  .g2,.g3,.g4{grid-template-columns:1fr;}
  .ga{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));}
  .tabs{overflow-x:auto;flex-wrap:nowrap;}
  .tbtn{white-space:nowrap;padding:6px 10px;font-size:11px;}
  .card{padding:14px;}
  .glog{height:220px;}
  .mb{width:96vw;max-width:96vw;padding:18px;max-height:92vh;}
  #tb-score{display:none;}
}

@media(max-width:600px){
  #topbar{height:50px;padding:0 12px 0 56px;}
  #ct{padding:12px 10px;}
  .tbl-wrap{overflow-x:auto;}
  .tbl{min-width:480px;}
  .agrid{gap:2px;}
  .asl{height:20px;font-size:8px;}
  .btn{padding:9px 14px;}
  #toast{right:10px;left:10px;bottom:12px;}
  .ti{font-size:12px;padding:10px 14px;}
  #schedule-sidebar{display:none;}
}

@media(min-width:901px){
  #sidebar-overlay{display:none!important;}
}
</style>
</head>
<body>
<button id="menu-toggle" onclick="toggleSidebar()" aria-label="Menú">
  <span></span><span></span><span></span>
</button>
<div id="sidebar-overlay" onclick="toggleSidebar()"></div>
<aside id="sidebar">
  <div class="slogo">
    <!-- Logo CEIP de Monforte adaptado a identidad Xunta -->
    <svg width="168" height="36" viewBox="0 0 168 36" fill="none" xmlns="http://www.w3.org/2000/svg" style="margin-bottom:10px;display:block">
      <rect x="0" y="20" width="70" height="10" rx="1" fill="#007bc4"/>
      <rect x="0" y="17" width="54" height="3" rx="1" fill="#80bde2"/>
      <polygon points="54,17 104,2 104,17" fill="rgba(255,255,255,0.25)"/>
      <rect x="60" y="24" width="2" height="6" fill="#bfddf0"/>
      <rect x="65" y="24" width="2" height="6" fill="#bfddf0"/>
      <rect x="70" y="24" width="2" height="6" fill="#bfddf0"/>
      <rect x="114" y="4" width="26" height="26" rx="1" fill="rgba(255,255,255,0.18)"/>
      <rect x="119" y="9" width="6" height="6" rx="1" fill="rgba(255,255,255,0.3)"/>
      <rect x="128" y="9" width="6" height="6" rx="1" fill="rgba(255,255,255,0.3)"/>
      <rect x="0" y="30" width="144" height="1.5" rx="0" fill="rgba(255,255,255,0.15)"/>
    </svg>
    <div class="sn" onclick="navigate('config')" title="Configurar centro"><span id="sb-name">CEIP de Monforte</span></div>
    <div style="background:#16a34a;color:#fff;font-size:10px;font-weight:700;text-align:center;padding:3px 6px;border-radius:6px;margin:4px 8px 0">🆕 CURSO NUEVO · 4 infantiles · v-GUARD2</div>
    <div class="sy" id="sb-year">Curso 2026–2027</div>
    <div class="sm">⬡ Motor CSP</div>
  </div>
  <nav>
    <div class="nsec">Horario</div>
    <button class="ni" data-tab="generator"><span class="ic">⚡</span>Generador</button>
    <button class="ni" data-tab="anchors"><span class="ic">📌</span>Anclajes</button>
    <button class="ni" data-tab="salud"><span class="ic">🩺</span>Salud claustro</button>
    <button class="ni" data-tab="quality"><span class="ic">📊</span>Calidad y versiones</button>
    <button class="ni" data-tab="guards"><span class="ic">🛡️</span>Guardias</button>
    <button class="ni" data-tab="subs"><span class="ic">🚑</span>Sustituciones</button>
    <button class="ni" data-tab="schedule"><span class="ic">📅</span>Ver horarios</button>
    <button class="ni" data-tab="export"><span class="ic">📤</span>Exportar</button>
    <div class="nsec">Centro</div>
    <button class="ni" data-tab="config"><span class="ic">⚙️</span>Configuración</button>
    <div class="nsec">Mis datos</div>
    <button class="ni" data-tab="teachers"><span class="ic">👤</span>Profesorado</button>
    <button class="ni" data-tab="groups"><span class="ic">🏫</span>Grupos</button>
    <button class="ni" data-tab="subjects"><span class="ic">📖</span>Materias</button>
    <button class="ni" data-tab="curriculum"><span class="ic">📚</span>Curriculum</button>
    <button class="ni" data-tab="asistente" style="border-left:3px solid var(--orange)"><span class="ic">🧩</span>Asignación prof.</button>
    <button class="ni" data-tab="constraints"><span class="ic">🔒</span>Restricciones</button>
  </nav>
  <div class="sfooter">
    <div id="sb-status" style="color:var(--orange)">Sin datos · Empieza en Configuración</div>
    <div style="margin-top:3px">v2.0 · Datos locales · Sin servidor</div>
  </div>
</aside>

<div id="main">
  <div id="topbar">

// Sanea el curriculum cargado de Firebase/localStorage:
// - Elimina materias que no están en la plantilla oficial del curso
// - Corrige sesiones que no coinciden con la tabla oficial
// - Elimina duplicados

// ────────────────────────────────────────────────────────────────────
// ── §3  DATOS MAESTROS
// ────────────────────────────────────────────────────────────────────
function sanitizeCurriculum(){
  S.groups.forEach(g=>{
    if(g.level==="infantil"||!S.curriculum[g.id]) return;
    const tpl=S._curriculumTemplates?.[g.grade+"º"]||[];
    const tplMap=Object.fromEntries(tpl.map(e=>[e.sid,e.sessions]));
    const seen=new Set();
    S.curriculum[g.id]=S.curriculum[g.id]
      .filter(e=>{
        // Eliminar si no está en la plantilla oficial o tiene 0 sesiones allí
        if(!tplMap[e.sid]||tplMap[e.sid]===0) return false;
        // Eliminar duplicados
        if(seen.has(e.sid)) return false;
        seen.add(e.sid);
        return true;
      })
      .map(e=>({
        ...e,
        // Forzar sesiones a las de la plantilla oficial
        sessions: tplMap[e.sid]
      }));
  });
}

// Migra slots de formato antiguo (sin label/type) al nuevo
function fixSlots(){
  if(!S.slots||S.slots.length===0){ S.slots=[...DEFAULT_SLOTS.map(s=>({...s}))]; return; }
  S.slots=S.slots.map((sl,i)=>{
    const def=DEFAULT_SLOTS[i]||{};
    return {
      n:    sl.n    ?? i+1,
      time: sl.time ?? def.time ?? "",
      label:sl.label && sl.label!=="undefined" ? sl.label : (def.label ?? "Franja "+(i+1)),
      type: sl.type ?? (sl.recess ? "recess" : "class"),
      recess: sl.recess ?? (sl.type!=="class"),
    };
  });
}

// ── Ordenar profesores: tutores por curso (Infantil→Primaria 1º→6º), luego especialistas ──
function sortedTeachers(){
  // Orden basado en el grupo que tutoriza cada profesor, siguiendo el MISMO
  // orden que el listado de grupos (infantil I-3A, I-3B, I-4A, I-5A, luego
  // primaria 1ºA, 1ºB, 2ºA...). Los especialistas (sin grupo) van al final.
  const orden = (typeof gruposOrdenados==="function" ? gruposOrdenados() : S.groups);
  const posTutor = tid => {
    const idx = orden.findIndex(g=>g.tutorId===tid);
    return idx<0 ? 999 : idx;   // sin grupo tutor → al final
  };
  return [...S.teachers].sort((a,b)=>{
    const pa=posTutor(a.id), pb=posTutor(b.id);
    if(pa!==pb) return pa-pb;
    // ambos especialistas (o empate) → alfabético
    return a.name.localeCompare(b.name,"es");
  });
}

// Total de horas lectivas asignadas a un profesor (suma de sesiones de sus materias)
// ── Desdoble PC infantil: donde Elba da REL en infantil, marcar en esa
// celda a quien imparte el Proyecto Competencial en paralelo (Isa en I-3A,
// la tutora en el resto). Función común usada por el motor y por el botón
// "Reintentar Infantil" para que nunca diverjan.
// Garantiza que las materias internas (Guardia, Atención Preferente) existen
// en S.subjects aunque los datos cargados (nube/local) sean de una versión vieja.
function ensureBuiltinSubjects(){
  if(!S.subjects) return;
  // refrescar colores de GUAR por si vienen de datos antiguos (gris → rojo/amarillo)
  const _g=S.subjects.find(s=>s.code==="GUAR");
  if(_g){ _g.bg="#dc2626"; _g.tx="#fde047"; _g.bd="#991b1b"; }
  if(!S.subjects.some(s=>s.code==="GUAR"))
    S.subjects.push({id:"s_guard",code:"GUAR",name:"Guardia",bg:"#dc2626",tx:"#fde047",bd:"#991b1b",instr:false});
  if(!S.subjects.some(s=>s.code==="APREF"))
    S.subjects.push({id:"s_apref",code:"APREF",name:"Atención Preferente",bg:"#fde8ef",tx:"#9d2449",bd:"#e76a9b",instr:false});
}

function marcarDesdoblePCInfantil(){
  const elbaIdInf=S.teachers.find(t=>t.name==="Elba")?.id;
  if(!elbaIdInf) return;
  const isaId=S.teachers.find(t=>t.name==="Isa")?.id;
  const diasN=[1,2,3,4,5];
  const lect=S.slots.filter(s=>s.type==="class").map(s=>s.n);
  S.groups.filter(g=>g.level==="infantil").forEach(g=>{
    const pcId=(g.name==="I-3A"&&isaId)?isaId:g.tutorId;
    if(!pcId) return;
    diasN.forEach(d=>lect.forEach(s=>{
      const cell=S.schedule[g.name]?.[d]?.[s]||S.schedule[g.name]?.[String(d)]?.[String(s)];
      if(cell&&cell.s==="REL"&&cell.t===elbaIdInf&&!cell.t2){
        cell.t2=pcId;
        cell.parallel=true;
      }
    }));
  });
}

function cargaHoraria(tid){
  // PT Preferente: carga = franjas de atención (25 − libranzas − liberadas)
  const _t=gt(tid);
  if(_t?.ptPref){
    const lect=S.slots.filter(s=>s.type==="class").map(s=>s.n);
    const total=5*lect.length;
    const lib=(_t.unavail||[]).filter(u=>lect.includes(+u.s)).length;
    const free=(_t.ptFreeSlots||[]).filter(f=>lect.includes(+f.s)).length;
    return Math.max(0,total-lib-free);
  }
  let h=0;
  S.groups.forEach(g=>{
    (S.curriculum[g.id]||[]).forEach(e=>{ if(e.tid===tid) h+=e.sessions; });
  });
  // Caso Elba: las REL de primaria figuran a nombre del PC en el currículum,
  // pero las imparte Elba en paralelo. Sumarlas a su carga real.
  const _elba=S.teachers.find(t=>t.name==="Elba");
  if(_elba&&tid===_elba.id){
    S.groups.filter(g=>g.level==="primaria").forEach(g=>{
      const cur=S.curriculum[g.id]||[];
      const relId=S.subjects.find(s=>s.code==="REL")?.id;
      // si el grupo YA tiene una entrada REL a nombre de Elba, no duplicar
      const yaTieneElba=cur.some(e=>e.sid===relId&&e.tid===tid);
      if(yaTieneElba) return;
      cur.forEach(e=>{
        if(e.sid===relId&&e.tid!==tid) h+=e.sessions;
      });
    });
  }
  return h;
}

function selTeacher(id){
  selT=id; const t=gt(id); if(!t)return;
  const d=$("tdet"); if(!d)return;

  // Calcular horas lectivas del profesor desde el curriculum
  const lectivas = [];
  let totalLect = 0;
  S.groups.forEach(g=>{
    (S.curriculum[g.id]||[]).forEach(e=>{
      if(e.tid===t.id){
        const subj=S.subjects.find(s=>s.id===e.sid);
        if(subj && e.sessions>0){
          // Agrupar por materia (puede dar misma materia en varios grupos)
          const ex=lectivas.find(l=>l.sid===e.sid);
          if(ex){ ex.sessions+=e.sessions; ex.groups.push(g.name); }
          else lectivas.push({sid:e.sid,subj,sessions:e.sessions,groups:[g.name]});
          totalLect+=e.sessions;
        }
      }
    });
  });
  // Ordenar por sesiones DESC
  lectivas.sort((a,b)=>b.sessions-a.sessions);

  d.innerHTML=`
  <!-- Cabecera -->
  <div style="display:flex;gap:9px;align-items:center;margin-bottom:13px;padding-bottom:11px;border-bottom:1px solid var(--bd)">
    <div class="av2" style="background:${t.color};width:40px;height:40px;font-size:13px">${ini(t.name)}</div>
    <div>
      <div style="font-weight:800;color:var(--tx);font-size:14px">${t.name}</div>
      <div style="font-size:12px;color:var(--tx3)">${t.spec||"Sin especialidad"}</div>
    </div>
  </div>

  <!-- Stats rápidos -->
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:14px">
    ${[["Horas/sem",t.hours+"h"],["Jornada",t.pct+"%"],["Coord.",(t.coordH||0)+"h"],["Guardias",(t.guardH||0)+"h"],["Apoyo",(t.supportH||0)+"h"],["Reducción",(t.redH||0)+"h"]].map(([l,v])=>`
    <div style="background:var(--surf2);border-radius:var(--rs);padding:7px 9px">
      <div style="font-size:9px;color:var(--tx3);font-weight:700;text-transform:uppercase;letter-spacing:.05em">${l}</div>
      <div style="font-size:14px;font-weight:800;color:var(--tx)">${v}</div>
    </div>`).join("")}
  </div>

// Construye la rejilla semanal del profesor a partir del HORARIO GUARDADO.
// Si no hay horario guardado, muestra un aviso.
function renderHorarioGuardadoProfesor(tid){
  const lect=(S.slots||[]).filter(s=>s.type==="class");
  const dias=["Lun","Mar","Mié","Jue","Vie"];
  if(!S.savedSchedule||Object.keys(S.savedSchedule).length===0){
    return `<div style="margin-top:14px;padding-top:11px;border-top:1px solid var(--bd)">
      <div style="font-size:11px;font-weight:700;color:var(--tx2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px">Horario semanal</div>
      <div style="font-size:11px;color:var(--tx3);padding:10px;background:var(--surf2);border-radius:var(--rs)">
        No hay ningún horario guardado todavía. Genera un horario, revísalo y pulsa <strong>💾 Guardar horario</strong> en la sección Horarios.
      </div></div>`;
  }
  // Buscar qué imparte el profesor en cada día/franja dentro del horario guardado
  const cellAt=(d,s)=>{
    for(const gn of Object.keys(S.savedSchedule)){
      const c=S.savedSchedule[gn]?.[d]?.[s]||S.savedSchedule[gn]?.[String(d)]?.[String(s)];
      if(!c||c._hold) continue;
      if(c.t===tid) return {grupo:gn,sid:c.s,t2:c.t2};
      if(c.t2===tid) return {grupo:gn,sid:c.s,segundo:true};
    }
    return null;
  };
  // Funciones guardadas (biblioteca, coordinación, etc.)
  const fns=S.savedTeacherFunctions?.[tid]||{};
  const subjByCode=code=>S.subjects.find(s=>s.code===code);

  let filas="";
  for(const sl of lect){
    let celdas="";
    for(let di=0;di<5;di++){
      const d=di+1;
      const ses=cellAt(d,sl.n);
      const fn=fns[`${d}-${sl.n}`];
      const unavail=(t=>t&&t.unavail&&t.unavail.some(u=>u.d===d&&u.s===sl.n))(gt(tid));
      let bg="var(--surf2)",tx="var(--tx3)",cont="";
      if(ses){
        const sub=subjByCode(ses.sid);
        bg=sub?.bg||"#e5e7eb"; tx=sub?.tx||"#111";
        cont=`<div style="font-weight:800;font-size:9px;line-height:1.1">${ses.sid}</div><div style="font-size:8px;opacity:.75">${ses.grupo}</div>`;
      } else if(fn){
        bg="#fde047"; tx="#713f12";
        cont=`<div style="font-size:8px;font-weight:700;line-height:1.05">${fn}</div>`;
      } else if(unavail){
        bg="#fee2e2"; tx="#b91c1c";
        cont=`<div style="font-size:8px">Libra</div>`;
      }
      celdas+=`<td style="background:${bg};color:${tx};border:1px solid var(--bd);padding:3px 2px;text-align:center;vertical-align:middle;min-width:42px;height:30px">${cont}</td>`;
    }
    filas+=`<tr><td style="font-size:8px;font-weight:700;color:var(--tx3);padding:2px 4px;text-align:right;white-space:nowrap">${sl.n}ª</td>${celdas}</tr>`;
  }

  return `<div style="margin-top:14px;padding-top:11px;border-top:1px solid var(--bd)">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
      <div style="font-size:11px;font-weight:700;color:var(--tx2);text-transform:uppercase;letter-spacing:.05em">Horario semanal (guardado)</div>
      <span style="font-size:9px;color:var(--tx3)">${S.savedScheduleDate||""}</span>
    </div>
    <div style="overflow-x:auto"><table style="border-collapse:collapse;width:100%;font-size:9px">
      <thead><tr><th></th>${dias.map(d=>`<th style="font-size:9px;color:var(--tx3);padding:2px;text-transform:uppercase">${d}</th>`).join("")}</tr></thead>
      <tbody>${filas}</tbody>
    </table></div>
  </div>`;
}

function importCSV(e){
  const file=e.target.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=ev=>{
    const lines=ev.target.result.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
    if(lines.length<2){toast("CSV vacío o sin cabecera","err");return;}

    const norm=s=>s.toLowerCase().trim()
      .replace(/[áàä]/g,"a").replace(/[éèë]/g,"e").replace(/[íìï]/g,"i")
      .replace(/[óòö]/g,"o").replace(/[úùü]/g,"u").replace(/[ñ]/g,"n")
      .replace(/[^a-z0-9\/]/g,"");

    const hds =lines[0].split(",").map(h=>h.replace(/^"|"$/g,"").trim());
    const hdsN=hds.map(norm);

    const iNombre=hdsN.findIndex(h=>h==="nombre"||h==="profesor"||h==="docente");
    const iCurso =hdsN.findIndex(h=>h.includes("curso")||h.includes("especialidad")||h.includes("tutor"));
    const iTotal =hdsN.findIndex(h=>h==="total");
    const iLibres=hdsN.findIndex(h=>h==="libres"||h.includes("libres"));
    const iGardas=hdsN.findIndex(h=>h==="gardas"||h.includes("guardia"));
    const iTP    =hdsN.findIndex(h=>h==="tp");
    const iObs   =hdsN.findIndex(h=>h.includes("observ")||h.includes("nota"));

    // Detectar columnas de materias automáticamente
    const FIXED_KEYS=["nombre","profesor","docente","curso","especialidad","tutor","total","libres","gardas","guardia","tp","observ","nota","ocio","acio"];
    const materiasCols=hdsN.map((h,i)=>{
      if(FIXED_KEYS.some(f=>h.includes(f))) return null;
      const subj=matchMateria(hds[i]);
      return subj?{idx:i,subj}:null;
    }).filter(Boolean);

    let added=0,updated=0;
    for(let i=1;i<lines.length;i++){
      const cols=lines[i].split(",").map(c=>c.replace(/^"|"$/g,"").trim());
      const get=idx=>(idx>=0&&idx<cols.length)?cols[idx]:"";

      const nombre=get(iNombre);
      if(!nombre)continue;

      // Sumar horas lectivas por materias
      let horasLect=0;
      materiasCols.forEach(m=>{ horasLect+=parseInt(get(m.idx))||0; });

      const gardasV=parseInt(get(iGardas))||0;
      const tpV    =parseInt(get(iTP))    ||0;
      const totalV =parseInt(get(iTotal)) ||(horasLect+gardasV+tpV);
      const libresV=parseInt(get(iLibres))||0;
      const cursoV =get(iCurso);
      const obsV   =get(iObs);
      const pct    =libresV>=10?50:100;

      const tData={
        name:nombre, spec:cursoV||"",
        hours:totalV||23, pct,
        guardH:gardasV, supportH:tpV, libH:libresV,
        coordH:0, releaseH:0, redH:0,
        dir:false, jef:false, itinerant:false,
        unavail:[], groupIds:[], notes:obsV,
      };

      const existing=S.teachers.find(t=>
        norm(t.name)===norm(nombre)||
        norm(t.name).startsWith(norm(nombre.split(" ")[0]))
      );
      if(existing){ Object.assign(existing,tData); updated++; }
      else{ tData.id=uid(); tData.color=CLRS[S.teachers.length%CLRS.length]; S.teachers.push(tData); added++; }
    }
    save();
    toast(`${added} profesores añadidos · ${updated} actualizados`);
    navigate("teachers");
  };
  r.readAsText(file,"UTF-8");
  e.target.value="";
}

// Orden del listado de grupos: infantil primero (I-3A, I-3B, I-4A, I-5A),
// luego primaria (1ºA, 1ºB, 2ºA...). Ordena por nombre dentro de cada nivel.
// Color del botón de profesor según su rol:
//  - tutor de infantil → rosa · tutor de primaria → azul · especialista → naranja
function colorProfesor(tid){
  const g=S.groups.find(g=>g.tutorId===tid);
  if(!g) return "#e07a54";
  if(g.level==="infantil") return "#db2777";
  return "#2563eb";
}

function gruposOrdenados(){
  return [...S.groups].sort((a,b)=>{
    const ai=a.level==="infantil"?0:1, bi=b.level==="infantil"?0:1;
    if(ai!==bi) return ai-bi;                  // infantil antes que primaria
    return a.name.localeCompare(b.name,'es',{numeric:true}); // I-3A,I-3B,I-4A,I-5A / 1ºA,1ºB...
  });
}

function addDef(t){
  const defs={
    inf:[{n:"I-3A",lv:"infantil",gr:3,se:"A"},{n:"I-4A",lv:"infantil",gr:4,se:"A"},{n:"I-5A",lv:"infantil",gr:5,se:"A"}],
    p1:[1,2,3,4,5,6].map(g=>({n:g+"ºA",lv:"primaria",gr:g,se:"A"})),
    p2:[1,2,3,4,5,6].flatMap(g=>[{n:g+"ºA",lv:"primaria",gr:g,se:"A"},{n:g+"ºB",lv:"primaria",gr:g,se:"B"}]),
  };
  let n=0;
  (defs[t]||[]).forEach(d=>{
    if(!S.groups.find(g=>g.name===d.n)){
      const newId=uid();
      S.groups.push({id:newId,name:d.n,level:d.lv,grade:d.gr,section:d.se,tutorId:null,students:25,bilingual:false});
      applyCurriculumTemplate(newId, d.gr, d.lv);
      n++;
    }
  });
  toast(`${n} grupos añadidos con curriculum predefinido`);
  navigate("groups");
}

function saveG(id){
  const name=$("gn").value.trim();if(!name){toast("Nombre obligatorio","err");return;}
  const d={name,level:$("glv").value,grade:+$("ggr").value||1,section:$("gse").value||"A",tutorId:$("gtu").value||null,students:+$("gst").value||25,bilingual:$("gbil").checked};
  if(id){
    Object.assign(gg(id),d);
    toast("Grupo actualizado");
  } else {
    const newId=uid();
    S.groups.push({id:newId,...d});
    // Aplicar plantilla de curriculum según el curso
    applyCurriculumTemplate(newId, d.grade, d.level);
    toast("Grupo añadido con curriculum predefinido");
  }
  cm();navigate("groups");
}

// Aplica la plantilla de curriculum oficial al grupo recién creado
function applyCurriculumTemplate(gid, grade, level){
  if(level==="infantil") return;
  const key=grade+"º";
  const tpl=S._curriculumTemplates?.[key];
  if(!tpl) return;
  // Solo materias con sesiones > 0, exactamente las horas de la tabla oficial
  S.curriculum[gid]=tpl
    .filter(e=>e.sessions>0)
    .map(e=>({sid:e.sid, tid:"", sessions:e.sessions}));
  // Verificación: el total debe ser exactamente 25
  const total=S.curriculum[gid].reduce((a,e)=>a+e.sessions,0);
  if(total!==25) console.warn(`Curriculum ${key} suma ${total} sesiones (debería ser 25)`);
}
function delG(id){if(!confirm("¿Eliminar este grupo?"))return;S.groups=S.groups.filter(g=>g.id!==id);delete S.curriculum[id];navigate("groups");toast("Grupo eliminado","warn");}

// Restaura el curriculum oficial para un grupo
function restoreTemplate(gid, grade){
  if(!confirm(`¿Restaurar las horas oficiales para ${grade}º?\nSe mantendrán los profesores ya asignados pero se actualizarán las sesiones.`)) return;
  applyCurriculumTemplate(gid, grade, "primaria");
  // Conservar profesores ya asignados
  const old=S.curriculum[gid]||[];
  const tpl=S._curriculumTemplates?.[grade+"º"]||[];
  S.curriculum[gid]=tpl.filter(e=>e.sessions>0).map(e=>{
    const prev=old.find(o=>o.sid===e.sid);
    return {sid:e.sid, tid:prev?.tid||"", sessions:e.sessions};
  });
  drawCur(); save();
  toast(`Horas oficiales de ${grade}º restauradas`);
}

  const s=S.subjects.find(s2=>s2.id===e.sid);
  om(`<div class="mb"><div class="mt">Asignar profesor — ${s?.name||"Materia"} <button class="btn bgh" onclick="cm()">✕</button></div>

  </div></div>`);
}
function chS(g,i,d){const e=S.curriculum[g]?.[i];if(e)e.sessions=Math.max(1,Math.min(10,e.sessions+d));drawCur();save();updateGroupRowCount(g);}
function delC(g,i){S.curriculum[g]?.splice(i,1);drawCur();save();updateGroupRowCount(g);toast("Materia eliminada");}
// Actualiza el contador de sesiones de la fila del grupo en el listado lateral (si está visible)
function updateGroupRowCount(gid){

  if(cnt) cnt.textContent=tot;
}

// Tabla de alias para reconocer materias desde el CSV con nombres variados
const MATERIA_ALIAS={

function matchMateria(raw){
  if(!raw||!raw.trim()) return null;
  const norm=s=>s.toLowerCase().trim()
    .replace(/[áàä]/g,"a").replace(/[éèë]/g,"e").replace(/[íìï]/g,"i")
    .replace(/[óòö]/g,"o").replace(/[úùü]/g,"u").replace(/ñ/g,"n")
    .replace(/\s+/g," ");
  const key=norm(raw);

  // 1. Búsqueda EXACTA en alias (máxima prioridad)
  if(MATERIA_ALIAS[key]) return S.subjects.find(s=>s.code===MATERIA_ALIAS[key]);

  // 2. Búsqueda donde el alias es exactamente igual al key normalizado
  for(const [alias,code] of Object.entries(MATERIA_ALIAS)){
    if(alias===key) return S.subjects.find(s=>s.code===code);
  }

  // 3. El key EMPIEZA por un alias (ej: "lengua castellana" empieza por "lengua castelá")
  //    Solo si el alias tiene >5 chars para evitar falsos positivos
  for(const [alias,code] of Object.entries(MATERIA_ALIAS)){
    if(alias.length>5&&key.startsWith(alias))
      return S.subjects.find(s=>s.code===code);
  }

  // 4. Un alias de >6 chars está CONTENIDO en el key
  for(const [alias,code] of Object.entries(MATERIA_ALIAS)){
    if(alias.length>6&&key.includes(alias))
      return S.subjects.find(s=>s.code===code);
  }

  // 5. Por nombre directo en subjects
  return S.subjects.find(s=>norm(s.name)===key||norm(s.code)===key)||null;
}

function matchProfesor(raw){
  if(!raw||!raw.trim()) return null;
  const norm=s=>s.toLowerCase().trim()
    .replace(/[áàä]/g,"a").replace(/[éèë]/g,"e").replace(/[íìï]/g,"i")
    .replace(/[óòö]/g,"o").replace(/[úùü]/g,"u").replace(/ñ/g,"n");
  const key=norm(raw);
  // 1. Exacto
  let t=S.teachers.find(t=>norm(t.name)===key); if(t)return t;
  // 2. Palabra exacta en el nombre
  t=S.teachers.find(t=>norm(t.name).split(" ").some(p=>p===key)); if(t)return t;
  // 3. Sin espacios (ej: "BeaAL"→"Bea AL", "AnaJato"→"Ana Jato", "MariaP"→"Maria P")
  t=S.teachers.find(t=>norm(t.name).replace(/\s/g,"").includes(key.replace(/\s/g,""))||
    key.replace(/\s/g,"").includes(norm(t.name).replace(/\s/g,""))); if(t)return t;
  // 4. Todas las partes del key aparecen en el nombre
  const parts=key.split(/\s+/).filter(p=>p.length>1);
  if(parts.length>0){ t=S.teachers.find(t=>parts.every(p=>norm(t.name).includes(p))); if(t)return t; }
  // 5. Inicio del primer nombre
  t=S.teachers.find(t=>{ const f=norm(t.name).split(" ")[0]; return key.startsWith(f)||f.startsWith(key); });
  return t||null;
}

function matchGrupo(raw){
  if(!raw||!raw.trim())return null;
  const key=raw.trim().toLowerCase().replace(/\s/g,"");
  return S.groups.find(g=>g.name.toLowerCase().replace(/\s/g,"")===key||
    g.name.toLowerCase().replace("º","").replace("ª","").replace(/\s/g,"")===key.replace("º","").replace("ª","")
  );
}

function importCurriculumCSV(e){
  const file=e.target.files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    const lines=ev.target.result.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
    if(lines.length<2){toast("CSV vacío","err");return;}

    const headers=lines[0].split(",").map(h=>h.trim().toLowerCase()
      .replace(/[áàä]/g,"a").replace(/[éèë]/g,"e").replace(/[íìï]/g,"i")
      .replace(/[óòö]/g,"o").replace(/[úùü]/g,"u"));

    const iGrupo   =headers.findIndex(h=>h.includes("grupo")||h.includes("clase")||h.includes("group"));
    const iMateria =headers.findIndex(h=>h.includes("materia")||h.includes("area")||h.includes("asignatura")||h.includes("subject"));
    const iProfesor=headers.findIndex(h=>h.includes("profesor")||h.includes("prof")||h.includes("docente")||h.includes("teacher")||h.includes("nombre"));
    const iSesiones=headers.findIndex(h=>h.includes("sesion")||h.includes("hora")||h.includes("session")||h.includes("horas"));

    if(iGrupo<0||iMateria<0||iProfesor<0){
      toast("No encuentro las columnas. El CSV debe tener: grupo, materia, profesor (y opcionalmente sesiones)","err");
      return;
    }

    let ok=0, warn=[], sinProf=[], sinMateria=[], sinGrupo=[];

    for(let i=1;i<lines.length;i++){
      const cols=lines[i].split(",").map(c=>c.trim().replace(/^"|"$/g,""));
      const rawGrupo   =cols[iGrupo]||"";
      const rawMateria =cols[iMateria]||"";
      const rawProfesor=cols[iProfesor]||"";
      const rawSesiones=iSesiones>=0?cols[iSesiones]:"";

      if(!rawGrupo&&!rawMateria)continue;

      const grupo  =matchGrupo(rawGrupo);
      const materia=matchMateria(rawMateria);
      const prof   =matchProfesor(rawProfesor);
      const sesiones=parseInt(rawSesiones)||null;

      if(!grupo)  { sinGrupo.push(rawGrupo);   continue; }
      if(!materia){ sinMateria.push(rawMateria); continue; }
      if(!prof)   { sinProf.push(`${rawGrupo} · ${rawMateria}: "${rawProfesor}"`); }

      // Solo actualizar si la materia ya existe en el curriculum del grupo
      // (aplicado desde la plantilla oficial). NUNCA crear entradas nuevas
      // que contradigan la tabla oficial de horas.
      if(!S.curriculum[grupo.id]) S.curriculum[grupo.id]=[];
      const ex=S.curriculum[grupo.id].findIndex(e=>e.sid===materia.id);
      if(ex>=0){
        // Materia ya existe en el curriculum → solo actualizar el profesor
        // Las sesiones NO se tocan: siempre mandan las de la plantilla oficial
        S.curriculum[grupo.id][ex].tid=prof?.id||"";
      } else {
        // Materia NO está en el curriculum → verificar si existe en la plantilla oficial
        const grade=grupo.grade;
        const tpl=(S._curriculumTemplates?.[grade+"º"]||[]).find(t=>t.sid===materia.id);
        if(tpl && tpl.sessions>0){
          // Existe en la plantilla oficial con sesiones > 0 → añadir con las horas correctas
          S.curriculum[grupo.id].push({sid:materia.id, tid:prof?.id||"", sessions:tpl.sessions});
        } else {
          // No está en la plantilla oficial para este curso → ignorar
          // (evita que Oscar aparezca dando Sociales en grupos donde no le corresponde)
          sinMateria.push(`${rawGrupo}·${rawMateria} (no está en curriculum de ${grade}º)`);
          continue;
        }
      }
      ok++;
    }

    save();

    // Mostrar resultado detallado
    let msg=`✅ ${ok} asignaciones importadas.`;
    const details=[];
    if(sinProf.length)   details.push(`⚠ ${sinProf.length} profesores no encontrados (se importaron sin asignar): ${sinProf.slice(0,3).join(", ")}${sinProf.length>3?"…":""}`);
    if(sinMateria.length)details.push(`⚠ ${sinMateria.length} materias no reconocidas: ${[...new Set(sinMateria)].slice(0,4).join(", ")}`);
    if(sinGrupo.length)  details.push(`⚠ ${sinGrupo.length} grupos no encontrados: ${[...new Set(sinGrupo)].slice(0,4).join(", ")}`);

    if(details.length){
      om(`<div class="mb">
        <div class="mt">Resultado de la importación <button class="btn bgh" onclick="cm()">✕</button></div>
        <div style="font-size:13px;color:var(--sage);font-weight:700;margin-bottom:12px">✅ ${ok} asignaciones importadas correctamente</div>
        ${details.map(d=>`<div style="font-size:12px;color:var(--orange);margin-bottom:8px;line-height:1.6;padding:8px 10px;background:var(--amd);border-radius:var(--rs)">${d}</div>`).join("")}
        <div style="font-size:11px;color:var(--tx3);margin-top:10px">Los no encontrados los puedes asignar manualmente en los pasos de abajo.</div>
        <div style="display:flex;justify-content:flex-end;margin-top:14px">
          <button class="btn bp2" onclick="cm();navigate('asistente')">Ver asistente</button>
        </div>
      </div>`);
    } else {
      toast(`✅ ${ok} asignaciones importadas sin errores`);
      navigate("asistente");
    }
  };
  reader.readAsText(file,"UTF-8");
  e.target.value="";
}

function dlCurriculumTemplate(){
  // Genera un CSV de ejemplo con los grupos y materias actuales
  let rows=["grupo,materia,profesor,sesiones"];
  S.groups.filter(g=>g.level==="primaria").forEach(g=>{
    const tpl=S._curriculumTemplates?.[g.grade+"º"]||[];
    tpl.filter(e=>e.sessions>0).forEach(e=>{
      const s=S.subjects.find(s=>s.id===e.sid);
      const t=gt((S.curriculum[g.id]||[]).find(c=>c.sid===e.sid)?.tid);
      rows.push(`${g.name},${s?.name||e.sid},${t?.name||""},${e.sessions}`);
    });
  });
  const a=document.createElement("a");
  a.href="data:text/csv;charset=utf-8,\uFEFF"+encodeURIComponent(rows.join("\n"));
  a.download="curriculum_profesores.csv";
  a.click();
  toast("Plantilla CSV descargada");
}

const TUTOR_DEFAULT_CODES = ["MAT","LCL","LGL","CN","CS"];

// Al seleccionar tutor muestra modal de confirmación en vez de asignar todo directo
function assignTutor(gid, tid){
  const g = gg(gid); if(!g) return;
  // Actualizar tutorId del grupo
  g.tutorId = tid||null;

  if(!tid){
    save(); navigate("asistente");
    toast(`Tutor/a eliminado de ${g.name}`);
    return;
  }

  const tch = gt(tid);
  const cur = S.curriculum[gid]||[];

  // Ver qué materias típicas del tutor están en el curriculum de este grupo
  const tutorSubjects = cur.filter(e=>{
    const s = S.subjects.find(s=>s.id===e.sid);
    return s && TUTOR_DEFAULT_CODES.includes(s.code);
  });

  // Ver qué otras materias ya tienen profesor asignado (no tocar)
  const otherAssigned = cur.filter(e=>{
    const s = S.subjects.find(s=>s.id===e.sid);

  // Construir checkboxes para las materias típicas

    const s = S.subjects.find(s=>s.id===e.sid);

    return `<label class="cbr" style="padding:8px 10px;background:var(--surf2);border-radius:var(--rs);border:1px solid ${alreadyAssigned?"var(--am-dim, #fff3cd)":"var(--bd)"}">

        <div style="font-size:13px;font-weight:700;color:var(--tx)">${s?.name}</div>

        :`<div style="font-size:10px;color:var(--tx3)">${e.sessions} ses/sem</div>`}
      </div>
    </label>`;
  }).join("");

  om(`<div class="mb w">
  <div class="mt">Asignar tutor/a — ${g.name} <button class="btn bgh" onclick="cm()">✕</button></div>

function confirmTutorAssign(gid, tid){
  const checked = new Set([...document.querySelectorAll(".tutor-mat-check:checked")].map(cb=>cb.value));
  const cur = S.curriculum[gid]||[];

  // Solo asignar tutor a las materias marcadas
  // Las no marcadas se dejan como están (no se tocan)
  cur.forEach(e=>{
    const s = S.subjects.find(s=>s.id===e.sid);
    if(s && TUTOR_DEFAULT_CODES.includes(s.code)){
      if(checked.has(e.sid)){
        e.tid = tid; // asignar tutor
      }
      // si no está marcada → no tocar (mantiene su valor actual)
    }
  });

  save(); cm(); navigate("asistente");
  const n = checked.size;
  toast(`${gt(tid)?.name?.split(" ")[0]} asignado/a a ${n} materia${n===1?"":"s"} en ${gg(gid)?.name}`);
}

// Asigna un especialista a una materia en UN grupo concreto
function assignSpecialist(gid, sid, tid){
  const cur=S.curriculum[gid]; if(!cur)return;
  const e=cur.find(e=>e.sid===sid);
  if(e){ e.tid=tid; save(); navigate("asistente"); }
}

// Asigna un especialista a una materia en TODOS los grupos a la vez
function assignSpecialistAll(sid, tid){
  if(!tid)return;
  let n=0;
  S.groups.forEach(g=>{
    const cur=S.curriculum[g.id]; if(!cur)return;
    const e=cur.find(e=>e.sid===sid);
    if(e){ e.tid=tid; n++; }
  });
  save(); navigate("asistente");
  const s=S.subjects.find(s=>s.id===sid);
  const t=gt(tid);
  toast(`${t?.name.split(" ")[0]} asignado/a a ${s?.name} en ${n} grupos`);
}

// SISTEMA DE GUARDIAS SEMANALES
// Una guardia ocupa una franja LIBRE del profesor: nunca pisa una clase
// real (t o t2), una libranza/reducción/bloqueo (unavail) ni otra guardia.
// ════════════════════════════════════════════════════════════════

// ¿Está el profesor realmente libre en (day,slot)?

// ────────────────────────────────────────────────────────────────────
// ── §9  GUARDIAS SEMANALES
// ────────────────────────────────────────────────────────────────────
function teacherFreeAt(tid,day,slot){
  const t=gt(tid); if(!t) return false;
  // libranzas, reducciones y bloqueos registrados
  if((t.unavail||[]).some(u=>u.d===day&&u.s===slot)) return false;
  // PT Preferente: está con su alumno TODA la jornada; solo cuenta como libre
  // en sus horas liberadas explícitas (ptFreeSlots)
  if(t.ptPref){
    return (t.ptFreeSlots||[]).some(f=>+f.d===+day&&+f.s===+slot);
  }
  // clase real en cualquier grupo (titular o desdoble)
  for(const g of S.groups){
    const c=S.schedule[g.name]?.[day]?.[slot]||S.schedule[g.name]?.[String(day)]?.[String(slot)];
    if(c&&(c.t===tid||c.t2===tid)) return false;
  }
  return true;
}

// Prioridad para repartir guardias cuando hay que elegir entre candidatos:
//   1) menos guardias ya asignadas (equidad básica)
//   2) equipo directivo primero (dir o jef)
//   3) menor carga horaria lectiva
//   4) azar como último desempate
// Devuelve un comparador para Array.sort sobre objetos teacher.
function guardPriorityCmp(count){
  const esDirectivo=t=>(t.dir||t.jef)?0:1;
  const carga=t=>cargaHoraria(t.id);
  return (a,b)=>
      (count[a.id]-count[b.id])             // menos guardias primero
   || (esDirectivo(a)-esDirectivo(b))       // equipo directivo primero
   || (carga(a)-carga(b))                   // menor carga horaria primero
   || (Math.random()-0.5);                  // azar
}

// Genera el cuadro de guardias. fresh=true → desde cero (tras generar horario).
// Doble garantía: (a) toda franja con ≥ minGuardsPerSlot profesores;
// (b) TODO profesor con algún hueco disponible recibe al menos 1 guardia.
function generateGuards(fresh){
  ensureBuiltinSubjects();
  if(!S.guards||fresh) S.guards=[];
  if(!S.guardConfig) S.guardConfig={minGuardsPerSlot:1};
  const minG=Math.max(1,+S.guardConfig.minGuardsPerSlot||1);
  const lect=S.slots.filter(s=>s.type==="class").map(s=>s.n);
  const dias=[1,2,3,4,5];

  // 1) Depurar guardias que ya no son válidas
  S.guards=S.guards.filter(g=>teacherFreeAt(g.teacherId,+g.day,+g.slot));

  // 2) Contador por profesor
  const count={};
  S.teachers.forEach(t=>{ count[t.id]=0; });
  S.guards.forEach(g=>{ count[g.teacherId]=(count[g.teacherId]||0)+1; });

  // 2b) PASO 0 — GUARDIA TOTAL: profesores marcados con fullGuard reciben
  //     guardia en TODAS sus franjas lectivas libres (sin clase ni libranza).
  //     Se hace antes del reparto normal para que queden fijadas.
  let added=0, uncovered=[];
  S.teachers.filter(t=>t.fullGuard).forEach(t=>{
    dias.forEach(day=>lect.forEach(slot=>{
      if(!teacherFreeAt(t.id,day,slot)) return;
      if(S.guards.some(g=>g.teacherId===t.id&&+g.day===day&&+g.slot===slot)) return;
      S.guards.push({teacherId:t.id,day,slot});
      count[t.id]++; added++;
    }));
  });

  // 3) PASO A — cubrir cada franja hasta el mínimo, priorizando a quien
  //    tiene menos guardias (los de 0 entran primero de forma natural)
  dias.forEach(day=>lect.forEach(slot=>{
    let falta=minG-S.guards.filter(g=>+g.day===day&&+g.slot===slot).length;
    while(falta>0){
      const ocupados=new Set(S.guards.filter(g=>+g.day===day&&+g.slot===slot).map(g=>g.teacherId));
      const cands=S.teachers.filter(t=>!ocupados.has(t.id)&&teacherFreeAt(t.id,day,slot));
      if(cands.length===0){ uncovered.push(`${day}-${slot}`); break; }
      cands.sort(guardPriorityCmp(count));
      const pick=cands[0];
      S.guards.push({teacherId:pick.id,day,slot});
      count[pick.id]++; added++; falta--;
    }
  }));

  // 4) PASO B — todo profesor con huecos debe tener al menos 1 guardia.
  //    A los que quedaron a 0, asignarles una en su hueco con menos guardias.
  //    Recorrer en orden de prioridad (directivos y menor carga antes).
  [...S.teachers].sort(guardPriorityCmp(count)).forEach(t=>{
    if(count[t.id]>0) return;
    let best=null, bestN=Infinity;
    dias.forEach(day=>lect.forEach(slot=>{
      if(!teacherFreeAt(t.id,day,slot)) return;
      if(S.guards.some(g=>g.teacherId===t.id&&+g.day===day&&+g.slot===slot)) return;
      const n=S.guards.filter(g=>+g.day===day&&+g.slot===slot).length;
      if(n<bestN){ bestN=n; best={day,slot}; }
    }));
    if(best){
      S.guards.push({teacherId:t.id,day:best.day,slot:best.slot});
      count[t.id]++; added++;
    }
    // sin huecos (p. ej. PT Preferente sin horas liberadas) → queda a 0
  });

  save();
  return {added,uncovered};
}

function clearGuards(){
  if(!confirm("¿Borrar TODAS las guardias asignadas?")) return;
  S.guards=[]; save(); navigate("guards");
}

}

// ════════════════════════════════════════════════════════════════
// SISTEMA DE AUSENCIAS Y SUSTITUCIONES
// Filosofía: no buscar simplemente profesores libres, sino el MEJOR
// sustituto para el alumnado — prioridad a quien conoce al grupo.
// Usa el cuadro de guardias existente como fuente principal.
// ════════════════════════════════════════════════════════════════


// ────────────────────────────────────────────────────────────────────
// ── §10 AUSENCIAS Y SUSTITUCIONES
// ────────────────────────────────────────────────────────────────────
function subEnsureState(){
  if(!S.absences) S.absences=[];
  if(!S.substitutions) S.substitutions=[];
  if(!S.guardHistory) S.guardHistory=[];
  if(!S.subConfig) S.subConfig={maxPerDay:2};
}
function subNewId(){ return "s"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
// Fecha (YYYY-MM-DD) → día lectivo 1..5 (Lun..Vie), o null si fin de semana
function dateToDay(dateStr){
  const wd=new Date(dateStr+"T12:00:00").getDay();
  return (wd>=1&&wd<=5)?wd:null;
}
function lectSlotsArr(){ return S.slots.filter(s=>s.type==="class").map(s=>s.n); }

// ¿Está el profesor ausente en esa fecha y franja?
function isAbsent(tid,date,slot){
  return (S.absences||[]).some(a=>a.teacherId===tid&&a.date===date&&
    ((a.slots||[]).length===0||(a.slots||[]).map(Number).includes(+slot)));
}
// Ciclo de primaria (1: 1º-2º, 2: 3º-4º, 3: 5º-6º); infantil = 0
function cicloDe(grade,level){ if(level==="infantil")return 0; return grade<=2?1:(grade<=4?2:3); }
// ¿El profesor trabaja (currículum) en algún grupo del nivel/ciclo dado?
function trabajaEnNivel(tid,grade,level){
  return S.groups.some(g=>g.level===level&&g.grade===grade&&(S.curriculum[g.id]||[]).some(e=>e.tid===tid));
}
function trabajaEnCiclo(tid,ciclo,level){
  return S.groups.some(g=>cicloDe(g.grade,g.level)===ciclo&&g.level===level&&(S.curriculum[g.id]||[]).some(e=>e.tid===tid));
}

// Sesiones afectadas por las ausencias de una fecha (solo donde el ausente
// es el profesor TITULAR de la celda; si va como t2 en un desdoble, el otro
// profesor permanece con el grupo y no se genera sustitución).
function sesionesAfectadas(date){
  subEnsureState();
  const day=dateToDay(date); if(!day) return [];
  const lect=lectSlotsArr();
  const out=[];
  (S.absences||[]).filter(a=>a.date===date).forEach(a=>{
    const slots=(a.slots||[]).length?a.slots.map(Number):lect;
    slots.forEach(slot=>{
      S.groups.forEach(g=>{
        const c=S.schedule[g.name]?.[day]?.[slot]||S.schedule[g.name]?.[String(day)]?.[String(slot)];
        if(c&&c.t===a.teacherId){
          const sub=S.subjects.find(s=>s.code===c.s);
          out.push({date,day,slot,groupId:g.id,groupName:g.name,subjectId:sub?.id||null,subjectCode:c.s,absentTeacherId:a.teacherId});
        }
      });
    });
  });
  return out;
}

// ── PUNTUACIÓN EXPLICABLE de un candidato para una sesión ──────────
function scoreCandidate(tid,ses){
  const br=[]; let total=0;
  const add=(pts,label)=>{ br.push({pts,label}); total+=pts; };
  const g=S.groups.find(x=>x.id===ses.groupId);
  // 1. Profesor de guardia en esa franja (máxima prioridad)
  if((S.guards||[]).some(gu=>gu.teacherId===tid&&+gu.day===ses.day&&+gu.slot===ses.slot))
    add(5000,"Profesor de guardia en esta franja");
  // 2. Tutor del grupo
  if(g&&g.tutorId===tid) add(3000,"Tutor del grupo");
  // 3. Imparte clase a este grupo
  else if(g&&(S.curriculum[g.id]||[]).some(e=>e.tid===tid)) add(2000,"Da clase a este grupo");
  // 4. Mismo nivel educativo
  else if(g&&trabajaEnNivel(tid,g.grade,g.level)) add(1000,"Trabaja en el mismo nivel");
  // 5. Mismo ciclo
  else if(g&&trabajaEnCiclo(tid,cicloDe(g.grade,g.level),g.level)) add(500,"Trabaja en el mismo ciclo");
  // 6. Misma especialidad (imparte la misma materia en otro grupo)
  if(ses.subjectId&&S.groups.some(gg=>(S.curriculum[gg.id]||[]).some(e=>e.tid===tid&&e.sid===ses.subjectId)))
    add(300,"Imparte esta materia");
  // 7. Equilibrio de guardias realizadas (curso)
  const histCount={}; (S.guardHistory||[]).forEach(h=>{histCount[h.teacherId]=(histCount[h.teacherId]||0)+1;});
  const maxHist=Math.max(0,...Object.values(histCount));
  const bonoG=Math.min(250,(maxHist-(histCount[tid]||0))*25);
  if(bonoG>0) add(bonoG,"Equilibrio de guardias (curso)");
  // 8. Equilibrio mensual de sustituciones
  const mes=ses.date.slice(0,7);
  const mCount={}; (S.substitutions||[]).filter(s=>s.date.slice(0,7)===mes).forEach(s=>{mCount[s.substituteTeacherId]=(mCount[s.substituteTeacherId]||0)+1;});
  const maxMes=Math.max(0,...Object.values(mCount));
  const bonoM=Math.min(250,(maxMes-(mCount[tid]||0))*40);
  if(bonoM>0) add(bonoM,"Equilibrio mensual de sustituciones");
  return {total,breakdown:br};
}

// Candidatos válidos y ordenados (puntuación + desempates) para una sesión
function candidatosPara(ses){
  subEnsureState();
  const histCount={}; (S.guardHistory||[]).forEach(h=>{histCount[h.teacherId]=(histCount[h.teacherId]||0)+1;});
  const mes=ses.date.slice(0,7);
  const mCount={}; (S.substitutions||[]).filter(s=>s.date.slice(0,7)===mes).forEach(s=>{mCount[s.substituteTeacherId]=(mCount[s.substituteTeacherId]||0)+1;});
  const maxDay=Math.max(1,+S.subConfig.maxPerDay||2);
  const cands=[];
  S.teachers.forEach(t=>{
    if(t.id===ses.absentTeacherId) return;                       // el ausente no
    if(isAbsent(t.id,ses.date,ses.slot)) return;                 // no está ausente
    if(!teacherFreeAt(t.id,ses.day,ses.slot)) return;            // sin clase ni bloqueo
    if((S.substitutions||[]).some(s=>s.date===ses.date&&+s.slot===ses.slot&&s.substituteTeacherId===t.id)) return; // sin otra sustitución igual
    if((S.substitutions||[]).filter(s=>s.date===ses.date&&s.substituteTeacherId===t.id).length>=maxDay) return;    // límite diario
    const {total,breakdown}=scoreCandidate(t.id,ses);
    cands.push({t,total,breakdown,hist:histCount[t.id]||0,mes:mCount[t.id]||0,carga:cargaHoraria(t.id)});
  });
  // orden: puntuación desc; desempates: menos guardias históricas, menos
  // sustituciones mensuales, menor carga lectiva, alfabético
  cands.sort((a,b)=>b.total-a.total||a.hist-b.hist||a.mes-b.mes||a.carga-b.carga||a.t.name.localeCompare(b.t.name));
  return cands;
}

function registrarAusencia(){
  subEnsureState();
  const tid=document.getElementById("abs-t").value;
  const date=document.getElementById("abs-d").value;
  if(!tid||!date){ toast("Elige profesor y fecha"); return; }
  if(!dateToDay(date)){ toast("La fecha cae en fin de semana"); return; }
  const slots=[...document.querySelectorAll(".abs-slot:checked")].map(c=>+c.value);
  if(S.absences.some(a=>a.teacherId===tid&&a.date===date)){ toast("Ya hay una ausencia de ese profesor ese día"); return; }
  S.absences.push({id:subNewId(),teacherId:tid,date,slots});
  save(); window._subDate=date; navigate("subs");
  toast("🚑 Ausencia registrada");
}
function borrarAusencia(id){
  const a=S.absences.find(x=>x.id===id); if(!a) return;
  // borrar también sus sustituciones de ese día
  S.substitutions=S.substitutions.filter(s=>!(s.date===a.date&&s.absentTeacherId===a.teacherId));
  S.absences=S.absences.filter(x=>x.id!==id);
  save(); navigate("subs");
}
function verCandidatos(idx){
  window._subShowCands = (window._subShowCands===idx)? null : idx;
  navigate("subs");
}
function asignarSub(sesIdx,candIdx){
  const ses=window._subSes[sesIdx]; const cand=window._subCands[candIdx];
  if(!ses||!cand) return;
  S.substitutions.push({id:subNewId(),date:ses.date,day:ses.day,slot:ses.slot,groupId:ses.groupId,
    subjectId:ses.subjectId,absentTeacherId:ses.absentTeacherId,substituteTeacherId:cand.t.id,
    score:cand.total,reasonBreakdown:cand.breakdown});
  S.guardHistory.push({teacherId:cand.t.id,date:ses.date,day:ses.day,slot:ses.slot});
  window._subShowCands=null;
  save(); navigate("subs");
}
function quitarSub(id){
  const s=S.substitutions.find(x=>x.id===id); if(!s) return;
  S.guardHistory=S.guardHistory.filter(h=>!(h.teacherId===s.substituteTeacherId&&h.date===s.date&&+h.slot===+s.slot));
  S.substitutions=S.substitutions.filter(x=>x.id!==id);
  save(); navigate("subs");
}
// ⚡ Asignación automática de todas las sesiones pendientes de la fecha
function autoAsignar(){
  const date=window._subDate; if(!date){ toast("Elige una fecha"); return; }
  const sesiones=sesionesAfectadas(date).filter(ses=>
    !S.substitutions.some(s=>s.date===ses.date&&+s.slot===+ses.slot&&s.groupId===ses.groupId&&s.absentTeacherId===ses.absentTeacherId));
  let ok=0, sin=0;
  sesiones.forEach(ses=>{
    const cands=candidatosPara(ses);
    if(cands.length===0){ sin++; return; }
    const best=cands[0];
    S.substitutions.push({id:subNewId(),date:ses.date,day:ses.day,slot:ses.slot,groupId:ses.groupId,
      subjectId:ses.subjectId,absentTeacherId:ses.absentTeacherId,substituteTeacherId:best.t.id,
      score:best.total,reasonBreakdown:best.breakdown});
    S.guardHistory.push({teacherId:best.t.id,date:ses.date,day:ses.day,slot:ses.slot});
    ok++;
  });
  save(); navigate("subs");
  toast(`⚡ ${ok} sustituciones asignadas`+(sin?` · ⚠️ ${sin} sin candidato`:""));
}

// ────────────────────────────────────────────────────────────────────
// ── 🧠 MEMORIA DE ÉXITOS EVOLUTIVA ───────────────────────────────────
// Cada horario COMPLETO enseña al motor dónde encajaron sus sesiones, con
// peso proporcional a su calidad pedagógica: los mejores horarios dejan más
// huella, y las siguientes generaciones tienden hacia ellos. Persiste con
// los datos (aprende entre sesiones) y se puede desactivar o borrar.
function learnFromSchedule(sched,q){
  if(S.memOn===false) return;
  if(!q||q<65) return;                     // solo enseñan los horarios buenos
  if(!S.successMem) S.successMem={};
  const lect=S.slots.filter(s=>s.type==="class");
  const gain=Math.max(1,q-60);             // más calidad ⇒ más peso (evolución)
  S.groups.forEach(g=>{ const gs=sched[g.name]; if(!gs) return;
    for(let d=1;d<=5;d++) lect.forEach(sl=>{
      const c=gs[d]?.[sl.n]||gs[String(d)]?.[String(sl.n)]; if(!c||!c.s) return;
      const k=g.name+"|"+c.s+"|"+d+"|"+sl.n;
      S.successMem[k]=Math.min(200,(S.successMem[k]||0)+gain);
    });
  });
}
function clearSuccessMem(){ S.successMem={}; save(); toast("🧠 Memoria de éxitos borrada — el motor vuelve a explorar desde cero"); navigate("generator"); }

// ── VALIDADOR PRE-VUELO Y ESTADÍSTICAS (lecciones del motor de GHC) ──
function validateConfig(){
  const errors=[],warns=[];
  const lect=S.slots.filter(s=>s.type==="class");
  const LECTN=lect.length*5;
  const tById={}; S.teachers.forEach(t=>tById[t.id]=t);
  S.teachers.forEach(t=>{
    let h=0; Object.values(S.curriculum).forEach(ents=>(ents||[]).forEach(e=>{ if(e.tid===t.id) h+=e.sessions; }));
    if(!h) return;
    const lib=(t.unavail||[]).filter(u=>lect.some(s=>s.n===+u.s)).length;
    const m=LECTN-lib-h;
    if(m<0) errors.push(t.name+": "+h+"h con solo "+(LECTN-lib)+" franjas disponibles (margen "+m+") — imposible de encajar");
    else if(m<=1) warns.push(t.name+": margen "+m+" — muy justo, probable cuello de botella");
  });
  S.groups.forEach(g=>{
    const ents=(S.curriculum[g.id]||[]).filter(e=>e.sessions>0);
    ents.forEach(e=>{ if(!tById[e.tid]) errors.push(g.name+": materia asignada a un profesor inexistente ("+e.tid+")"); });
    if((g.level||"")!=="infantil"){
      const tot=ents.reduce((x,e)=>x+e.sessions,0);
      const s11=ents.filter(e=>e.sid==="s11");
      const dup=s11.length>1?s11.slice(1).reduce((x,e)=>x+e.sessions,0):0;
      if(tot-dup!==LECTN) warns.push(g.name+": "+(tot-dup)+" sesiones para "+LECTN+" franjas lectivas");
      if(!g.tutorId) warns.push(g.name+": sin tutor asignado");
      else if(!tById[g.tutorId]) errors.push(g.name+": el tutorId no corresponde a ningún profesor");
      else{
        const th=ents.filter(e=>e.tid===g.tutorId).reduce((x,e)=>x+e.sessions,0);
        if(th===0) warns.push(g.name+": su tutor ("+tById[g.tutorId].name+") no imparte ninguna sesión en el grupo — ¿tutoría desactualizada?");
      }
    }
  });
  return {errors,warns};
}

// ────────────────────────────────────────────────────────────────────
// ── §10c CALIDAD PEDAGÓGICA Y COMPARADOR DE VERSIONES
// ────────────────────────────────────────────────────────────────────
// El motor garantiza que el horario CABE; estas métricas puntúan si es
// BUENO con criterio de maestro: instrumentales en las primeras sesiones,
// sin materia repetida el mismo día, y materias de pocas horas repartidas
// en días distintos. Las versiones guardadas permiten comparar candidatos.
function computeQuality(sched){
  const lect=S.slots.filter(s=>s.type==="class").map(s=>s.n);
  const early=new Set(lect.slice(0,3));
  const INSTR=new Set(["MAT","LCL","LGL","LEX"]);
  const perGroup={}; let tot=0,ng=0;
  S.groups.forEach(g=>{
    if((g.level||"")==="infantil") return;
    const gs=sched[g.name]; if(!gs) return;
    let instrTot=0,instrEarly=0,repV=0,spreadOk=0,spreadTot=0;
    const byDay={},subDays={};
    for(let d=1;d<=5;d++){
      byDay[d]={};
      lect.forEach(n=>{
        const c=gs[d]?.[n]||gs[String(d)]?.[String(n)];
        if(!c||!c.s) return;
        byDay[d][c.s]=(byDay[d][c.s]||0)+1;
        (subDays[c.s]=subDays[c.s]||new Set()).add(d);
        if(INSTR.has(c.s)){ instrTot++; if(early.has(n)) instrEarly++; }
      });
    }
    // Regla blanda "no repetir materia el mismo día": SOLO penaliza materias no
    // comodín (instrumentales, Inglés y EF). Las comodín (Ciencias, Sociales,
    // Plástica, Música, EVCE) quedan exentas para dar libertad de encaje en una
    // rejilla al 100%. La regla DURA de EF/Inglés (getFreeSlots) es independiente
    // y sigue vigente: nunca dos EF ni dos Inglés el mismo día.
    const COMODIN_REP=new Set(["CN","CS","PLST","MUS","EVCE"]);
    for(let d=1;d<=5;d++) Object.entries(byDay[d]).forEach(([s,n])=>{ if(n>1 && !COMODIN_REP.has(s)) repV+=n-1; });
    Object.keys(subDays).forEach(s=>{
      let t=0; for(let d=1;d<=5;d++) t+=byDay[d][s]||0;
      if(t>=2&&t<=5){ spreadTot++; if(subDays[s].size===t) spreadOk++; }
    });
    const mI=instrTot?Math.round(instrEarly/instrTot*100):100;
    const mR=Math.max(0,100-repV*25);
    const mS=spreadTot?Math.round(spreadOk/spreadTot*100):100;
    const score=Math.round(mI*0.4+mR*0.3+mS*0.3);
    perGroup[g.name]={score,mI,mR,mS};
    tot+=score; ng++;
  });
  return {total:ng?Math.round(tot/ng):0, perGroup};
}

function pgGenerator(c){
  const ok=S.teachers.length>0&&S.groups.length>0&&Object.keys(S.curriculum).length>0;
  const totalSess=Object.values(S.curriculum).flat().reduce((a,e)=>a+e.sessions,0);
  const classSlots=S.slots.filter(s=>s.type==="class").map(s=>s.n);
  const DAYS_N=[1,2,3,4,5];

  // ── Análisis de cuellos de botella ───────────────────────────────
  function bottleneckAnalysis(){
    const items=[];
    // Por profesor
    S.teachers.forEach(t=>{
      const sessions=Object.values(S.curriculum).flat()
        .filter(e=>e.tid===t.id).reduce((s,e)=>s+e.sessions,0);
      if(sessions===0) return;
      const unavail=(t.unavail||[]).filter(u=>classSlots.includes(u.s)).length;
      const available=classSlots.length*5-unavail;
      const pressure=available>0?sessions/available:999;
      const nGroups=new Set(
        Object.entries(S.curriculum).filter(([,cur])=>cur.some(e=>e.tid===t.id)).map(([gid])=>gid)
      ).size;
      items.push({type:'teacher',name:t.name,sessions,available,pressure,nGroups,color:t.color||'#475569'});
    });
    // Por grupo
    S.groups.forEach(g=>{
      const cur=S.curriculum[g.id]||[];
      const sessions=cur.reduce((s,e)=>s+e.sessions,0);
      if(sessions===0) return;
      // Contar franjas ÚNICAS donde algún especialista del grupo no puede venir
      // (antes se sumaban las libranzas de cada especialista por separado,
      //  lo que daba números imposibles >25)
      const blockedSet=new Set();
      cur.forEach(e=>{
        if(!e.tid||e.tid===g.tutorId) return; // solo especialistas, no el tutor
        const t=S.teachers.find(t=>t.id===e.tid);
        (t?.unavail||[]).filter(u=>classSlots.includes(u.s)).forEach(u=>{
          blockedSet.add(`${u.d}-${u.s}`);
        });
      });
      const blockedSlots=blockedSet.size;
      const effective=classSlots.length*5;
      const pressure=sessions/effective;
      if(pressure>0.85||blockedSlots>3) items.push({type:'group',name:g.name,sessions,available:effective,pressure,blockedSlots,color:'#0ea5e9'});
    });
    return items.sort((a,b)=>b.pressure-a.pressure);
  }

  const bottlenecks=ok?bottleneckAnalysis():[];
  const critical=bottlenecks.filter(b=>b.pressure>0.85);
  const warned=bottlenecks.filter(b=>b.pressure>0.65&&b.pressure<=0.85);

  function pressureBar(p){
    const pct=Math.min(100,Math.round(p*100));
    const col=p>0.85?'#f87171':p>0.65?'#fbbf24':'#4ade80';
    return `<div style="display:flex;align-items:center;gap:6px">
      <div style="flex:1;height:5px;background:var(--bd);border-radius:3px">
        <div style="width:${pct}%;height:100%;background:${col};border-radius:3px"></div>
      </div>
      <span style="font-size:10px;font-weight:700;color:${col};min-width:32px">${pct}%</span>
    </div>`;
  }

  c.innerHTML=`<div class="sh2"><div><h1>Generador CSP</h1><p>Motor híbrido · MRV · Forward Checking · Ejection Chains · LNS</p></div></div>
  ${!ok?`<div class="card" style="border-color:var(--amd)"><div class="empty">
    <div class="ei">⚠️</div><div class="et">Faltan datos para generar</div>
    <div class="es">${S.teachers.length===0?'❌':'✅'} Profesores (${S.teachers.length})<br>${S.groups.length===0?'❌':'✅'} Grupos (${S.groups.length})<br>${Object.keys(S.curriculum).length===0?'❌':'✅'} Curriculum configurado</div>
  </div></div>`:`
  <div style="max-width:760px;display:flex;flex-direction:column;gap:12px">
    <button class="btn bg2" id="gbtn" style="width:100%;padding:13px;justify-content:center;font-size:15px" onclick="runGen()">⚡ Generar horario</button>
    <button class="btn bo" id="gpar" style="width:100%;justify-content:center" onclick="runGenParallel()">🚀 Generar en PARALELO (beta)</button>
    <button class="btn" id="gval" style="width:100%;justify-content:center" onclick="runValidation()">🔍 Validar configuración</button>
    <div style="display:flex;gap:9px;align-items:center;margin-top:7px;flex-wrap:wrap;font-size:11.5px;color:var(--tx3)">
      <label style="display:flex;gap:5px;align-items:center;cursor:pointer">
        <input type="checkbox" ${S.memOn!==false?"checked":""} onchange="S.memOn=this.checked;save()">
        🧠 Memoria de éxitos (${Object.keys(S.successMem||{}).length} franjas aprendidas)
      </label>
      <button class="btn bsm bo" onclick="clearSuccessMem()">Borrar memoria</button>
    </div>
    <div style="display:flex;align-items:center;gap:10px;font-size:13px;color:var(--tx2);background:#050d18;border:1px solid var(--bd);border-radius:var(--r);padding:9px 13px">
      <label style="display:flex;align-items:center;gap:7px;cursor:pointer">
        <input type="checkbox" id="gauto" checked style="width:16px;height:16px;cursor:pointer">
        <span>🔁 Auto-repetir si quedan sesiones sin colocar</span>
      </label>
      <span style="margin-left:auto;color:var(--tx3)">máx.
        <input type="number" id="gautoN" value="50" min="1" max="50" style="width:52px;background:#142235;border:1px solid #2d4258;border-radius:4px;color:#ffffff;font-weight:700;padding:3px 5px;text-align:center;-webkit-text-fill-color:#ffffff;color-scheme:dark">

    </div>

// ── COPIAR LOG COMPLETO ──────────────────────────────────────────────
// Los intentos fallidos se pliegan en <details>; su contenido no entra en la
// selección manual. Este botón recorre el DOM (visible y plegado) y copia el
// log íntegro en el formato lineal de siempre, listo para pegar o analizar.
function copyFullLog(){
  const glog=document.getElementById("glog"); if(!glog) return;
  const out=[];
  const walk=el=>{
    Array.from(el.childNodes).forEach(n=>{
      if(n.nodeType!==1) return;
      if(n.tagName==="SUMMARY"){
        const t=n.textContent.replace(/\s*\(pulsa para ver el detalle\)/,"").trim();
        if(t) out.push(t);
        return;
      }
      if(n.tagName==="DETAILS"||n.children.length>0&&n.querySelector("div,details,summary")){
        walk(n); return;
      }
      const t=n.textContent.trim();
      if(t) out.push(t);
    });
  };
  walk(glog);
  const txt=out.join("\n");
  if(!txt){ toast("El log está vacío","warn"); return; }
  const done=()=>toast("📋 Log completo copiado ("+out.length+" líneas)");
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done,()=>{ fallbackCopy(txt); done(); });
  }else{ fallbackCopy(txt); done(); }
  function fallbackCopy(t){
    const ta=document.createElement("textarea");
    ta.value=t; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); }catch(e){}
    ta.remove();
  }
}

    const sep=document.createElement("div");
    sep.className="int-sep";
    sep.style.cssText="margin:0 0 4px;color:#80bde2;font-weight:800;font-size:12px";
    sep.textContent=`──────────  INTENTO 1 de ${_autoMax}  ──────────`;
    $("glog").appendChild(sep);
  }
  requestAnimationFrame(()=>{ requestAnimationFrame(()=>{ runGenEngine(); }); });
}

function runGenEngine(){
  const t0=Date.now();
  const lectSlots=S.slots.filter(s=>s.type==="class").map(s=>s.n);
  const DAYS_N=[1,2,3,4,5];
  const DAYS=["Lun","Mar","Mié","Jue","Vie"];
  const slot_labels={1:"1ª",2:"2ª",3:"3ª",6:"4ª",7:"5ª"};
  const primGroups=S.groups.filter(g=>g.level==="primaria");
  const infGroups=S.groups.filter(g=>g.level==="infantil");

  const sched={};
  primGroups.forEach(g=>{ sched[g.name]={}; DAYS_N.forEach(d=>{ sched[g.name][d]={}; }); });
  infGroups.forEach(g=>{ sched[g.name]={}; DAYS_N.forEach(d=>{ sched[g.name][d]={}; }); });

  const teacherBusy={};
  S.teachers.forEach(t=>{
    teacherBusy[t.id]=new Int32Array(8); // bitmask: 1 entero/día, 1 bit/franja
    (t.unavail||[]).forEach(u=>{ teacherBusy[t.id][u.d]|=(1<<(u.s)); });
  });

  // ── FASE 1: ESPECIALISTAS INFANTIL EN LIBRANZAS ─────────────────
  if(infGroups.length>0){
    infGroups.forEach(g=>{
      const tutor=S.teachers.find(t=>t.id===g.tutorId);
      const tutorUnavail=(tutor?.unavail||[]).filter(u=>lectSlots.includes(u.s));
      if(!tutorUnavail.length) return;
      const specTasks=[];
      (S.curriculum[g.id]||[]).forEach(e=>{
        if(e.sessions>0&&e.tid!==g.tutorId){
          const code=S.subjects.find(s=>s.id===e.sid)?.code||"???";
          specTasks.push({tid:e.tid,code,sessions:e.sessions,remaining:e.sessions});
        }
      });
      for(const u of tutorUnavail){
        const {d:day,s:slot}=u;
        if(sched[g.name][day]?.[slot]) continue;
        const candidate=specTasks.find(t=>t.remaining>0&&!((teacherBusy[t.tid]&&(teacherBusy[t.tid][day]>>(slot))&1)));
        if(!candidate) continue;
        // RESTRICCIÓN DURA: EF/Inglés nunca 2 veces el mismo día.
        if((candidate.code==="EF"||candidate.code==="LEX")&&
           lectSlots.some(sl2=>sched[g.name][day]?.[sl2]?.s===candidate.code)) continue;
        sched[g.name][day][slot]={s:candidate.code,t:candidate.tid};
        teacherBusy[candidate.tid][day]|=(1<<(slot));
        candidate.remaining--;
      }
    });
    infGroups.forEach(g=>{ S.schedule[g.name]=sched[g.name]; });
    const cnt=infGroups.reduce((s,g)=>s+DAYS_N.reduce((s2,d)=>s2+lectSlots.filter(sl=>sched[g.name][d]?.[sl]).length,0),0);
    const infLn=document.createElement("div");
    infLn.style.color="#4ade80";
    infLn.textContent=`✅ Fase 1 infantil: ${cnt} ses. en libranzas`;
    $("glog").appendChild(infLn); $("glog").scrollTop=$("glog").scrollHeight;
  }

  // Marcar infantil en teacherBusy para primaria
  infGroups.forEach(g=>{
    DAYS_N.forEach(day=>lectSlots.forEach(slot=>{
      const cell=sched[g.name][day]?.[slot];
      if(cell?.t) teacherBusy[cell.t][day]|=(1<<(slot));
    }));
  });

  // ── TAREAS DE PRIMARIA ──────────────────────────────────────────
  const tasks=[];
  primGroups.forEach(g=>{
    (S.curriculum[g.id]||[]).forEach(e=>{
      if(e.sessions>0){
        const code=S.subjects.find(s=>s.id===e.sid)?.code||"???";
        tasks.push({gname:g.name,sid:e.sid,tid:e.tid,sessions:e.sessions,code,_placed:false});
      }
    });
  });

  // Criticidad = sesiones_necesarias / franjas_disponibles
  const tutorCrossGroupCount={};
  S.teachers.forEach(t=>{
    const own=primGroups.find(g=>g.tutorId===t.id);
    if(!own) return;
    const cross=tasks.filter(tk=>tk.tid===t.id&&tk.gname!==own.name)
                     .reduce((s,tk)=>s+tk.sessions,0);
    tutorCrossGroupCount[t.id]=cross;
  });

  const criticality={};
  S.teachers.forEach(t=>{
    const needed=tasks.filter(tk=>tk.tid===t.id).reduce((s,tk)=>s+tk.sessions,0);
    const unavail=(t.unavail||[]).filter(u=>lectSlots.includes(u.s)).length;
    const avail=lectSlots.length*5-unavail;
    criticality[t.id]=avail>0?needed/avail:999;
  });

  const crossGroupSessions=new Set();
  S.teachers.forEach(t=>{
    const own=primGroups.find(g=>g.tutorId===t.id);
    if(!own) return;
    tasks.forEach(task=>{
      if(task.tid===t.id&&task.gname!==own.name) crossGroupSessions.add(task);
    });
  });

  const sharedSpaceMap={};
  S.constraints.filter(c=>c.type==="shared_space"&&c.isHard&&c.subject).forEach(c=>{
    const groups=c.groups||c.target.split(",").map(g=>g.trim());
    if(!sharedSpaceMap[c.subject]) sharedSpaceMap[c.subject]=[];
    sharedSpaceMap[c.subject].push(groups);
  });

  
// ────────────────────────────────────────────────────────────────────
// ── §13 GENERADOR — MOTOR CSP
// ────────────────────────────────────────────────────────────────────
function violatesSharedSpace(gname,code,day,slot){
    const rules=sharedSpaceMap[code];
    if(!rules) return false;
    for(const group of rules){
      if(!group.includes(gname)) continue;
      for(const other of group){
        if(other===gname) continue;
        const cell=sched[other]?.[day]?.[slot];
        if(cell&&cell.s===code) return true;
      }
    }
    return false;
  }

  const tutorUnavailSlots={};
  S.teachers.forEach(t=>{
