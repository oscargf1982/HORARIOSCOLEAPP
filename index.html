// ── COMPLETAR LO QUE FALTA (Variante A) ────────────────────────────
// Toma el horario actual COMO ESTÁ (respeta todo: motor + cambios
// manuales) y solo intenta colocar las sesiones que aún faltan, en
// huecos libres donde el profesor esté disponible. No mueve nada.
function completarFaltantes(){
  const DAYS_N=[1,2,3,4,5];
  const lectSlots=S.slots.filter(s=>s.type==="class").map(s=>s.n);
  const DAYS=["Lun","Mar","Mié","Jue","Vie"];
  const slot_labels={1:"1ª",2:"2ª",3:"3ª",6:"4ª",7:"5ª"};
  const elbaId=S.teachers.find(t=>t.name==="Elba")?.id||null;

  function getCell(gname,day,slot){
    return S.schedule[gname]?.[day]?.[slot]||S.schedule[gname]?.[String(day)]?.[String(slot)];
  }

  // Espacio compartido (local): mismo código de materia no puede coincidir
  // en la misma franja entre grupos que comparten espacio (ej: EF/pabellón)
  const sharedSpaceMapL={};
  (S.constraints||[]).filter(c=>c.type==="shared_space"&&c.isHard&&c.subject).forEach(c=>{
    const groups=c.groups||c.target.split(",").map(x=>x.trim());
    if(!sharedSpaceMapL[c.subject]) sharedSpaceMapL[c.subject]=[];
    sharedSpaceMapL[c.subject].push(groups);
  });
  function violatesSharedSpace(gname,code,day,slot){
    const rules=sharedSpaceMapL[code];
    if(!rules) return false;
    for(const group of rules){
      if(!group.includes(gname)) continue;
      for(const other of group){
        if(other===gname) continue;
        const cell=getCell(other,day,slot);
        if(cell&&cell.s===code) return true;
      }
    }
    return false;
  }

  // Reconstruir ocupación de cada profesor desde el horario actual
  const teacherBusy={};
  S.teachers.forEach(t=>{
    teacherBusy[t.id]=new Int32Array(8); // bitmask: 1 entero/día, 1 bit/franja
    (t.unavail||[]).forEach(u=>{ teacherBusy[t.id][u.d]|=(1<<(u.s)); });
  });
  S.groups.forEach(g=>{
    DAYS_N.forEach(day=>lectSlots.forEach(slot=>{
      const c=getCell(g.name,day,slot);
      if(c?.t) teacherBusy[c.t][day]|=(1<<(slot));
      if(c?.t2) teacherBusy[c.t2][day]|=(1<<(slot));
    }));
  });

  // Función para colocar sesiones pendientes de un grupo
  let totalPlaced=0, stillMissing=[];
  S.groups.forEach(g=>{
    if(!S.schedule[g.name]) S.schedule[g.name]={};
    DAYS_N.forEach(d=>{ if(!S.schedule[g.name][d]) S.schedule[g.name][d]={}; });

    (S.curriculum[g.id]||[]).forEach(e=>{
      const code=S.subjects.find(s=>s.id===e.sid)?.code||"???";
      const tid=e.tid;
      // Saltar las entradas REL de grupos donde el PC lo da el tutor:
      // las maneja la fase dedicada de religión PC-tutor más abajo.
      if(code==="REL"&&g.level==="primaria"){
        let pcTidLocal=null;
        (S.curriculum[g.id]||[]).forEach(e2=>{
          const c2=S.subjects.find(s=>s.id===e2.sid)?.code;
          if(c2==="REL"&&e2.tid!==elbaId) pcTidLocal=e2.tid;
        });
        if(pcTidLocal===g.tutorId) return; // PC-tutor → dejar a la fase dedicada
      }
      // Contar sesiones ya colocadas de este (code,tid) en el grupo
      let got=0;
      DAYS_N.forEach(day=>lectSlots.forEach(slot=>{
        const c=getCell(g.name,day,slot);
        if(c&&c.s===code&&(c.t===tid||c.t2===tid)) got++;
      }));
      let missing=e.sessions-got;
      if(missing<=0) return;

      // Caso especial Elba (REL): debe ir en la franja del PC (desdoble)
      if(tid===elbaId&&code==="REL"){
        for(let day=1;day<=5&&missing>0;day++){
          for(const slot of lectSlots){
            if(missing<=0) break;
            const c=getCell(g.name,day,slot);
            // Hay REL del PC sin Elba (t2 vacío) y Elba libre
            if(c&&c.s==="REL"&&c.t!==elbaId&&!c.t2&&!((teacherBusy[elbaId][day]>>(slot))&1)){
              c.t2=elbaId; c.parallel=true;
              teacherBusy[elbaId][day]|=(1<<(slot));
              missing--; totalPlaced++;
            }
          }
        }
        if(missing>0) stillMissing.push(`${g.name}/${code}/${gt(tid)?.name||"?"} (${missing})`);
        return;
      }

      // Colocación normal en hueco libre
      for(let day=1;day<=5&&missing>0;day++){
        for(const slot of lectSlots){
          if(missing<=0) break;
          if(getCell(g.name,day,slot)) continue;           // hueco ocupado
          if(tid&&((teacherBusy[tid][day]>>(slot))&1)) continue;    // profesor ocupado
          S.schedule[g.name][day][slot]={s:code,t:tid};
          if(tid) teacherBusy[tid][day]|=(1<<(slot));
          missing--; totalPlaced++;
        }
      }
      if(missing>0) stillMissing.push(`${g.name}/${code}/${gt(tid)?.name||"?"} (${missing})`);
    });
  });

  // ── RELIGIÓN PC-TUTOR: resolver grupos sin REL ───────────────────
  // En grupos donde el PC lo da el tutor, si falta la REL suele ser porque
  // la única franja libre del grupo coincide con la libranza del tutor
  // (el tutor no puede dar PC en su propia libranza). Solución:
  //  1. Cubrir esa libranza con otro profesor que dé clase en el grupo
  //     (preferir tutores viajeros sobre especialistas para no agotarlos)
  //  2. Eso libera una franja donde el tutor SÍ está → ahí va el desdoble
  // O, si hay otra franja donde el tutor da clase a su grupo y Elba libre,
  // mover esa clase al hueco y poner el desdoble en su lugar.
  const primForRel=S.groups.filter(g=>g.level==="primaria");
  let relPlaced=0;
  primForRel.forEach(g=>{
    // ¿Ya tiene REL?
    let hasRel=false;
    DAYS_N.forEach(d=>lectSlots.forEach(s=>{ if(getCell(g.name,d,s)?.s==="REL") hasRel=true; }));
    if(hasRel) return;
    // ¿Quién da el PC? (REL que no es Elba)
    let pcTid=null;
    (S.curriculum[g.id]||[]).forEach(e=>{
      const c=S.subjects.find(s=>s.id===e.sid)?.code;
      if(c==="REL"&&e.tid!==elbaId) pcTid=e.tid;
    });
    if(!pcTid) return;
    const esTutor=pcTid===g.tutorId;

    // Helpers locales
    const pcUnavail=new Set((S.teachers.find(t=>t.id===pcTid)?.unavail||[]).map(u=>`${u.d}-${u.s}`));
    function elbaLibre(d,s){ return !(teacherBusy[elbaId]&&(teacherBusy[elbaId][d]>>(s))&1); }
    function pcLibre(d,s){
      if((teacherBusy[pcTid]&&(teacherBusy[pcTid][d]>>(s))&1)) return false;
      if(pcUnavail.has(`${d}-${s}`)) return false;
      return true;
    }

    // INTENTO A: hay alguna franja libre del grupo donde PC y Elba libres
    let done=false;
    for(let d=1;d<=5&&!done;d++){
      for(const s of lectSlots){
        if(getCell(g.name,d,s)) continue;
        if(!elbaLibre(d,s)||!pcLibre(d,s)) continue;
        S.schedule[g.name][d][s]={s:"REL",t:pcTid,t2:elbaId,parallel:true};
        teacherBusy[pcTid][d]|=(1<<(s)); teacherBusy[elbaId][d]|=(1<<(s));
        relPlaced++; totalPlaced++; done=true; break;
      }
    }
    if(done) return;

    // INTENTO B (solo PC-tutor): la única franja libre del grupo es la
    // libranza del tutor (no puede dar PC ahí). Solución:
    //  1. Cubrir esa libranza con OTRO profesor que dé clase en el grupo
    //     (preferir tutores viajeros sobre especialistas).
    //  2. Eso libera la franja que ocupaba ese profesor → si el tutor está
    //     libre ahí y Elba también, poner el desdoble REL+PC.
    if(esTutor){
      // huecos libres del grupo (típicamente la libranza del tutor)
      const huecos=[];
      DAYS_N.forEach(d=>lectSlots.forEach(s=>{ if(!getCell(g.name,d,s)) huecos.push({d,s}); }));

      // Profesores que dan clase en este grupo (no el tutor, no Elba),
      // ordenados: tutores viajeros primero (preservar especialistas)
      const especialistasIds=new Set();
      ["Oscar","Richi","Diego","Mikel","Arancha Inglés"].forEach(n=>{
        const t=S.teachers.find(t=>t.name===n); if(t) especialistasIds.add(t.id);
      });
      function esViajero(tid){ return primForRel.some(gg=>gg.tutorId===tid); }

      for(const h of huecos){
        if(done) break;
        // ¿La libranza del tutor (este hueco) la puede cubrir alguien?
        // Buscar un profesor que YA da clase a este grupo en OTRA franja,
        // que esté libre en el hueco h, y que al moverlo libere una franja
        // donde el tutor + Elba puedan dar el desdoble.
        // Candidatos: profesores con clase en el grupo (no tutor, no Elba)
        const candidatos=[];
        DAYS_N.forEach(d=>lectSlots.forEach(s=>{
          const c=getCell(g.name,d,s);
          if(!c||c.t===pcTid||c.t===elbaId||c.s==="REL") return;
          candidatos.push({d,s,cell:c});
        }));
        // ordenar: viajeros antes que especialistas
        candidatos.sort((a,b)=>{
          const av=esViajero(a.cell.t)?0:(especialistasIds.has(a.cell.t)?2:1);
          const bv=esViajero(b.cell.t)?0:(especialistasIds.has(b.cell.t)?2:1);
          return av-bv;
        });

        for(const cand of candidatos){
          if(done) break;
          const movTid=cand.cell.t;
          // ¿Puede ese profesor ir al hueco h (la libranza del tutor)?
          if((teacherBusy[movTid]&&(teacherBusy[movTid][h.d]>>(h.s))&1)) continue;
          if((S.teachers.find(t=>t.id===movTid)?.unavail||[]).some(u=>u.d===h.d&&u.s===h.s)) continue;
          if(violatesSharedSpace(g.name,cand.cell.s,h.d,h.s)) continue;
          // ¿El tutor está libre en la franja que dejará libre cand (cand.d,cand.s)?
          // y Elba libre ahí?
          if((teacherBusy[pcTid]&&(teacherBusy[pcTid][cand.d]>>(cand.s))&1)) continue;
          if(pcUnavail.has(`${cand.d}-${cand.s}`)) continue;
          if(!elbaLibre(cand.d,cand.s)) continue;
          // Ejecutar: mover la clase de cand al hueco h (cubre libranza)
          S.schedule[g.name][h.d][h.s]=cand.cell;
          teacherBusy[movTid][h.d]|=(1<<(h.s));
          // Poner el desdoble REL+PC en la franja liberada (cand.d,cand.s)
          S.schedule[g.name][cand.d][cand.s]={s:"REL",t:pcTid,t2:elbaId,parallel:true};
          teacherBusy[pcTid][cand.d]|=(1<<(cand.s));
          teacherBusy[elbaId][cand.d]|=(1<<(cand.s));
          relPlaced++; totalPlaced++; done=true;
        }
      }
    }
    if(!done) stillMissing.push(`${g.name}/REL/${gt(pcTid)?.name||"?"} (1)`);
  });

  // ── Completar INFANTIL: huecos vacíos → tutor (GLOB) ─────────────
  // En infantil, las franjas que no son de especialista las cubre el tutor.
  // Se rellena CUALQUIER hueco vacío con el tutor, salvo en su libranza real.
  const infGroups=S.groups.filter(g=>g.level==="infantil");
  let infFilled=0;
  infGroups.forEach(g=>{
    const tutorId=g.tutorId;
    if(!tutorId) return;
    const tutor=S.teachers.find(t=>t.id===tutorId);
    const tutorUnavail=new Set((tutor?.unavail||[]).map(u=>`${u.d}-${u.s}`));
    let globCode="GLOB";
    const te=(S.curriculum[g.id]||[]).find(e=>e.tid===tutorId);
    if(te) globCode=S.subjects.find(s=>s.id===te.sid)?.code||"GLOB";
    DAYS_N.forEach(day=>lectSlots.forEach(slot=>{
      if(getCell(g.name,day,slot)) return;                  // ya ocupado
      if(tutorUnavail.has(`${day}-${slot}`)) return;         // libranza real del tutor
      // ¿El tutor está dando clase en OTRO grupo en esta franja? (raro en infantil)
      let elsewhere=false;
      S.groups.forEach(g2=>{
        if(g2.name===g.name) return;
        const c=getCell(g2.name,day,slot);
        if(c&&(c.t===tutorId||c.t2===tutorId)) elsewhere=true;
      });
      if(elsewhere) return;
      if(!S.schedule[g.name][day]) S.schedule[g.name][day]={};
      S.schedule[g.name][day][slot]={s:globCode,t:tutorId};
      S.schedule[g.name][String(day)]=S.schedule[g.name][day];
      infFilled++; totalPlaced++;
    }));
  });

  save(); pgSchedule($('ct'));
  if(totalPlaced===0&&stillMissing.length===0){
    toast("✅ El horario ya está completo, no falta nada");
  } else if(stillMissing.length===0){
    toast(`✅ ${totalPlaced} sesiones colocadas — horario completo`);
  } else {
    toast(`Colocadas ${totalPlaced}. Aún faltan (sin hueco libre): ${stillMissing.join(", ")}`,"warn");
  }
}

// Convierte el color vivo de un profesor (ej. "#3b82f6") en un trío
// {bg oscuro, bd borde, tx texto claro} para las celdas del horario.
// Mismo profesor → mismo color en todas sus materias.
function tchColorBg(hex){
  if(!hex||hex[0]!=="#"||hex.length<7) return {bg:"#1e293b",bd:"#334155",tx:"#e2e8f0"};
  const r=parseInt(hex.slice(1,3),16),
        g=parseInt(hex.slice(3,5),16),
        b=parseInt(hex.slice(5,7),16);
  // Fondo: versión muy oscura del color (mezcla con negro ~82%)
  const dk=(c)=>Math.round(c*0.22);
  const bg=`rgb(${dk(r)},${dk(g)},${dk(b)})`;
  // Borde: versión media-oscura
  const md=(c)=>Math.round(c*0.45);
  const bd=`rgb(${md(r)},${md(g)},${md(b)})`;
  // Texto: versión clara del color (mezcla con blanco)
  const lt=(c)=>Math.round(c+(255-c)*0.55);
  const tx=`rgb(${lt(r)},${lt(g)},${lt(b)})`;
  return {bg,bd,tx};
}

}
function getTchSes(tid,day,slot){for(const[gn,gs2] of Object.entries(S.schedule)){const s=gs2[day]?.[slot];if(s&&s._hold)continue;if(s&&s.t===tid)return{...s,group:gn};if(s&&s.t2===tid)return{...s,group:gn,t:tid};}
  // Guardia asignada en esta franja → mostrarla en su horario
  if((S.guards||[]).some(g=>g.teacherId===tid&&+g.day===+day&&+g.slot===+slot))
    return {s:"GUAR",t:tid,group:"",_guard:true};
  // PT Preferente: si no hay sesión y no es libranza ni hora liberada,
  // está en Atención Preferente con su alumno (grupo fijo)
  const t=gt(tid);
  if(t?.ptPref){
    if((t.unavail||[]).some(u=>+u.d===+day&&+u.s===+slot)) return null;
    if((t.ptFreeSlots||[]).some(f=>+f.d===+day&&+f.s===+slot)) return null;
    const g=S.groups.find(x=>x.id===t.ptPrefGroupId);
    return {s:"APREF",t:tid,group:g?g.name:"",_apref:true};
  }
  return null;}
function doSwap(src,dst){
  const sch=S.schedule[svGrp];if(!sch)return;
  const sd=+src.dataset.d,ss=+src.dataset.s,dd=+dst.dataset.d,ds=+dst.dataset.s;
  if(!sch[sd])sch[sd]={};if(!sch[dd])sch[dd]={};
  const tmp=sch[sd][ss];sch[sd][ss]=sch[dd][ds]||null;sch[dd][ds]=tmp;
  if(!sch[sd][ss])delete sch[sd][ss];if(!sch[dd][ds])delete sch[dd][ds];
  drawSG();toast("Sesión movida");
}

function exportCSV(){
  if(!Object.keys(S.schedule).length){ toast("Genera primero un horario","warn"); return; }
  const lect=S.slots.filter(s=>s.type==="class"||s.type==="lectiva");
  const DD=["Lunes","Martes","Miércoles","Jueves","Viernes"];
  const rows=["Grupo;Día;Franja;Hora;Materia;Profesor;Desdoble"];
  S.groups.forEach(g=>{
    const sch=S.schedule[g.name]; if(!sch) return;
    for(let d=1;d<=5;d++) lect.forEach(sl=>{
      const c=sch[d]?.[sl.n]||sch[String(d)]?.[String(sl.n)]; if(!c||!c.s) return;
      const sub=S.subjects.find(x=>x.code===c.s);
      rows.push([g.name,DD[d-1],sl.label||("F"+sl.n),sl.time||"",(sub?sub.name:c.s),
        (gt(c.t)?gt(c.t).name:""),(c.t2&&gt(c.t2)?gt(c.t2).name:"")].join(";"));
    });
  });
  const blob=new Blob(["\ufeff"+rows.join("\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="horarios-"+(S.center?.year||"centro")+".csv"; a.click();
  toast("📄 CSV de horarios descargado");
}

// ── Función auxiliar: genera HTML de tabla de horario ────────────
function buildScheduleTableHTML(schedData, title, subtitle, showTeacher=true){
  let rows="";
  S.slots.forEach(sl=>{
    const isClass=sl.type==="class";
    const bg = sl.type==="recess"||sl.type==="reading" ? "#fff3cd" :
               sl.type==="lunch"   ? "#f0f0f0" :
               sl.type==="library" ? "#e8f0fb" : "#fff";
    const labelTd=`<td style="background:#f8f9fa;font-weight:700;white-space:nowrap;padding:6px 10px;border:1px solid #dee2e6;font-size:12px;color:#444">
      <div style="font-weight:800;color:#002b4a">${sl.label}</div>
      <div style="font-size:10px;color:#888;font-weight:400">${sl.time}</div>
    </td>`;
    if(!isClass){
      rows+=`<tr>${labelTd}${DAYS.map(()=>`<td style="background:${bg};text-align:center;font-size:10px;font-weight:700;color:#888;padding:4px;border:1px solid #dee2e6">${sl.label.toUpperCase()}</td>`).join("")}</tr>`;
    } else {
      rows+=`<tr>${labelTd}`;
      for(let d=1;d<=5;d++){
        const ses=schedData[d]?.[sl.n];
        const sub=ses?S.subjects.find(s=>s.code===ses.s):null;
        const tch=ses&&showTeacher?gt(ses.t):null;
        // Desdoble: mostrar también al segundo profesor (p.ej. tutor + Elba)
        const tch2=ses&&showTeacher&&ses.t2?gt(ses.t2):null;
        const tchLabel=tch?(tch.name+(tch2?` + ${tch2.name}`:"")):null;
        if(sub){
          rows+=`<td style="padding:5px 7px;border:1px solid #dee2e6;background:${bg}">
            <div style="font-weight:800;font-size:12px;color:#002b4a">${sub.name}</div>
            ${tchLabel?`<div style="font-size:10px;color:#555;margin-top:1px">${tchLabel}</div>`:""}
          </td>`;
        } else {
          rows+=`<td style="padding:5px 7px;border:1px solid #dee2e6;background:#fafafa;color:#ccc;text-align:center;font-size:11px">—</td>`;
        }
      }
      rows+="</tr>";
    }
  });
  return `<div style="margin-bottom:28px">
    <div style="font-size:18px;font-weight:900;color:#002b4a;text-transform:uppercase;letter-spacing:.02em;margin-bottom:2px">${title}</div>

      <thead><tr>

        ${DAYS.map(d=>`<th style="background:#007bc4;color:#fff;padding:8px 10px;border:1px solid #007bc4;font-size:11px;text-transform:uppercase;letter-spacing:.04em">${d}</th>`).join("")}
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

function printTeacherSchedule(){
  if(!svTch){toast("Selecciona un profesor primero","warn");return;}
  const tch=gt(svTch); if(!tch)return;

  // Reconstruir horario del profesor buscando en todos los grupos
  const tSched={};
  DAYS.forEach((_,di)=>{
    const d=di+1; tSched[d]={};
    S.slots.filter(s=>s.type==="class").forEach(sl=>{
      for(const [gname, gsched] of Object.entries(S.schedule)){
        const cell=gsched[d]?.[sl.n];
        if(cell?.t===svTch||cell?.t2===svTch){ tSched[d][sl.n]={...cell, groupName:gname}; break; }
      }
    });
  });

  // Añadir GUARDIAS y Atención Preferente a la impresión (no están en S.schedule)
  {
    const _t=gt(svTch);
    DAYS.forEach((_,di)=>{
      const d=di+1;
      S.slots.filter(s=>s.type==="class").forEach(sl=>{
        if(tSched[d][sl.n]) return;
        if((S.guards||[]).some(g=>g.teacherId===svTch&&+g.day===d&&+g.slot===sl.n)){
          tSched[d][sl.n]={s:"GUAR",t:svTch,groupName:""}; return;
        }
        if(_t?.ptPref){
          if((_t.unavail||[]).some(u=>+u.d===d&&+u.s===sl.n)) return;
          if((_t.ptFreeSlots||[]).some(f=>+f.d===d&&+f.s===sl.n)) return;
          const g=S.groups.find(x=>x.id===_t.ptPrefGroupId);
          tSched[d][sl.n]={s:"APREF",t:svTch,groupName:g?g.name:""};
        }
      });

  // Contar sesiones totales

      if(cell){ totalSessions++; materiaCount[cell.s]=(materiaCount[cell.s]||0)+1; }

  let rows="";

      <div style="font-size:10px;color:#888;font-weight:400">${sl.time}</div>
    </td>`;
    if(!isClass){
      rows+=`<tr>${labelTd}${DAYS.map(()=>`<td style="background:${bg};text-align:center;font-size:10px;font-weight:700;color:#888;padding:4px;border:1px solid #dee2e6">${sl.label.toUpperCase()}</td>`).join("")}</tr>`;
    } else {
      rows+=`<tr>${labelTd}`;
      for(let d=1;d<=5;d++){
        const cell=tSched[d]?.[sl.n];
        const sub=cell?S.subjects.find(s=>s.code===cell.s):null;
        if(sub){
          rows+=`<td style="padding:5px 7px;border:1px solid #dee2e6">
            <div style="font-weight:800;font-size:12px;color:#002b4a">${sub.name}</div>
            <div style="font-size:10px;color:#007bc4;font-weight:700">${cell.groupName||""}</div>
          </td>`;
        } else {
          rows+=`<td style="padding:5px 7px;border:1px solid #dee2e6;background:#fafafa;color:#ccc;text-align:center;font-size:11px">—</td>`;
        }
      }
      rows+="</tr>";
    }
  });

  const resumen=Object.entries(materiaCount).map(([code,n])=>{
    const s=S.subjects.find(s=>s.code===code);
    return `<span style="display:inline-block;background:#e6f3fa;color:#002b4a;padding:3px 10px;border-radius:2px;font-size:11px;font-weight:700;margin:2px">${s?.name||code}: ${n}h</span>`;
  }).join(" ");

  const win=window.open("","_blank");
  win.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8">
  <title>Horario ${tch.name} — ${S.center.name}</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:Arial,sans-serif;padding:24px;background:#fff;color:#1a1a1a}
    .header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding-bottom:14px;border-bottom:3px solid #002b4a}
    @media print{body{padding:12px}button{display:none!important}}
  </style>
  </head><body>
  <div class="header">
    <div>
      <div style="font-size:18px;font-weight:900;color:#002b4a;text-transform:uppercase">${tch.name}</div>
      <div style="font-size:12px;color:#666;margin-top:3px">${tch.spec||"Docente"} · ${S.center.name} · Curso ${S.center.year}</div>
      <div style="font-size:12px;color:#007bc4;margin-top:5px;font-weight:700">${totalSessions} sesiones lectivas/semana</div>
    </div>
    <button onclick="window.print()" style="background:#002b4a;color:#fff;border:none;padding:9px 18px;font-size:13px;font-weight:700;cursor:pointer;border-radius:3px">🖨️ Imprimir</button>
  </div>
  <table style="width:100%;border-collapse:collapse;font-family:Arial,sans-serif;margin-bottom:18px">
    <thead><tr>

      ${DAYS.map(d=>`<th style="background:#002b4a;color:#fff;padding:8px 10px;border:1px solid #002b4a;font-size:11px;text-transform:uppercase;letter-spacing:.04em">${d}</th>`).join("")}
    </tr></thead>

// ── localStorage (siempre, como caché instantánea) ───────────
const LS_KEY2 = LS_KEY;
let _lastMemJSON=null; // para no reescribir successMem si no ha cambiado
function saveLS(){
  try{
    // Mejora #18 auditoría: successMem crece con cada generación y NO necesita
    // reescribirse en cada guardado por-tecla — se serializa aparte, y solo si
    // cambió de verdad desde la última escritura.
    const { successMem, ...Sligero } = S;
    localStorage.setItem(LS_KEY2, JSON.stringify(Sligero));
    localStorage.setItem(LS_KEY2+"_ts", String(Date.now()));
    if(successMem){
      const memJSON=JSON.stringify(successMem);
      if(memJSON!==_lastMemJSON){
        localStorage.setItem(LS_KEY2+"_mem", memJSON);
        _lastMemJSON=memJSON;
      }
    }
  }
  catch(e){
    // No silenciar: si el guardado local falla (cuota llena, modo privado),
    // el usuario debe saberlo para no perder trabajo sin darse cuenta.
    if(!window._lsWarned){
      window._lsWarned=true;   // avisar solo una vez por sesión
      try{ toast("⚠️ No se pudo guardar localmente: "+(e?.name==="QuotaExceededError"?"espacio lleno":"error del navegador")+". Exporta tus datos por seguridad."); }catch(_){}
      console.error("saveLS falló:",e);
    }
  }
}
// ── FUSIÓN MAESTRO↔GUARDADO (BUG 5 auditoría) ────────────────────────
// Antes: cada carga PISABA teachers/groups/curriculum con el PRELOAD del
// código fuente, así que cualquier edición hecha desde la UI (disponibilidad,
// editar profesor, sesiones de currículum, tutores) se perdía al recargar.
// Ahora: se CONSERVA lo guardado y solo se AÑADEN entidades nuevas que
// aparezcan en el PRELOAD (p.ej. si algún día añades un profesor o grupo
// editando el HTML) — nunca se sobreescribe una entidad ya editada.
function _mergeArr(saved, master, idKey){
  idKey = idKey || "id";
  if(!Array.isArray(saved) || !saved.length) return (master||[]).map(x=>({...x}));
  const savedIds = new Set(saved.map(x=>x[idKey]));
  const nuevos = (master||[]).filter(x=>!savedIds.has(x[idKey]));
  return nuevos.length ? [...saved, ...nuevos.map(x=>({...x}))] : saved;
}
function _mergeCurriculum(saved, master){
  if(!saved || typeof saved!=="object" || !Object.keys(saved).length) return master;
  const merged={...saved};
  Object.keys(master||{}).forEach(gid=>{ if(!(gid in merged)) merged[gid]=master[gid]; });
  return merged;
}
function mergeMasterPreservingEdits(){
  if(!window._PRELOAD_MASTER) return;
  const M=window._PRELOAD_MASTER;
  S.teachers   = _mergeArr(S.teachers, M.teachers, "id");
  S.groups     = _mergeArr(S.groups, M.groups, "id");
  S.curriculum = _mergeCurriculum(S.curriculum, M.curriculum);
  // center/recess: mantener lo guardado si existe; si no, usar el maestro
  if(!S.center) S.center = M.center;
  if(!S.recess) S.recess = M.recess;
}

function loadLS(){
  try{
    const raw=localStorage.getItem(LS_KEY2); if(!raw)return false;
    const d=JSON.parse(raw);
    Object.keys(d).forEach(k=>{ if(k in S) S[k]=d[k]; });
    // Campos nuevos (no están en la S inicial): restaurarlos explícitamente
    ["versions","memOn"].forEach(k=>{ if(d[k]!==undefined) S[k]=d[k]; });
    // successMem ahora vive en su propia clave (mejora #18 auditoría) —
    // si aún hubiera un blob antiguo con successMem embebido (versión previa
    // de la app), lo aceptamos como fallback antes de mirar la clave nueva.
    if(d.successMem!==undefined) S.successMem=d.successMem;
    try{
      const memRaw=localStorage.getItem(LS_KEY2+"_mem");
      if(memRaw) S.successMem=JSON.parse(memRaw);
    }catch(e){}
    fixSlots();  // migrar formato antiguo
    // Fusionar datos maestros preservando ediciones de UI (BUG 5 corregido):
    // teachers/groups/curriculum conservan lo guardado; solo se añade lo nuevo.
    // slots/subjects siguen viniendo siempre del código (bootApp los refuerza).
    mergeMasterPreservingEdits();
    if(window._PRELOAD_MASTER?.slots) S.slots=window._PRELOAD_MASTER.slots;
    if(window._PRELOAD_MASTER?.subjects) S.subjects=window._PRELOAD_MASTER.subjects;
    ensureBuiltinSubjects();
    return true;
  }catch(e){ return false; }
}

// ── Guardar en Realtime Database (debounced 1.5 s) ───────────
function scheduleCloudSave(){
  _pendingCloud=true;
  clearTimeout(_cloudTimer);
  _cloudTimer=setTimeout(doCloudSave, 1500);
}
function doCloudSave(){
  if(!fbRef){ showOffline(); return; }
  showSaving();
  fbRef.set({ data: JSON.stringify(S), ts: Date.now() })
    .then(()=>{ _pendingCloud=false; showSaved(); })
    .catch(e=>{ console.warn("RTDB write error:",e); showOffline(); });
}

// ── Cargar desde Realtime Database ───────────────────────────
function loadCloud(){
  return new Promise(resolve=>{
    if(!fbRef){ resolve(false); return; }
    fbRef.once("value")
      .then(snap=>{
        const val=snap.val();
        if(!val||!val.data){ resolve(false); return; }
        // No pisar ediciones locales más recientes que aún no hayan llegado a la
        // nube (p.ej. el usuario editó y cerró antes de que venciera el debounce).
        const localTs = +(localStorage.getItem(LS_KEY2+"_ts")||0);
        if(val.ts && localTs && localTs > val.ts){ resolve(false); return; }
        const d=JSON.parse(val.data);
        // Cargar datos de la nube (schedule, versiones, restricciones)
        Object.keys(d).forEach(k=>{ if(k in S) S[k]=d[k]; });
    // Campos nuevos (no están en la S inicial): restaurarlos explícitamente
    ["versions","successMem","memOn"].forEach(k=>{ if(d[k]!==undefined) S[k]=d[k]; });
        fixSlots();
        // Fusionar datos maestros preservando ediciones de UI (BUG 5 corregido).
        mergeMasterPreservingEdits();
        if(window._PRELOAD_MASTER?.slots) S.slots=window._PRELOAD_MASTER.slots;
        if(window._PRELOAD_MASTER?.subjects) S.subjects=window._PRELOAD_MASTER.subjects;
        ensureBuiltinSubjects();
        resolve(true);
      })
      .catch(e=>{ console.warn("RTDB read error:",e); resolve(false); });
  });
}

// ── Exportar .json ───────────────────────────────────────────
function downloadAllSchedules(){
  if(!S.schedule||Object.keys(S.schedule).length===0){
    toast("Genera el horario primero","warn"); return;
  }
  toast("⏳ Generando Excel...");

  async function doExport(){
    const ExcelJSlib=window.ExcelJS;
    const wb=new ExcelJSlib.Workbook();
    wb.creator='CEIP Monforte'; wb.created=new Date();

    const DAYS=['Lunes','Martes','Miércoles','Jueves','Viernes'];
    const slotLabels={1:'1ª (9:00)',2:'2ª (9:50)',3:'3ª (10:40)',6:'4ª (12:00)',7:'5ª (13:00)'};
    const classSlots=S.slots.filter(s=>s.type==='class').map(s=>s.n);
    const DAY_COLORS=['1D4ED8','0369A1','0F766E','7C3AED','B45309'];

    const hex=(c,def)=>{ if(!c) return def; return c.replace('#','').toUpperCase().padStart(6,'0').slice(0,6); };
    function subjBg(code){ return hex(S.subjects.find(s=>s.code===code)?.bg,'475569'); }
    function subjTx(code){ return hex(S.subjects.find(s=>s.code===code)?.tx,'FFFFFF'); }

    // Abreviaturas de materias para el Excel
    const ABREV={MAT:'MAT',LCL:'LenCast',LGL:'LinGal',CS:'Soci',CN:'Natus',
      EF:'EdFis',PLST:'Plast',REL:'Rel/PC',MUS:'Mus',LEX:'Ing',
      EVCE:'Valores',GLOB:'Global',TUT:'Tut',PT:'PT',REF:'Ref',APOY:'Apoyo',PCEI:'PCInf'};
    const abrev=(code)=>ABREV[code]||code;
    const primerNombre=(tid)=>{ const n=S.teachers.find(t=>t.id===tid)?.name||''; return n.split(' ')[0]; };

    const thin={style:'thin',color:{argb:'FFCCCCCC'}};
    const borderAll={top:thin,left:thin,bottom:thin,right:thin};

    // Pinta un horario en una hoja, empezando en (row0, col0) (1-based de ExcelJS)
    // modo: 'group' (materia+profesor) | 'teacher' (grupo+materia, con libranzas)
    function paint(ws, title, sched, row0, col0, modo, teacherId){
      const nDays=DAYS.length;
      // título
      const tcell=ws.getCell(row0,col0);
      tcell.value=title;
      tcell.font={bold:true,size:12,color:{argb:'FF002B4A'}};
      tcell.alignment={horizontal:'center',vertical:'middle'};
      ws.mergeCells(row0,col0,row0,col0+nDays);
      // cabecera días
      const hc=ws.getCell(row0+1,col0); hc.value='Sesión';
      hc.font={bold:true,color:{argb:'FFFFFFFF'}};
      hc.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF002B4A'}};
      hc.alignment={horizontal:'center',vertical:'middle'}; hc.border=borderAll;
      DAYS.forEach((day,di)=>{
        const c=ws.getCell(row0+1,col0+di+1); c.value=day;
        c.font={bold:true,color:{argb:'FFFFFFFF'}};
        c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF'+DAY_COLORS[di]}};
        c.alignment={horizontal:'center',vertical:'middle'}; c.border=borderAll;
      });
      // filas de sesiones
      classSlots.forEach((slot,si)=>{
        const r=row0+2+si;
        const sc=ws.getCell(r,col0); sc.value=slotLabels[slot]||`${slot}ª`;
        sc.font={bold:true,size:9}; sc.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFE2E8F0'}};
        sc.alignment={horizontal:'center',vertical:'middle'}; sc.border=borderAll;
        DAYS.forEach((_,di)=>{
          const day=di+1;
          const cell=ws.getCell(r,col0+di+1);
          cell.border=borderAll;
          cell.alignment={horizontal:'center',vertical:'middle',wrapText:true};
          if(modo==='group'){
            const s=sched?.[day]?.[slot]||sched?.[String(day)]?.[String(slot)];
            if(s?.s&&!s._hold){
              const tn=primerNombre(s.t);
              const tn2=s.t2?primerNombre(s.t2):'';
              cell.value=`${abrev(s.s)} / ${tn2?tn+' / '+tn2:tn}`;
              cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF'+subjBg(s.s)}};
              cell.font={size:9,color:{argb:'FF'+subjTx(s.s)}};
            } else { cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFF1F5F9'}}; }
          } else {
            let found=null;
            S.groups.forEach(g=>{
              const gs=S.schedule[g.name]||{};
              const c=gs[day]?.[slot]||gs[String(day)]?.[String(slot)];
              if(c&&!c._hold&&(c.t===teacherId||c.t2===teacherId)) found={...c,grupo:g.name};
            });
            if(found){
              cell.value=`${found.grupo} / ${abrev(found.s)}`;
              cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF'+subjBg(found.s)}};
              cell.font={size:9,color:{argb:'FF'+subjTx(found.s)}};
            } else {
              const isUn=teacherId&&(S.teachers.find(t=>t.id===teacherId)?.unavail||[]).some(u=>u.d===day&&u.s===slot);
              if(isUn){ cell.value='LIBRANZA'; cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF1E293B'}};
                cell.font={size:8,color:{argb:'FF94A3B8'}}; }
              else { cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFF1F5F9'}}; }
            }
          }
        });
      });
    }
    function setCols(ws, layout){ // layout: array de anchos
      ws.columns=layout.map(w=>({width:w}));
    }

    // ── HOJA INFANTIL ──
    const infG=S.groups.filter(g=>g.level==='infantil');
    if(infG.length>0){
      const ws=wb.addWorksheet('Infantil');
      let row=1;
      infG.forEach(g=>{
        const tut=S.teachers.find(t=>t.id===g.tutorId)?.name||'';
        paint(ws,`${g.name}${tut?' — '+tut:''}`,S.schedule[g.name]||{},row,1,'group');
        row+=classSlots.length+4;
      });
      setCols(ws,[14,20,20,20,20,20]);
    }

    // ── HOJAS POR CURSO (grupo izq + tutor der, A arriba / B abajo) ──
    const cursos=['1º','2º','3º','4º','5º','6º'];
    cursos.forEach(curso=>{
      const gA=S.groups.find(g=>g.name===curso+'A');
      const gB=S.groups.find(g=>g.name===curso+'B');
      if(!gA&&!gB) return;
      const ws=wb.addWorksheet(curso);
      const bloque=classSlots.length+4;
      const colTutor=DAYS.length+3; // 1(sesión)+5(días)+1(separador)+1 = col donde empieza tutor
      [gA,gB].forEach((g,idx)=>{
        if(!g) return;
        const row=1+idx*bloque;
        const tut=S.teachers.find(t=>t.id===g.tutorId);
        const tn=tut?.name||'';
        paint(ws,`${g.name}${tn?' — '+tn:''}`,S.schedule[g.name]||{},row,1,'group');
        if(tut) paint(ws,`Tutor/a: ${tn}`,null,row,colTutor,'teacher',tut.id);
      });
      setCols(ws,[14,20,20,20,20,20,3,14,20,20,20,20,20]);
    });

    // ── HOJA ESPECIALISTAS (cada uno apilado) ──
    const tutorIds=new Set(S.groups.map(g=>g.tutorId).filter(Boolean));
    const espec=sortedTeachers().filter(t=>!tutorIds.has(t.id));
    if(espec.length>0){
      const ws=wb.addWorksheet('Especialistas');
      let row=1;
      espec.forEach(t=>{
        paint(ws,`${t.name}`,null,row,1,'teacher',t.id);
        row+=classSlots.length+4;
      });
      setCols(ws,[14,20,20,20,20,20]);
    }

    // Descargar
    const fecha=new Date().toISOString().slice(0,10);
    try{
      const buf=await wb.xlsx.writeBuffer();
      const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url; a.download=`horarios-ceip-monforte-${fecha}.xlsx`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
      toast("✅ Excel descargado con colores");
    }catch(err){ console.error(err); toast("Error al generar Excel: "+err.message,"warn"); }
  }

  // Cargar ExcelJS si no está disponible
  if(window.ExcelJS){
    doExport().catch(e=>{ console.error(e); toast("Error: "+e.message,"warn"); });
  } else {
    const script=document.createElement('script');
    script.src='https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js';
    script.onload=()=>{ doExport().catch(e=>{ console.error(e); toast("Error: "+e.message,"warn"); }); };
    script.onerror=()=>toast("Error cargando ExcelJS — ¿sin conexión a internet?","warn");
    document.head.appendChild(script);
  }
}

// ────────────────────────────────────────────────────────────────────
// ── §GEN-PARALELO — Web Workers (usa todos los núcleos de la CPU)
// ────────────────────────────────────────────────────────────────────
// Cada worker carga ESTE MISMO script (leído de la etiqueta #mainScript)
// dentro de un Blob, con: (1) WORKER_MODE=true, que desactiva bootApp y
// hace que finishGen entregue el resultado en vez de tocar la UI; (2) un
// DOM de mentira que absorbe los accesos del motor a la interfaz; (3) un
// onmessage que recibe el estado S, siembra Math.random con una semilla
// distinta y encadena intentos hasta completar. El primero que logra el
// 100% gana y el resto se termina. El botón clásico queda intacto.
let _parWorkers=[];
function _parStop(){ _parWorkers.forEach(w=>{ try{w.terminate();}catch(e){} }); _parWorkers=[]; }
function runGenParallel(){
  if(!S.teachers.length||!S.groups.length){ toast("Configura profesores y grupos primero","warn"); return; }
  const srcEl=document.getElementById("mainScript");
  if(!srcEl||typeof Worker==="undefined"){ toast("Workers no disponibles en este navegador — usa el botón clásico","warn"); return; }
  const N=Math.min(4,Math.max(2,(navigator.hardwareConcurrency||4)-1));
  const MAXA=15; // intentos por worker
  const glogEl=$("glog"); if(glogEl) glogEl.innerHTML="";
  const line=(txt,color)=>{ if(!glogEl)return; const d=document.createElement("div");
    d.style.cssText="font-size:11.5px;line-height:1.7;color:"+(color||"#9fb6c9");
    d.textContent=txt; glogEl.appendChild(d); glogEl.scrollTop=glogEl.scrollHeight; };
  line("🚀 Generación PARALELA — "+N+" workers × "+MAXA+" intentos máx. cada uno","#80bde2");
  line("La página sigue usable durante la generación.","#5b7387");
  const btn=$("gbtn"); if(btn) btn.disabled=true;
  const pbtn=$("gpar"); if(pbtn){ pbtn.disabled=true; pbtn.textContent="⏳ Generando en paralelo…"; }
  const pw=$("gpbw"); if(pw) pw.style.maxHeight="30px";
  const stateJson=JSON.parse(JSON.stringify(S));

  const prelude=[
    'self.WORKER_MODE=true;',
    'const __mkEl=()=>({style:{},classList:{add(){},remove(){},toggle(){},contains:()=>false},dataset:{},children:[],childNodes:[],textContent:"",innerHTML:"",value:"",checked:false,className:"",cssText:"",appendChild(){return __mkEl();},removeChild(){},remove(){},insertBefore(){},addEventListener(){},removeEventListener(){},querySelector:()=>null,querySelectorAll:()=>[],closest:()=>null,setAttribute(){},getAttribute:()=>null,focus(){},blur(){},select(){},click(){},scrollTop:0,scrollHeight:0,offsetWidth:0,offsetHeight:0,nextSibling:null,parentNode:null,getContext:()=>null});',
    'self.document={createElement:()=>__mkEl(),createTextNode:()=>({}),getElementById:(id)=>{ if(id!=="glog") return __mkEl(); const g=__mkEl(); g.appendChild=(el)=>{ try{ self.postMessage({type:"wlog",txt:(el&&el.textContent||"").trim()}); }catch(e){} }; return g; },querySelector:()=>null,querySelectorAll:()=>[],addEventListener(){},removeEventListener(){},body:__mkEl(),head:__mkEl(),documentElement:__mkEl(),title:""};',
    'self.window=self;',
    'self.localStorage={getItem:()=>null,setItem(){},removeItem(){},clear(){}};',
    'self.requestAnimationFrame=(f)=>setTimeout(f,0);',
    'self.alert=()=>{}; self.confirm=()=>false; self.prompt=()=>null;',
    'self.addEventListener=self.addEventListener||(()=>{}); self.removeEventListener=self.removeEventListener||(()=>{});',
    'self.location=self.location||{href:"",hash:"",search:"",reload(){}};',
    'self.history=self.history||{pushState(){},replaceState(){}};',
    'self.matchMedia=self.matchMedia||(()=>({matches:false,addListener(){},addEventListener(){}}));',
    'self.MutationObserver=self.MutationObserver||function(){return{observe(){},disconnect(){}}};',
    'self.ResizeObserver=self.ResizeObserver||function(){return{observe(){},disconnect(){}}};'
  ].join("\n");

  const post=[
    ';self.onmessage=async (e)=>{',
    '  const m=e.data; if(!m||m.cmd!=="gen") return;',
    '  Object.keys(m.state).forEach(k=>{ S[k]=m.state[k]; });',
    '  const mul=(s)=>{let t=s>>>0;return function(){t|=0;t=t+0x6D2B79F5|0;let r=Math.imul(t^t>>>15,1|t);r=r+Math.imul(r^r>>>7,61|r)^r;return((r^r>>>14)>>>0)/4294967296;};};',
    '  let best=null;',
    '  for(let a=1;a<=m.maxAttempts;a++){',
    '    Math.random=mul((m.seed+a*7919)>>>0);',
    '    self.__lastResult=null;',
    '    try{ await runGenEngine(); }catch(err){ postMessage({type:"err",msg:String(err&&err.message||err)}); return; }',
    '    let w=0; while(self.__lastResult===null&&w<400){ await new Promise(r=>setTimeout(r,10)); w++; }',
    '    const r=self.__lastResult||{skipped:99,hardV:99,schedule:null};',
    '    postMessage({type:"progress",attempt:a,skipped:r.skipped});',
    '    if(r.skipped===0&&r.hardV===0){ postMessage({type:"done",attempt:a,schedule:r.schedule}); return; }',
    '    if(r.schedule&&(best===null||r.skipped<best.skipped)) best={skipped:r.skipped,schedule:r.schedule};',
    '  }',
    '  postMessage({type:"exhausted",best:best});',
    '};'
  ].join("\n");

  const url=URL.createObjectURL(new Blob([prelude+"\n"+srcEl.textContent+"\n"+post],{type:"text/javascript"}));
  _parStop();
  let finished=false, doneCount=0, best=null;
  const t0=Date.now();
  const cleanup=(msg,color)=>{
    finished=true; _parStop(); URL.revokeObjectURL(url);
    clearTimeout(_killTimer);
    if(btn) btn.disabled=false;
    if(pbtn){ pbtn.disabled=false; pbtn.textContent="🚀 Generar en PARALELO (beta)"; }
    if(pw) pw.style.maxHeight="0";
    if(msg) line(msg,color);
  };
  const applySchedule=(sch,label)=>{
    S.schedule=sch;
    try{ learnFromSchedule(sch,computeQuality(sch).total); }catch(e){}
    try{ if(typeof generateGuards==="function") generateGuards(true); }catch(e){}
    save(); line(label,"#4ade80"); toast(label);
    const g=$("gst"); if(g) g.textContent=label;
  };
  for(let k=0;k<N;k++){
    let w;
    try{ w=new Worker(url); }
    catch(e){ line("⚠️ No se pudieron crear workers: "+e.message,"#f87171"); cleanup(); return; }
    _parWorkers.push(w);
    w.onerror=(e)=>{
      doneCount++;
      line("⚠️ Worker "+(k+1)+" error: "+(e.message||"desconocido")+" — el modo clásico sigue disponible","#f87171");
      if(!finished&&doneCount>=N){
        if(best&&best.schedule){ applySchedule(best.schedule,"Mejor resultado parcial: "+best.skipped+" sin colocar"); cleanup(); }
        else cleanup("❌ Paralelo no disponible — usa el botón clásico","#f87171");
      }
    };
    w.onmessage=(ev)=>{
      const m=ev.data; if(!m) return;
      if(m.type==="wlog"){
        if(finished) return;
        if(!w._body){
          const det=document.createElement("details"); det.style.cssText="margin:1px 0";
          const su=document.createElement("summary");
          su.style.cssText="color:#5b7387;font-size:10.5px;cursor:pointer";
          su.textContent="📄 Detalle worker "+(k+1)+" (pulsa para desplegar)";
          det.appendChild(su);
          w._body=document.createElement("div");
          w._body.style.cssText="opacity:.75;padding-left:8px;border-left:2px solid #335";
          det.appendChild(w._body);
          if(glogEl) glogEl.appendChild(det);
        }
        if(m.txt){ const d=document.createElement("div");
          d.style.cssText="font-size:10.5px;line-height:1.6;color:#9fb6c9";
          d.textContent=m.txt; w._body.appendChild(d); }
        return;
      }
      if(finished&&m.type!=="done") return;
      if(m.type==="progress"){
        line("⚡ W"+(k+1)+" · intento "+m.attempt+": "+m.skipped+" sin colocar");
        const g=$("gst"); if(g) g.textContent="Paralelo · "+Math.round((Date.now()-t0)/1000)+"s · "+N+" workers";
      } else if(m.type==="done"&&!finished){
        try{
          const secs=((Date.now()-t0)/1000).toFixed(1);
          applySchedule(m.schedule,"🎉 HORARIO COMPLETO en paralelo — worker "+(k+1)+", intento "+m.attempt+", "+secs+"s");
        }catch(err){ line("⚠️ Error al aplicar el horario: "+(err&&err.message||err),"#f87171"); }
        cleanup();
        // enlace explícito por si la navegación automática falla
        try{
          const gl=$("glog");
          if(gl){ const b=document.createElement("button");
            b.className="btn bg2 bsm"; b.style.cssText="margin-top:6px";
            b.textContent="📅 Ver horario completo";
            b.onclick=()=>navigate("schedule");
            gl.appendChild(b); gl.scrollTop=gl.scrollHeight; }
        }catch(e){}
        try{ navigate("schedule"); }catch(err){ line("⚠️ Abre la pestaña Horario para verlo","#f0a868"); }
      } else if(m.type==="exhausted"){
        doneCount++;
        if(m.best&&(best===null||m.best.skipped<best.skipped)) best=m.best;
        line("W"+(k+1)+" agotó sus intentos"+(m.best?" · mejor: "+m.best.skipped+" sin colocar":""),"#f0a868");
        if(!finished&&doneCount>=N){
          if(best&&best.schedule) applySchedule(best.schedule,"Mejor resultado paralelo: "+best.skipped+" sin colocar");
          cleanup();
        }
      } else if(m.type==="err"){
        doneCount++;
        line("⚠️ W"+(k+1)+": "+m.msg,"#f87171");
        if(!finished&&doneCount>=N) cleanup("❌ Paralelo falló — usa el botón clásico","#f87171");
      }
    };
    w.postMessage({cmd:"gen",state:stateJson,seed:((Date.now()>>>2)^(k*1315423911))>>>0,maxAttempts:MAXA});
  }
  var _killTimer=setTimeout(()=>{
    if(!finished){
      if(best&&best.schedule) applySchedule(best.schedule,"⏱️ Tiempo agotado · mejor parcial: "+best.skipped+" sin colocar");
      cleanup("⏱️ Paralelo detenido a los 8 minutos","#f87171");
    }
  },480000);
}

// Los scripts de Firebase están en el mismo body antes que este <script>,
// así que cuando llegamos aquí ya están ejecutados.
// En modo Worker (generación paralela) NO se arranca la UI: el worker solo
// ejecuta el motor bajo demanda vía onmessage (ver runGenParallel).
if(typeof self==="undefined" || !self.WORKER_MODE) bootApp();
</script>
